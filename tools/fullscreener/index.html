<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>The Fullscreener</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--text:#14171c;--muted:#6b7280;--line:#e3e6eb;
  --accent:#2563eb;--accent-text:#fff;--danger:#dc2626;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013;--surface:#171a1f;--text:#eef0f3;--muted:#8b93a1;--line:#272b33;--accent:#4f8cff;--accent-text:#0b0d10;--danger:#f87171;}}
:root[data-theme="dark"]{--bg:#0e1013;--surface:#171a1f;--text:#eef0f3;--muted:#8b93a1;--line:#272b33;--accent:#4f8cff;--accent-text:#0b0d10;--danger:#f87171;}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{padding:28px 20px 20px;flex:none}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:600;font-size:16px}
.fs{background:var(--text);color:var(--bg);width:100%}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
.go{background:var(--accent);color:var(--accent-text)}
button:active{transform:scale(.98)}
.hint{color:var(--muted);font-size:12.5px;margin:10px 2px 0;min-height:16px}
.list{flex:1;overflow-y:auto;padding:0 20px 24px;-webkit-overflow-scrolling:touch}
.lh{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}
.lh h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.clear{background:none;color:var(--muted);min-height:32px;padding:0 6px;font-size:13px;font-weight:500}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 12px;margin-bottom:8px}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;color:var(--text);text-align:left;min-height:44px;padding:0;font-weight:500}
.dot{flex:none;width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent);text-transform:uppercase}
.txt{min-width:0}
.host{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{flex:none;background:none;color:var(--muted);width:40px;min-height:40px;padding:0;font-size:20px;line-height:1}
.del:active{color:var(--danger)}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:28px 10px;border:1px dashed var(--line);border-radius:14px}
#viewer{position:fixed;inset:0;background:#000;display:none;z-index:10}
#viewer.on{display:block}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:rgba(20,22,26,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.pill button{background:none;color:#fff;min-height:40px;padding:0 14px;font-size:14px;border-radius:999px}
.pill button:active{background:rgba(255,255,255,.15)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>The Fullscreener</h1>
    <p class="sub">Go fullscreen, then open any site and stay there.</p>
    <div class="card">
      <button class="fs" id="fs">Enter fullscreen</button>
      <form class="row" id="form" autocomplete="off">
        <input id="url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="example.com" aria-label="Website address">
        <button class="go" type="submit">Go</button>
      </form>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div class="list">
    <div class="lh"><h2>Visited</h2><button class="clear" id="clear" hidden>Clear all</button></div>
    <div id="items"></div>
  </div>
</div>

<div id="viewer">
  <iframe id="frame" allow="fullscreen; autoplay; clipboard-write; encrypted-media" referrerpolicy="no-referrer"></iframe>
  <div class="pill">
    <button id="back">← Back</button>
    <button id="ext">Open in tab ↗</button>
  </div>
</div>

<script>
(function(){
  var KEY="fullscreener:sites", MAX=30;
  var $=function(id){return document.getElementById(id)};
  var fsBtn=$("fs"), form=$("form"), input=$("url"), items=$("items"), clearBtn=$("clear"),
      viewer=$("viewer"), frame=$("frame"), hint=$("hint"), current="";
  var root=document.documentElement;
  var reqFS=root.requestFullscreen||root.webkitRequestFullscreen;
  var supported=!!reqFS && (document.fullscreenEnabled!==false);

  function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
  function save(l){try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}}
  var sites=load();

  function normalize(s){
    s=s.trim(); if(!s) return "";
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s="https://"+s;
    try{return new URL(s).href}catch(e){return ""}
  }
  function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}

  function render(){
    items.innerHTML="";
    clearBtn.hidden=!sites.length;
    if(!sites.length){
      var e=document.createElement("div");e.className="empty";e.textContent="Sites you visit will show up here.";items.appendChild(e);return;
    }
    sites.forEach(function(u){
      var d=document.createElement("div");d.className="item";
      var m=document.createElement("button");m.className="main";m.type="button";
      var dot=document.createElement("span");dot.className="dot";dot.textContent=hostOf(u).charAt(0);
      var t=document.createElement("span");t.className="txt";
      var h=document.createElement("span");h.className="host";h.textContent=hostOf(u);
      var f=document.createElement("span");f.className="full";f.textContent=u.replace(/^https?:\/\//,"");
      t.appendChild(h);t.appendChild(f);m.appendChild(dot);m.appendChild(t);
      m.onclick=function(){open(u)};
      var x=document.createElement("button");x.className="del";x.type="button";x.setAttribute("aria-label","Remove "+hostOf(u));x.textContent="×";
      x.onclick=function(){sites=sites.filter(function(s){return s!==u});save(sites);render()};
      d.appendChild(m);d.appendChild(x);items.appendChild(d);
    });
  }

  function open(u){
    current=u;
    sites=[u].concat(sites.filter(function(s){return s!==u})).slice(0,MAX);
    save(sites);render();
    frame.src=u;
    viewer.classList.add("on");
    input.blur();
  }
  function close(){viewer.classList.remove("on");frame.src="about:blank"}

  function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
  function updateBtn(){fsBtn.textContent=isFS()?"Exit fullscreen":"Enter fullscreen"}

  fsBtn.onclick=function(){
    if(!supported){hint.textContent="This browser doesn’t allow fullscreen for web pages. On iPhone, use Share → Add to Home Screen, then open it from there.";return}
    hint.textContent="";
    if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{
      var p=reqFS.call(root);
      if(p&&p.catch)p.catch(function(){hint.textContent="Fullscreen was blocked. Try again or open this page in its own tab."});
    }
  };
  document.addEventListener("fullscreenchange",updateBtn);
  document.addEventListener("webkitfullscreenchange",updateBtn);

  form.onsubmit=function(ev){
    ev.preventDefault();
    var u=normalize(input.value);
    if(!u){hint.textContent="Enter a valid website address.";return}
    hint.textContent="";open(u);input.value="";
  };
  $("back").onclick=close;
  $("ext").onclick=function(){if(current)window.open(current,"_blank","noopener")};
  clearBtn.onclick=function(){sites=[];save(sites);render()};

  if(!supported)hint.textContent="Fullscreen may not work on this browser. On iPhone, add this page to your Home Screen for a fullscreen experience.";
  render();updateBtn();
})();
</script>
</body>
</html>
