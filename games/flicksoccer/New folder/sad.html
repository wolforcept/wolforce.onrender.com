<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>P2P Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #eee;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h2 {
            color: #0f0;
            margin-bottom: 4px;
        }

        p.sub {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        button {
            padding: 10px 22px;
            margin-right: 10px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #0f0;
            color: #111;
        }

        button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        textarea {
            width: 100%;
            background: #0a0a0a;
            color: #0f0;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 0.8rem;
            padding: 8px;
            margin-top: 8px;
            resize: vertical;
        }

        input[type=text] {
            width: 100%;
            background: #0a0a0a;
            color: #eee;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 8px;
            margin-top: 8px;
        }

        label {
            font-size: 0.8rem;
            color: #888;
            display: block;
            margin-top: 18px;
        }

        .section {
            margin-top: 24px;
        }

        .hidden {
            display: none;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ff0;
        }

        #status.connected {
            color: #0f0;
        }

        #chat {
            margin-top: 30px;
        }

        #messages {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        #messages .me {
            color: #0ff;
        }

        #messages .them {
            color: #f80;
        }

        #msgRow {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        #msgInput {
            flex: 1;
        }
    </style>
</head>

<body>

    <h2>P2P Demo</h2>
    <p class="sub">No server. WebRTC DataChannel + Google's free STUN.</p>

    <!-- Step 0: choose role -->
    <div id="roleScreen">
        <button id="btnHost">Host</button>
        <button id="btnJoin">Join</button>
    </div>

    <div id="status"></div>

    <!-- HOST FLOW -->
    <div id="hostFlow" class="hidden">

        <div class="section">
            <label>① Your offer code — copy and send this to the other person:</label>
            <textarea id="offerOut" rows="5" readonly></textarea>
        </div>

        <div class="section">
            <label>② Paste the answer code they send back:</label>
            <input type="text" id="answerIn" placeholder="Paste answer here…">
            <button id="btnSetAnswer" style="margin-top:8px" disabled>Connect</button>
        </div>

    </div>

    <!-- JOIN FLOW -->
    <div id="joinFlow" class="hidden">

        <div class="section">
            <label>① Paste the host's offer code:</label>
            <input type="text" id="offerIn" placeholder="Paste offer here…">
            <button id="btnMakeAnswer" style="margin-top:8px">Generate Answer</button>
        </div>

        <div class="section hidden" id="answerOutSection">
            <label>② Your answer code — copy and send this back to the host:</label>
            <textarea id="answerOut" rows="5" readonly></textarea>
        </div>

    </div>

    <!-- CHAT (shown once connected) -->
    <div id="chat" class="hidden">
        <div id="messages"></div>
        <div id="msgRow">
            <input type="text" id="msgInput" placeholder="Type a message…">
            <button id="btnSend">Send</button>
        </div>
    </div>

    <script>
        // ─── CONFIG ──────────────────────────────────────────────────────────────────
        const ICE_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // ─── STATE ───────────────────────────────────────────────────────────────────
        let pc = null;       // RTCPeerConnection
        let dc = null;       // RTCDataChannel (host creates it, joiner receives it)

        // ─── HELPERS ─────────────────────────────────────────────────────────────────
        function setStatus(msg, connected = false) {
            $('#status').text(msg).toggleClass('connected', connected);
        }

        // Wait until ICE gathering is complete, then return the full SDP as a string.
        // We encode it as base64 so it's easy to copy as one line.
        function waitForIce(pc) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') {
                    resolve(btoa(JSON.stringify(pc.localDescription)));
                    return;
                }
                pc.onicegatheringstatechange = () => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve(btoa(JSON.stringify(pc.localDescription)));
                    }
                };
            });
        }

        function decode(str) {
            return JSON.parse(atob(str.trim()));
        }

        function onConnected() {
            setStatus('✅ Connected! You can chat now.', true);
            $('#chat').removeClass('hidden');
        }

        function setupDC(channel) {
            dc = channel;
            dc.onopen = () => onConnected();
            dc.onclose = () => setStatus('❌ Connection closed.');
            dc.onmessage = e => {
                $('#messages').append(`<div class="them">them: ${$('<span>').text(e.data).html()}</div>`);
                $('#messages').scrollTop($('#messages')[0].scrollHeight);
            };
        }

        // ─── HOST ─────────────────────────────────────────────────────────────────────
        $('#btnHost').on('click', async () => {
            $('#roleScreen').addClass('hidden');
            $('#hostFlow').removeClass('hidden');
            setStatus('Creating offer…');

            pc = new RTCPeerConnection(ICE_CONFIG);

            // Host creates the data channel
            dc = pc.createDataChannel('chat');
            setupDC(dc);

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed') setStatus('❌ Connection failed.');
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            setStatus('Gathering ICE candidates…');
            const code = await waitForIce(pc);
            $('#offerOut').val(code);
            $('#answerIn').prop('disabled', false);
            $('#btnSetAnswer').prop('disabled', false);
            setStatus('Send the offer code above to the other person, then paste their answer below.');
        });

        $('#btnSetAnswer').on('click', async () => {
            const raw = $('#answerIn').val().trim();
            if (!raw) return;
            try {
                const answer = decode(raw);
                await pc.setRemoteDescription(answer);
                setStatus('Answer set — waiting for connection…');
            } catch (e) {
                setStatus('❌ Bad answer code. Try again.');
                console.error(e);
            }
        });

        // ─── JOIN ─────────────────────────────────────────────────────────────────────
        $('#btnJoin').on('click', () => {
            $('#roleScreen').addClass('hidden');
            $('#joinFlow').removeClass('hidden');
            setStatus('Paste the host\'s offer code and click Generate Answer.');
        });

        $('#btnMakeAnswer').on('click', async () => {
            const raw = $('#offerIn').val().trim();
            if (!raw) return;

            try {
                const offer = decode(raw);

                pc = new RTCPeerConnection(ICE_CONFIG);

                // Joiner receives the data channel
                pc.ondatachannel = e => setupDC(e.channel);

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'failed') setStatus('❌ Connection failed.');
                };

                await pc.setRemoteDescription(offer);
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                setStatus('Gathering ICE candidates…');
                const code = await waitForIce(pc);
                $('#answerOut').val(code);
                $('#answerOutSection').removeClass('hidden');
                setStatus('Copy the answer code above and send it back to the host.');

            } catch (e) {
                setStatus('❌ Bad offer code. Try again.');
                console.error(e);
            }
        });

        // ─── CHAT ─────────────────────────────────────────────────────────────────────
        $('#btnSend').on('click', sendMsg);
        $('#msgInput').on('keydown', e => { if (e.key === 'Enter') sendMsg(); });

        function sendMsg() {
            const text = $('#msgInput').val().trim();
            if (!text || !dc || dc.readyState !== 'open') return;
            dc.send(text);
            $('#messages').append(`<div class="me">me: ${$('<span>').text(text).html()}</div>`);
            $('#messages').scrollTop($('#messages')[0].scrollHeight);
            $('#msgInput').val('');
        }
    </script>
</body>

</html>
