        // ──────────────────────────────────────────────
        // HELPERS
        // ──────────────────────────────────────────────
        function upgCost(def, lv) { return Math.floor(def.cb * Math.pow(def.cm, lv)); }
        function getQ(temp, metalId, researched, qLv) {
            const m = METALS[metalId]; if (!m) return 1;
            const diff = Math.abs(temp - m.meltTemp);
            let q = diff < 15 ? 5 : diff < 40 ? 4 : diff < 90 ? 3 : diff < 150 ? 2 : 1;
            if (researched.has('quenching') && q < 5) q = Math.min(5, q + 1);
            if (researched.has('pyrometer') && diff < 25) q = 5;
            q = Math.min(5, q + (QUENCH_LV[qLv || 0].qBonus | 0));
            return q;
        }
        function qMult(q) { return [0, .5, .75, 1, 1.5, 2.2][q] || 1; }
        function metalMult(m) {
            return {
                iron: 1, copper: 1.6, tin: 1.2, zinc: 1.1, lead: .9, bronze: 2.4, brass: 2.2, pewter: 1.8,
                steel: 4, silver: 5, gold_m: 9, electrum: 7, mithril: 20, adamant: 18, void_steel: 40,
                titanium: 35, orichalcum: 80
            }[m] || 1;
        }
        function itemVal(moldId, metalId, q, res) {
            const mo = MOLDS[moldId]; if (!mo) return 0;
            const trLv = 0; // passed in
            const masterBonus = res.has('masterForge') ? 1.7 : 1;
            const grandBonus = res.has('grandForge') ? 2 : 1;
            return Math.round(mo.v * metalMult(metalId) * qMult(q) * masterBonus * grandBonus);
        }
        function itemValFull(moldId, metalId, q, res, trLv) {
            const base = itemVal(moldId, metalId, q, res);
            return Math.round(base * (TRADE_LV[trLv || 0].bonus));
        }
        function fmtN(n) {
            if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return Math.floor(n) + '';
        }
        function getRank(r) {
            if (r >= 500000) return 'Legendary Grandmaster';
            if (r >= 120000) return 'Grand Master Smith';
            if (r >= 35000) return 'Master Smith';
            if (r >= 7000) return 'Journeyman Smith';
            if (r >= 2000) return 'Craftsman';
            if (r >= 500) return 'Apprentice';
            if (r >= 150) return 'Novice';
            return 'Greenhand';
        }
        function getEra(res) {
            if (res.has('rOrichalcum')) return 4;
            if (res.has('rVoid')) return 3;
            if (res.has('rSteel')) return 2;
            if (res.has('rBronze')) return 1;
            return 0;
        }
        function fmtItem(key) {
            for (const mid of Object.keys(METALS)) {
                if (key.startsWith(mid + '_')) {
                    const moldId = key.slice(mid.length + 1);
                    const mo = MOLDS[moldId];
                    return `${METALS[mid].name} ${mo ? mo.name : moldId}`;
                }
            }
            return key;
        }
        function getCruMetal(cruc) {
            const ks = Object.keys(cruc).filter(k => cruc[k] > 0);
            if (!ks.length) return null;
            if (ks.length === 1) return ks[0];
            return 'mixed';
        }
        function getAlloy(cruc, res) {
            const total = Object.values(cruc).reduce((a, b) => a + b, 0);
            if (total < 0.5) return null;
            for (const [mid, m] of Object.entries(METALS)) {
                if (!m.alloy || !res.has(mid)) continue;
                const comps = Object.keys(m.alloy);
                const present = Object.keys(cruc).filter(k => cruc[k] > 0.01);
                if (present.some(k => !comps.includes(k))) continue;
                let ok = true;
                for (const [comp, ratio] of Object.entries(m.alloy)) {
                    if (Math.abs((cruc[comp] || 0) / total - ratio) > m.tol) { ok = false; break; }
                }
                if (ok) return mid;
            }
            return null;
        }

        function genVeins(res, era) {
            const add = (oreId, n) => {
                const ore = ORES[oreId]; if (!ore) return [];
                return Array.from({ length: n }, (_, i) => {
                    const mxHp = 10 + Math.floor(Math.random() * 8);
                    return { id: oreId + '_' + i, oreId, hp: mxHp, maxHp: mxHp, regenTimer: 0 };
                });
            };
            let v = [...add('iron', 4), ...add('coal', 3)];
            if (res.has('copper')) v = [...v, ...add('copper', 3)];
            if (res.has('tin')) v = [...v, ...add('tin', 3)];
            if (res.has('zinc')) v = [...v, ...add('zinc', 2)];
            if (res.has('lead')) v = [...v, ...add('lead', 2)];
            if (res.has('coal_flux')) v = [...v, ...add('coal_flux', 2)];
            if (res.has('silver')) v = [...v, ...add('silver', 2)];
            if (res.has('gold_m')) v = [...v, ...add('gold_ore', 2)];
            if (res.has('mithril')) v = [...v, ...add('mithril', 2)];
            if (res.has('adamant')) v = [...v, ...add('adamant', 2)];
            if (res.has('titanium')) v = [...v, ...add('titanium', 2)];
            return v;
        }

        // ──────────────────────────────────────────────
        // INITIAL STATE
        // ──────────────────────────────────────────────
        function initGs() {
            return {
                gold: 50, ores: { iron: 40, coal: 30 },
                fLv: 0, bLv: 0, cLv: 0, sLv: 0, qLv: 0, mrLv: 0, trLv: 0,
                temp: 0, furnaceOn: false,
                bellowsTimer: 0, // seconds of boost remaining
                crucible: {}, crucibleTotal: 0,
                queue: [], selectedMold: 'ingot',
                inventory: {}, // key -> [{qty,quality}]
                pickaxe: 'hands',
                researched: new Set(),
                completedContracts: new Set(),
                activeContract: null,
                rating: 0, totalGold: 0,
                log: ['Welcome to Ironworks. Start by mining ore and lighting the furnace.'],
                tick: 0,
            };
        }

        // ──────────────────────────────────────────────
        // APP
        // ──────────────────────────────────────────────
        function App() {
            const [gs, setGs] = useState(initGs);
            const [ltab, setLtab] = useState('mine');
            const [rtab, setRtab] = useState('upgrades');
            const [toasts, setToasts] = useState([]);
            const [sparks, setSparks] = useState([]);
            const [opops, setOpops] = useState([]);
            const [veins, setVeins] = useState(() => genVeins(new Set(), 0));
            const resRef = useRef(gs.researched);

            function toast(msg, type = '') {
                const id = Date.now() + Math.random();
                setToasts(t => [...t.slice(-4), { id, msg, type }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
            }
            function addLog(msg) { setGs(s => ({ ...s, log: [msg, ...s.log.slice(0, 40)] })) }
            function spk(e) {
                if (!e?.currentTarget) return;
                const r = e.currentTarget.getBoundingClientRect();
                const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                const ns = Array.from({ length: 6 }, (_, i) => ({ id: Date.now() + i, dx: (Math.random() - .5) * 55, dy: -(Math.random() * 45 + 12), x: cx, y: cy }));
                setSparks(s => [...s, ...ns]);
                setTimeout(() => setSparks(s => s.filter(x => !ns.some(n => n.id === x.id))), 600);
            }
            function opop(x, y, txt, color) {
                const id = Date.now() + Math.random();
                setOpops(p => [...p, { id, x, y, txt, color }]);
                setTimeout(() => setOpops(p => p.filter(q => q.id !== id)), 900);
            }

            // MAIN TICK
            useEffect(() => {
                const INT = 200, DT = .2;
                const t = setInterval(() => {
                    setGs(prev => {
                        const s = { ...prev, tick: (prev.tick || 0) + 1 };
                        const fD = FURNACE_LV[s.fLv];
                        const cD = CRUCIBLE_LV[s.cLv];
                        const stD = STORAGE_LV[s.sLv];
                        const qD = QUENCH_LV[s.qLv];
                        const mrD = MOLD_RACK_LV[s.mrLv];
                        s.oreMax = stD.oMax; s.coalMax = stD.cMax;

                        // TEMP
                        if (s.furnaceOn && s.ores.coal > 0) {
                            let hR = fD.hR;
                            // Bellows boost: boost timer drives extra heat rate
                            if (s.bellowsTimer > 0) {
                                const bD = BELLOWS_LV[s.bLv];
                                hR += bD.boost * (s.bellowsTimer / bD.dur);
                                s.bellowsTimer = Math.max(0, s.bellowsTimer - DT);
                            }
                            s.temp = Math.min(fD.maxT, s.temp + hR * DT * .5);
                            let fC = fD.fU * DT * (s.temp > fD.maxT * .88 ? 2.5 : 1);
                            const ores = { ...s.ores };
                            ores.coal = Math.max(0, ores.coal - fC);
                            s.ores = ores;
                            if (s.ores.coal <= 0) s.furnaceOn = false;
                        } else {
                            s.bellowsTimer = 0;
                            s.temp = Math.max(0, s.temp - fD.cR * DT * .1);
                        }

                        // OVERHEAT: burn molten metal above maxT
                        if (s.crucibleTotal > 0) {
                            const cm = getCruMetal(s.crucible);
                            if (cm && cm !== 'mixed') {
                                const metal = METALS[cm];
                                if (metal && s.temp > metal.maxTemp) {
                                    const burn = s.crucibleTotal * .004 * DT;
                                    const ratio = Math.max(0, (s.crucibleTotal - burn) / s.crucibleTotal);
                                    const nc = {}; let nt = 0;
                                    for (const [k, v] of Object.entries(s.crucible)) { nc[k] = v * ratio; nt += v * ratio; }
                                    s.crucible = nc; s.crucibleTotal = nt;
                                }
                            }
                            // Void instability
                            if (cm === 'mixed' && s.researched.has('void_steel') && s.tick % 10 === 0) {
                                s.temp = Math.max(0, Math.min(fD.maxT, s.temp + (Math.random() - .5) * 50));
                            }
                        }

                        // BELLOWS CD
                        if (s.bellowsCD > 0) s.bellowsCD = Math.max(0, s.bellowsCD - INT);

                        // AUTO-MINE
                        if (s.researched.has('autoMine') && s.tick % 25 === 0) {
                            const pick = PICKAXES.find(p => p.id === s.pickaxe) || PICKAXES[0];
                            const ores2 = { ...s.ores };
                            for (const oid of Object.keys(ORES)) {
                                if (!['iron', 'coal'].includes(oid) && !s.researched.has(oid) && !s.researched.has(oid.replace('_ore', '').replace('_m', '')) && !s.researched.has('r' + oid.charAt(0).toUpperCase() + oid.slice(1))) continue;
                                const isC = oid === 'coal' || oid === 'coal_flux';
                                const cap2 = isC ? s.coalMax : s.oreMax;
                                const cur = ores2[oid] || 0;
                                if (cur < cap2) ores2[oid] = Math.min(cap2, cur + Math.ceil(pick.yield / 3));
                            }
                            s.ores = ores2;
                        }

                        // AUTO-CAST
                        if (s.researched.has('autoMold') && s.tick % 10 === 0) {
                            const mold = MOLDS[s.selectedMold];
                            const alloyR = getAlloy(s.crucible, s.researched);
                            const cm2 = getCruMetal(s.crucible);
                            const mid = alloyR || (cm2 === 'mixed' ? null : cm2);
                            if (mold && mid && mid !== 'mixed' && s.crucibleTotal >= mold.m && s.queue.length < mrD.slots) {
                                const q = getQ(s.temp, mid, s.researched, s.qLv);
                                const ratio2 = (s.crucibleTotal - mold.m) / Math.max(.001, s.crucibleTotal);
                                const nc2 = {}; let nt2 = 0;
                                for (const [k, v] of Object.entries(s.crucible)) { nc2[k] = v * ratio2; nt2 += v * ratio2; }
                                s.crucible = nc2; s.crucibleTotal = nt2;
                                s.queue = [...s.queue, { id: Math.random().toString(36).slice(2), moldId: s.selectedMold, metalId: mid, quality: q, timeLeft: mold.t / qD.cFast, totalTime: mold.t / qD.cFast }];
                            }
                        }

                        // QUEUE
                        if (s.queue.length > 0) {
                            const q2 = s.queue.map(ci => ({ ...ci, timeLeft: ci.timeLeft - DT }));
                            const done = q2.filter(ci => ci.timeLeft <= 0);
                            s.queue = q2.filter(ci => ci.timeLeft > 0);
                            if (done.length > 0) {
                                const inv = { ...s.inventory };
                                for (const ci of done) {
                                    const key = ci.metalId + '_' + ci.moldId;
                                    if (!inv[key]) inv[key] = [];
                                    const existing = inv[key].find(e => e.quality === ci.quality);
                                    if (existing) existing.qty++;
                                    else inv[key].push({ qty: 1, quality: ci.quality });
                                    s.rating += Math.ceil(itemValFull(ci.moldId, ci.metalId, ci.quality, s.researched, s.trLv) * .03);
                                }
                                s.inventory = inv;
                            }
                        }
                        return s;
                    });
                }, INT);
                return () => clearInterval(t);
            }, []);

            // refresh veins on research change
            const resSize = gs.researched.size;
            useEffect(() => {
                setVeins(genVeins(gs.researched, getEra(gs.researched)));
            }, [resSize]);

            // ACTIONS
            function toggleFurnace() {
                setGs(s => {
                    if (!s.furnaceOn && (s.ores.coal || 0) <= 0) { toast('No coal! Mine coal first.', 'bad'); return s; }
                    return { ...s, furnaceOn: !s.furnaceOn };
                });
            }

            function pumpBellows(e) {
                spk(e);
                setGs(s => {
                    if (s.bellowsCD > 0) return s;
                    if (!s.furnaceOn) { toast('Light the furnace first!', 'bad'); return s; }
                    const bD = BELLOWS_LV[s.bLv];
                    return { ...s, bellowsTimer: bD.dur, bellowsCD: bD.cd };
                });
            }

            function mineVein(vein, e) {
                if (vein.hp <= 0) return;
                const pick = PICKAXES.find(p => p.id === gs.pickaxe) || PICKAXES[0];
                const oreId = vein.oreId;
                const ore = ORES[oreId];
                if (e) {
                    const r = e.currentTarget.getBoundingClientRect();
                    const cx = r.left + r.width / 2, cy = r.top;
                    const ns = Array.from({ length: 4 }, (_, i) => ({ id: Date.now() + i, dx: (Math.random() - .5) * 40, dy: -(Math.random() * 28 + 8), x: cx, y: cy }));
                    setSparks(s => [...s, ...ns]);
                    setTimeout(() => setSparks(s => s.filter(x => !ns.some(n => n.id === x.id))), 550);
                    opop(cx, cy, '+' + pick.yield, ore.color);
                }
                setVeins(vs => vs.map(v => {
                    if (v.id !== vein.id) return v;
                    const nh = Math.max(0, v.hp - 1);
                    return { ...v, hp: nh, regenTimer: nh === 0 ? 14 : v.regenTimer };
                }));
                setGs(s => {
                    const ores = { ...s.ores };
                    const isC = oreId === 'coal' || oreId === 'coal_flux';
                    const cap = isC ? s.coalMax : s.oreMax;
                    const cur = ores[oreId] || 0;
                    const add = Math.min(pick.yield, cap - cur);
                    if (add <= 0) { toast(`${ore.name} storage full!`, 'bad'); return s; }
                    ores[oreId] = cur + add;
                    return { ...s, ores };
                });
            }

            useEffect(() => {
                const t = setInterval(() => {
                    setVeins(vs => vs.map(v => {
                        if (v.hp > 0) return v;
                        const rt = v.regenTimer - 1;
                        if (rt <= 0) return { ...v, hp: v.maxHp, regenTimer: 0 };
                        return { ...v, regenTimer: rt };
                    }));
                }, 1000);
                return () => clearInterval(t);
            }, []);

            function smeltOre(oreId) {
                setGs(s => {
                    const metal = Object.entries(METALS).find(([, m]) => m.oreKey === oreId);
                    if (!metal) { toast('Cannot smelt this directly.', 'bad'); return s; }
                    const [metalId, mDef] = metal;
                    if (s.temp < mDef.meltTemp - 80) { toast(`Need ~${mDef.meltTemp}°C. At ${Math.round(s.temp)}°C`, 'bad'); return s; }
                    const have = s.ores[oreId] || 0;
                    if (have < 1) { toast(`No ${ORES[oreId]?.name} in storage!`, 'bad'); return s; }
                    const cDef = CRUCIBLE_LV[s.cLv];
                    const space = cDef.cap - s.crucibleTotal;
                    if (space < 1) { toast('Crucible is full!', 'bad'); return s; }
                    const amt = Math.min(have, 8, space);
                    const ores = { ...s.ores, [oreId]: have - amt };
                    const cruc = { ...s.crucible, [metalId]: (s.crucible[metalId] || 0) + amt };
                    return { ...s, ores, crucible: cruc, crucibleTotal: s.crucibleTotal + amt };
                });
            }

            function dumpCrucible() {
                setGs(s => {
                    toast('Crucible dumped — metal wasted.', 'bad');
                    addLog('Crucible contents dumped.');
                    return { ...s, crucible: {}, crucibleTotal: 0 };
                });
            }

            function castMold() {
                setGs(s => {
                    const mold = MOLDS[s.selectedMold];
                    if (!mold) return s;
                    const alloyR = getAlloy(s.crucible, s.researched);
                    const cm = getCruMetal(s.crucible);
                    const metalId = alloyR || (cm === 'mixed' ? null : cm);
                    if (!metalId) {
                        toast(cm === 'mixed' ? 'Bad alloy ratio — check indicator.' : 'Crucible empty.', 'bad');
                        return s;
                    }
                    const mrD = MOLD_RACK_LV[s.mrLv];
                    if (s.queue.length >= mrD.slots) { toast('Queue is full!', 'bad'); return s; }
                    if (s.crucibleTotal < mold.m) { toast(`Need ${mold.m} metal, have ${Math.floor(s.crucibleTotal)}.`, 'bad'); return s; }
                    const q = getQ(s.temp, metalId, s.researched, s.qLv);
                    const qD = QUENCH_LV[s.qLv];
                    const ratio = (s.crucibleTotal - mold.m) / Math.max(.001, s.crucibleTotal);
                    const nc = {}; let nt = 0;
                    for (const [k, v] of Object.entries(s.crucible)) { nc[k] = v * ratio; nt += v * ratio; }
                    return {
                        ...s, crucible: nc, crucibleTotal: nt,
                        queue: [...s.queue, { id: Math.random().toString(36).slice(2), moldId: s.selectedMold, metalId, quality: q, timeLeft: mold.t / qD.cFast, totalTime: mold.t / qD.cFast }]
                    };
                });
            }

            function sellOne(key, quality) {
                setGs(s => {
                    const inv = { ...s.inventory };
                    if (!inv[key]) return s;
                    const parts = extractMetal(key);
                    if (!parts) return s;
                    const val = itemValFull(parts.moldId, parts.metalId, quality, s.researched, s.trLv);
                    let found = false;
                    inv[key] = inv[key].map(e => {
                        if (found || e.quality !== quality) return e;
                        found = true; return { ...e, qty: e.qty - 1 };
                    }).filter(e => e.qty > 0);
                    if (!inv[key].length) delete inv[key];
                    toast(`Sold 1x ${fmtItem(key)} Q${quality} for ${fmtN(val)}g`, 'good');
                    return { ...s, inventory: inv, gold: s.gold + val, totalGold: s.totalGold + val, rating: s.rating + Math.ceil(val * .08) };
                });
            }

            function sellAll(key) {
                setGs(s => {
                    const inv = { ...s.inventory };
                    if (!inv[key]) return s;
                    const parts = extractMetal(key);
                    if (!parts) return s;
                    let total = 0; let qty = 0;
                    for (const e of inv[key]) { total += itemValFull(parts.moldId, parts.metalId, e.quality, s.researched, s.trLv) * e.qty; qty += e.qty; }
                    delete inv[key];
                    toast(`Sold all ${fmtItem(key)} for ${fmtN(total)}g`, 'good');
                    return { ...s, inventory: inv, gold: s.gold + total, totalGold: s.totalGold + total, rating: s.rating + Math.ceil(total * .08) };
                });
            }

            function extractMetal(key) {
                for (const mid of Object.keys(METALS)) {
                    if (key.startsWith(mid + '_')) {
                        return { metalId: mid, moldId: key.slice(mid.length + 1) };
                    }
                }
                return null;
            }

            function doUpgrade(def) {
                setGs(s => {
                    const lv = s[def.lk] || 0;
                    if (lv >= def.lvs.length - 1) { toast('Already maxed!', 'bad'); return s; }
                    const cost = upgCost(def, lv);
                    if (s.gold < cost) { toast('Not enough gold!', 'bad'); return s; }
                    addLog(`Upgraded ${def.name} → ${def.lvs[lv + 1].name}`);
                    toast(`${def.name} upgraded!`, 'good');
                    return { ...s, gold: s.gold - cost, [def.lk]: lv + 1 };
                });
            }

            function doResearch(res) {
                setGs(s => {
                    if (s.researched.has(res.id)) return s;
                    if (res.pre.some(p => !s.researched.has(p))) { toast('Prerequisites not met!', 'bad'); return s; }
                    if (s.gold < res.cost) { toast('Not enough gold!', 'bad'); return s; }
                    const nr = new Set(s.researched); nr.add(res.id); if (res.ul) nr.add(res.ul);
                    addLog(`Discovered: ${res.name}`);
                    toast(`Research: ${res.name}!`, 'good');
                    setTimeout(() => setVeins(genVeins(nr, getEra(nr))), 50);
                    return { ...s, gold: s.gold - res.cost, researched: nr };
                });
            }

            function buyPickaxe(pick) {
                if (!pick.cost) return;
                setGs(s => {
                    const inv = { ...s.inventory };
                    for (const [k, need] of Object.entries(pick.cost)) {
                        const have = (inv[k] || []).reduce((a, e) => a + e.qty, 0);
                        if (have < need) { toast(`Need ${need}x ${fmtItem(k)} to craft.`, 'bad'); return s; }
                    }
                    for (const [k, need] of Object.entries(pick.cost)) {
                        let rem = need;
                        inv[k] = (inv[k] || []).map(e => {
                            if (rem <= 0) return e;
                            const take = Math.min(e.qty, rem); rem -= take;
                            return { ...e, qty: e.qty - take };
                        }).filter(e => e.qty > 0);
                        if (!inv[k]?.length) delete inv[k];
                    }
                    addLog(`Crafted ${pick.name}`);
                    toast(`Crafted ${pick.name}!`, 'good');
                    return { ...s, inventory: inv, pickaxe: pick.id };
                });
            }

            function activateContract(id) { setGs(s => ({ ...s, activeContract: id })); }

            function fulfillContract(con) {
                setGs(s => {
                    const inv = { ...s.inventory };
                    for (const req of con.reqs) {
                        const entries = inv[req.i] || [];
                        const haveQ = entries.filter(e => e.quality >= req.qm).reduce((a, e) => a + e.qty, 0);
                        if (haveQ < req.q) { toast('Requirements not met (check quality)!', 'bad'); return s; }
                    }
                    for (const req of con.reqs) {
                        let rem = req.q;
                        inv[req.i] = (inv[req.i] || []).map(e => {
                            if (rem <= 0 || e.quality < req.qm) return e;
                            const take = Math.min(e.qty, rem); rem -= take;
                            return { ...e, qty: e.qty - take };
                        }).filter(e => e.qty > 0);
                        if (!inv[req.i]?.length) delete inv[req.i];
                    }
                    const nc = new Set(s.completedContracts); nc.add(con.id);
                    addLog(con.story);
                    toast(`Fulfilled: ${con.name}! +${fmtN(con.rwd.g)}g`, 'good');
                    return { ...s, inventory: inv, gold: s.gold + con.rwd.g, totalGold: s.totalGold + con.rwd.g, rating: s.rating + con.rwd.r, completedContracts: nc, activeContract: null };
                });
            }

            // DERIVED
            const fD = FURNACE_LV[gs.fLv], bD = BELLOWS_LV[gs.bLv], cD = CRUCIBLE_LV[gs.cLv];
            const mrD = MOLD_RACK_LV[gs.mrLv];
            const tempPct = gs.temp / fD.maxT;
            const tempColor = gs.temp < 80 ? '#441400' : gs.temp < 350 ? '#8a2200' : gs.temp < 600 ? '#e05000' : gs.temp < 900 ? '#ffa000' : '#ffe060';
            const alloyR = getAlloy(gs.crucible, gs.researched);
            const cm = getCruMetal(gs.crucible);
            const displayMetal = alloyR || (cm === 'mixed' ? null : cm);
            const era = getEra(gs.researched);
            const isBadMix = cm === 'mixed' && !alloyR;
            const availMolds = Object.entries(MOLDS).filter(([id, m]) => m.always || gs.researched.has(m.unlock));
            const invEntries = Object.entries(gs.inventory).filter(([, v]) => v?.some(e => e.qty > 0));
            const smeltOres = Object.entries(ORES).filter(([oid]) => {
                const metal = Object.entries(METALS).find(([, m]) => m.oreKey === oid);
                if (!metal) return false;
                const [mid] = metal;
                return (gs.ores[oid] || 0) > 0 && (mid === 'iron' || gs.researched.has(mid) || gs.researched.has('r' + mid.charAt(0).toUpperCase() + mid.slice(1)));
            });

            return h('div', { class: 'app' },
                sparks.map(sp => h('div', { key: sp.id, class: 'spark', style: { left: sp.x + 'px', top: sp.y + 'px', '--dx': sp.dx + 'px', '--dy': sp.dy + 'px' } })),
                opops.map(p => h('div', { key: p.id, class: 'opop', style: { left: p.x + 'px', top: p.y + 'px', color: p.color } }, p.txt)),
                h('div', { class: 'toasts' }, toasts.map(t => h('div', { key: t.id, class: `toast ${t.type}` }, t.msg))),

                h('header', { class: 'header' },
                    h('span', { class: 'h1' }, '⚒ IRONWORKS'),
                    h('div', { class: 'hstat' }, h('span', { class: 'lbl' }, 'Rating'), h('span', { class: 'val' }, fmtN(gs.rating))),
                    h('span', { class: 'hrank' }, getRank(gs.rating)),
                    h('div', { class: 'hstat' }, h('span', { class: 'lbl' }, 'Era'), h('span', { class: 'val', style: 'font-size:14px;color:var(--accent)' }, ERA[era])),
                    h('div', { class: 'hgold' }, h('i', { class: 'fa-solid fa-coins', style: 'font-size:15px' }), fmtN(gs.gold), ' g')
                ),

                h('main', { class: 'main' },
                    // LEFT
                    h('aside', { class: 'panel' },
                        h('div', { class: 'tabs' },
                            h('button', { class: `tab ${ltab === 'mine' ? 'on' : ''}`, onClick: () => setLtab('mine') }, '⛏ Mine'),
                            h('button', { class: `tab ${ltab === 'stock' ? 'on' : ''}`, onClick: () => setLtab('stock') }, '📦 Stock'),
                        ),
                        ltab === 'mine' && h(MineTab, { gs, veins, onMine: mineVein, onBuy: buyPickaxe }),
                        ltab === 'stock' && h(StockTab, { gs }),
                    ),

                    // CENTER
                    h('section', { class: 'workshop' },
                        // SMELTERY
                        h('div', { class: 'smelt-sec' },
                            // LEFT of smeltery: crucible display + smelt buttons
                            h('div', { class: 'smelt-left' },
                                h(CrucibleDisplay, { gs, alloyR, displayMetal, isBadMix, onDump: dumpCrucible }),
                                h('div', { class: 'smelt-btns', style: 'margin-top:7px' },
                                    smeltOres.length === 0
                                        ? h('span', { class: 'empty', style: 'font-size:var(--fss)' }, 'Mine ore to smelt')
                                        : smeltOres.map(([oid, ore]) => {
                                            const metal = Object.entries(METALS).find(([, m]) => m.oreKey === oid);
                                            const [mid, mDef] = metal || ['?', { meltTemp: 9999 }];
                                            const canSmelt = gs.temp >= mDef.meltTemp - 80;
                                            return h('button', {
                                                key: oid, class: 'btn sm full',
                                                style: `border-color:${ore.color}50;color:${ore.color};`,
                                                onClick: () => smeltOre(oid), disabled: !canSmelt
                                            },
                                                h('i', { class: `fa-solid ${ore.icon}`, style: 'font-size:12px' }),
                                                `Smelt ${METALS[mid]?.name || mid} (${Math.floor(gs.ores[oid] || 0)})`
                                            );
                                        })
                                ),
                            ),
                            // RIGHT of smeltery: temp + furnace controls
                            h('div', { class: 'smelt-right' },
                                h('div', { class: 'temp-sec' },
                                    h('div', { style: 'display:flex;align-items:baseline;gap:10px' },
                                        h('span', { class: 'temp-num', style: `color:${tempColor}` }, Math.round(gs.temp) + '°C'),
                                        h('span', { style: 'font-size:var(--fss);color:var(--text2)' }, fD.name),
                                        gs.temp > fD.maxT * .88 && h('span', { style: 'font-size:var(--fss);color:var(--red);animation:blink-r 1s infinite' }, '⚠ OVERHEAT'),
                                    ),
                                    h('div', { class: 'temp-bar-bg', style: 'margin-top:6px' },
                                        h('div', { class: 'temp-bar-fg', style: `width:${tempPct * 100}%;background:${tempColor}` }),
                                    ),
                                    h('div', { class: 'temp-refs' },
                                        Object.entries(METALS).filter(([mid]) => mid === 'iron' || gs.researched.has(mid) || gs.researched.has('r' + mid.charAt(0).toUpperCase() + mid.slice(1))).map(([mid, m]) => {
                                            const pct = Math.min(100, (m.meltTemp / fD.maxT) * 100);
                                            return h('span', { key: mid, class: 'temp-ref', style: `color:${m.color};border:1px solid ${m.color}40` }, `${m.name}:${m.meltTemp}°`);
                                        })
                                    ),
                                    // Bellows boost bar
                                    gs.bellowsTimer > 0 && h('div', null,
                                        h('div', { style: 'font-size:var(--fss);color:var(--accent);margin-top:4px' },
                                            `Bellows boosting: ${gs.bellowsTimer.toFixed(1)}s`
                                        ),
                                        h('div', { class: 'bellows-boost' },
                                            h('div', { class: 'bellows-boost-bar', style: `width:${(gs.bellowsTimer / bD.dur) * 100}%` })
                                        )
                                    ),
                                ),
                                h('div', { class: 'furnace-btns', style: 'margin-top:10px' },
                                    h('button', {
                                        class: `btn pri`, onClick: toggleFurnace,
                                        style: gs.furnaceOn ? 'border-color:#ff6600;color:#ff6600;background:rgba(255,102,0,.12)' : ''
                                    },
                                        h('i', { class: gs.furnaceOn ? 'fa-solid fa-fire' : 'fa-solid fa-fire-flame-simple' }),
                                        gs.furnaceOn ? 'Douse' : 'Light Furnace'
                                    ),
                                    h('button', {
                                        class: `btn ${gs.bellowsTimer > 0 ? 'active-b' : ''}`, onClick: pumpBellows,
                                        disabled: !gs.furnaceOn || gs.bellowsCD > 0
                                    },
                                        h('i', { class: 'fa-solid fa-wind' }),
                                        gs.bellowsCD > 0 ? `CD ${Math.ceil(gs.bellowsCD / 1000)}s` : `Bellows +${bD.boost}° / ${bD.dur}s`
                                    ),
                                ),
                                h('div', { style: 'font-size:var(--fss);color:var(--text2);margin-top:5px' },
                                    `Coal: ${(gs.ores.coal || 0).toFixed(1)} · Crucible: ${Math.floor(gs.crucibleTotal)}/${cD.cap}`
                                ),
                            ),
                        ),

                        // MOLDS
                        h('div', { class: 'mold-sec' },
                            h('div', { class: 'ptitle', style: 'position:static;padding:0 0 8px' }, 'Select Mold & Cast'),
                            h('div', { class: 'mold-grid' },
                                availMolds.map(([id, mo]) =>
                                    h('button', { key: id, class: `mb ${gs.selectedMold === id ? 'on' : ''}`, onClick: () => setGs(s => ({ ...s, selectedMold: id })) },
                                        h('i', { class: `fa-solid ${mo.icon}` }),
                                        mo.name,
                                        h('span', { class: 'mb-c' }, mo.m + ' metal'),
                                        displayMetal && h('span', { class: 'mb-v' }, '~' + fmtN(itemValFull(id, displayMetal, 3, gs.researched, gs.trLv)) + 'g'),
                                    )
                                )
                            ),
                            h('div', { style: 'display:flex;gap:8px' },
                                h('button', {
                                    class: 'btn pri', style: 'flex:1;justify-content:center',
                                    disabled: !displayMetal || gs.crucibleTotal < (MOLDS[gs.selectedMold]?.m || 99) || gs.queue.length >= mrD.slots,
                                    onClick: castMold
                                },
                                    h('i', { class: 'fa-solid fa-faucet' }),
                                    `Pour ${MOLDS[gs.selectedMold]?.name || 'Mold'}`
                                ),
                            )
                        ),

                        // QUEUE
                        h('div', { class: 'queue-sec' },
                            h('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:7px' },
                                h('span', { style: 'font-family:Cinzel,serif;font-size:var(--fsx);letter-spacing:.15em;color:var(--text2);text-transform:uppercase' }, `Cooling — ${gs.queue.length}/${mrD.slots}`),
                            ),
                            gs.queue.length === 0
                                ? h('span', { class: 'empty' }, 'No active castings.')
                                : h('div', { class: 'qi-list' },
                                    gs.queue.map(ci =>
                                        h('div', { key: ci.id, class: 'qi' },
                                            h('i', { class: `fa-solid ${MOLDS[ci.moldId]?.icon}`, style: `color:${METALS[ci.metalId]?.color || '#aaa'};font-size:13px` }),
                                            METALS[ci.metalId]?.name, ' ', MOLDS[ci.moldId]?.name,
                                            h('span', { style: 'font-size:10px;color:var(--text2);margin-left:3px' }, 'Q' + ci.quality),
                                            h('div', { class: 'qi-pb' }, h('div', { class: 'qi-pf', style: `width:${((ci.totalTime - ci.timeLeft) / ci.totalTime) * 100}%` })),
                                            h('span', { style: 'font-size:10px;color:var(--text2);min-width:20px' }, Math.ceil(ci.timeLeft) + 's')
                                        )
                                    )
                                )
                        ),

                        // INVENTORY
                        h('div', { class: 'inv-sec' },
                            h('div', { style: 'font-family:Cinzel,serif;font-size:var(--fsx);letter-spacing:.15em;color:var(--text2);text-transform:uppercase;margin-bottom:7px' }, `Workshop Output — ${invEntries.length} types`),
                            invEntries.length === 0
                                ? h('span', { class: 'empty' }, 'Cast metal to produce goods.')
                                : h('div', { class: 'inv-list' },
                                    invEntries.flatMap(([key, entries]) =>
                                        entries.filter(e => e.qty > 0).map((entry, i) => {
                                            const p = extractMetal(key);
                                            if (!p) return null;
                                            const metal = METALS[p.metalId]; const mo = MOLDS[p.moldId];
                                            const val = itemValFull(p.moldId, p.metalId, entry.quality, gs.researched, gs.trLv);
                                            return h('div', { key: key + i, class: 'ir' },
                                                h('i', { class: `fa-solid ${mo?.icon || 'fa-box'} ir-icon`, style: `color:${metal?.color || '#aaa'}` }),
                                                h('span', { class: 'ir-name' }, fmtItem(key)),
                                                h('span', { class: 'ir-q' }, 'Q' + entry.quality),
                                                h('span', { class: 'ir-qty' }, '×' + entry.qty),
                                                h('span', { class: 'ir-val' }, fmtN(val) + 'g'),
                                                h('button', { class: 'sb', onClick: () => sellOne(key, entry.quality), disabled: entry.qty < 1 }, 'Sell'),
                                                h('button', { class: 'sba', onClick: () => sellAll(key), disabled: entry.qty < 1 }, 'All'),
                                            );
                                        }).filter(Boolean)
                                    )
                                )
                        ),
                        h('div', { style: 'padding:9px 16px;color:var(--text2);font-size:var(--fss);font-style:italic;border-top:1px solid var(--border)' }, gs.log[0]),
                    ),

                    // RIGHT
                    h('aside', { class: 'rpanel-wrap' },
                        h('div', { class: 'tabs' },
                            [['upgrades', 'fa-arrow-up', 'Upgrades'], ['research', 'fa-flask', 'Research'], ['contracts', 'fa-scroll', 'Contracts']].map(([tid, ic, lb]) =>
                                h('button', { key: tid, class: `tab ${rtab === tid ? 'on' : ''}`, onClick: () => setRtab(tid) },
                                    h('i', { class: `fa-solid ${ic}`, style: 'display:block;font-size:13px;margin-bottom:1px' }), lb
                                )
                            )
                        ),
                        h('div', { class: 'rp' },
                            rtab === 'upgrades' && h(UpgradeTab, { gs, onUpgrade: doUpgrade }),
                            rtab === 'research' && h(ResearchTab, { gs, onResearch: doResearch }),
                            rtab === 'contracts' && h(ContractsTab, { gs, onActivate: activateContract, onFulfill: fulfillContract }),
                        )
                    ),
                ),

                h('footer', { class: 'footer' },
                    h('span', { class: 'log-lbl' }, 'Log'),
                    h('span', { class: `log-msg ${gs.log[0]?.includes('!') || gs.log[0]?.includes('Master') ? 'hi' : ''}` }, gs.log[0] || '—')
                )
            );
        }

        // ──────────────────────────────────────────────
        // CRUCIBLE DISPLAY COMPONENT
        // ──────────────────────────────────────────────
        function CrucibleDisplay({ gs, alloyR, displayMetal, isBadMix, onDump }) {
            const cD = CRUCIBLE_LV[gs.cLv];
            const total = gs.crucibleTotal;
            const layers = Object.entries(gs.crucible).filter(([, v]) => v > 0.1).sort((a, b) => b[1] - a[1]);

            return h('div', { class: 'crucible-box' },
                h('div', { class: 'cruc-title' },
                    alloyR
                        ? h('span', { style: `color:${METALS[alloyR]?.color}` }, '✓ ' + METALS[alloyR]?.name + ' Alloy')
                        : total > 0
                            ? h('span', { style: 'color:var(--text)' }, 'Crucible Contents')
                            : h('span', { style: 'color:var(--text3)' }, 'Crucible — Empty'),
                    total > 0 && h('span', { style: 'font-family:Share Tech Mono,monospace;font-size:var(--fsx);color:var(--text2);margin-left:auto' },
                        Math.floor(total) + '/' + cD.cap
                    )
                ),
                total === 0
                    ? h('div', { class: 'cruc-empty' }, 'No molten metal')
                    : h('div', { class: 'cruc-layers' },
                        layers.map(([mid, amt]) => {
                            const metal = METALS[mid];
                            const pct = Math.round(amt / total * 100);
                            return h('div', { key: mid, class: 'cruc-layer', style: `border-color:${metal?.color || '#888'}` },
                                h('span', { class: 'cruc-layer-name', style: `color:${metal?.color || '#ccc'}` }, metal?.name || mid),
                                h('span', { class: 'cruc-layer-amt', style: 'color:var(--text)' }, Math.floor(amt)),
                                h('span', { class: 'cruc-layer-pct' }, pct + '%'),
                            );
                        }),
                        layers.length > 1 && h('div', { class: 'cruc-total' },
                            h('span', { style: 'color:var(--text2)' }, 'Total'),
                            h('span', { style: 'font-family:Share Tech Mono,monospace;color:var(--text)' }, Math.floor(total) + 'u')
                        )
                    ),
                // Alloy indicator for mixed
                isBadMix && h(AlloyIndicator, { gs, crucible: gs.crucible, total }),
                // Dump button + warning
                total > 0 && h('div', { style: 'margin-top:8px;display:flex;align-items:center;gap:7px' },
                    isBadMix && h('span', { style: 'font-size:var(--fss);color:var(--red);flex:1' }, '⚠ Bad mix'),
                    h('button', { class: 'btn danger sm', onClick: onDump, style: 'margin-left:auto' }, 'Dump All'),
                )
            );
        }

        function AlloyIndicator({ gs, crucible, total }) {
            const known = Object.entries(METALS).filter(([mid, m]) => m.alloy && gs.researched.has(mid));
            if (!known.length) return null;
            return h('div', { style: 'margin-top:8px' },
                h('div', { style: 'font-size:var(--fsx);color:var(--text2);margin-bottom:4px;font-family:Cinzel,serif;letter-spacing:.1em' }, 'ALLOY TARGETS'),
                known.map(([mid, m]) => {
                    const comps = Object.entries(m.alloy);
                    return h('div', { key: mid, class: 'alloy-box', style: 'margin-bottom:5px' },
                        h('div', { class: 'alloy-name', style: `color:${m.color}` }, m.name),
                        comps.map(([comp, ratio]) => {
                            const actual = (crucible[comp] || 0) / Math.max(1, total);
                            const ok = Math.abs(actual - ratio) < m.tol;
                            const pct = Math.min(100, actual * 100);
                            const targetPct = ratio * 100;
                            return h('div', { key: comp, class: 'alloy-row' },
                                h('span', { class: 'alloy-comp', style: `color:${METALS[comp]?.color || '#ccc'}` }, METALS[comp]?.name || comp),
                                h('div', { class: 'alloy-bar' },
                                    h('div', { class: 'alloy-actual', style: `width:${pct}%;background:${METALS[comp]?.color || '#888'};opacity:.7` }),
                                    h('div', { class: 'alloy-target', style: `left:${targetPct}%` }),
                                ),
                                h('span', { class: ok ? 'alloy-ok' : 'alloy-off', style: 'font-size:var(--fss);min-width:36px;text-align:right' },
                                    Math.round(actual * 100) + '% ' + (ok ? '✓' : '✗')
                                )
                            );
                        })
                    );
                })
            );
        }

        // ──────────────────────────────────────────────
        // MINE TAB
        // ──────────────────────────────────────────────
        function MineTab({ gs, veins, onMine, onBuy }) {
            const pick = PICKAXES.find(p => p.id === gs.pickaxe) || PICKAXES[0];
            const pickIdx = PICKAXES.findIndex(p => p.id === gs.pickaxe);
            return h('div', { class: 'mine-wrap' },
                h('div', { style: 'font-size:var(--fss);color:var(--text2)' },
                    'Using: ', h('span', { style: 'color:var(--accent)' }, pick.name), ' · ', h('span', { style: 'color:var(--green)' }, '+' + pick.yield), ' ore/click'
                ),
                h('div', { class: 'vein-grid' },
                    veins.map(vein => {
                        const ore = ORES[vein.oreId];
                        const dep = vein.hp <= 0;
                        return h('div', {
                            key: vein.id, class: `vn ${dep ? 'dep' : ''}`,
                            onClick: e => !dep && onMine(vein, e),
                            style: `border-color:${dep ? 'var(--border)' : ore.color + '40'}`
                        },
                            h('i', { class: `fa-solid ${ore.icon}`, style: `color:${dep ? '#555' : ore.color}` }),
                            h('span', { class: 'vn-nm', style: `color:${dep ? 'var(--text3)' : ore.color}` }, ore.name.replace(' Ore', '').replace(' Flux', '')),
                            dep
                                ? h('span', { class: 'vn-cd' }, vein.regenTimer + 's')
                                : h('div', { class: 'vn-hp', style: `width:${(vein.hp / vein.maxHp) * 100}%;background:${ore.color}` })
                        );
                    })
                ),
                h('div', { class: 'div' }),
                h('div', { class: 'pick-shop' },
                    h('h4', null, 'Pickaxe Workshop'),
                    PICKAXES.map((p, i) => {
                        const isCur = p.id === gs.pickaxe;
                        const canBuy = p.cost && Object.entries(p.cost).every(([k, n]) => (gs.inventory[k] || []).reduce((a, e) => a + e.qty, 0) >= n);
                        return h('div', { key: p.id, class: 'pick-row' },
                            h('i', { class: `fa-solid ${p.icon}`, style: `color:${isCur ? 'var(--accent)' : 'var(--text2)'};width:18px;font-size:15px` }),
                            h('span', { class: 'pick-nm', style: `color:${isCur ? 'var(--accent)' : 'var(--text)'}` }, p.name),
                            h('span', { class: 'pick-yd' }, '+' + p.yield + '/click'),
                            isCur
                                ? h('span', { style: 'font-size:var(--fss);color:var(--green)' }, 'equipped')
                                : p.cost
                                    ? h('button', { class: `btn sm ${canBuy ? 'pri' : ''}`, onClick: () => onBuy(p), disabled: !canBuy },
                                        Object.entries(p.cost).map(([k, n]) => `${n}x ${fmtItem(k)}`).join(', ')
                                    )
                                    : null
                        );
                    })
                )
            );
        }

        // ──────────────────────────────────────────────
        // STOCK TAB
        // ──────────────────────────────────────────────
        function StockTab({ gs }) {
            const stD = STORAGE_LV[gs.sLv];
            const ores = Object.entries(gs.ores).filter(([, v]) => v > 0.01);
            return h('div', { style: 'padding:12px;overflow-y:auto;' },
                h('div', { class: 'ptitle', style: 'position:static;padding:0 0 8px' }, 'Ore & Fuel Storage'),
                ores.length === 0 && h('span', { class: 'empty' }, 'No resources.'),
                ores.map(([oid, qty]) => {
                    const ore = ORES[oid];
                    const isC = oid === 'coal' || oid === 'coal_flux';
                    const cap = isC ? stD.cMax : stD.oMax;
                    return h('div', { key: oid, class: 'stock-item' },
                        h('div', { class: 'si-row' },
                            h('i', { class: `fa-solid ${ore.icon}`, style: `color:${ore.color};font-size:15px;width:18px;text-align:center` }),
                            h('span', { style: 'flex:1;font-size:var(--fsm)' }, ore.name),
                            h('span', { style: 'font-family:Share Tech Mono,monospace;font-size:var(--fsm)' }, Math.floor(qty)),
                            h('span', { style: 'font-size:var(--fss);color:var(--text2)' }, '/' + cap),
                        ),
                        h('div', { class: 'si-bar' }, h('div', { class: 'si-fill', style: `width:${(qty / cap) * 100}%;background:${ore.color}` }))
                    );
                })
            );
        }

        // ──────────────────────────────────────────────
        // UPGRADE TAB
        // ──────────────────────────────────────────────
        function UpgradeTab({ gs, onUpgrade }) {
            return h('div', null,
                UPGRADES.map(def => {
                    const lv = gs[def.lk] || 0;
                    const maxed = lv >= def.lvs.length - 1;
                    const cost = maxed ? 0 : upgCost(def, lv);
                    const canAff = gs.gold >= cost;
                    return h('div', { key: def.id, class: `uc ${maxed ? 'maxed' : ''}`, onClick: () => !maxed && onUpgrade(def) },
                        h('div', { class: 'uc-h' },
                            h('i', { class: `fa-solid ${def.icon} uc-i`, style: `color:${maxed ? 'var(--gold)' : 'var(--accent)'}` }),
                            h('span', { class: 'uc-n' }, def.name),
                            h('span', { class: 'uc-lv' }, `${lv + 1}/${def.lvs.length}`)
                        ),
                        h('div', { class: 'uc-cur' }, def.lvs[lv].name),
                        !maxed && h('div', { class: `uc-cost ${canAff ? '' : 'no'}` }, h('i', { class: 'fa-solid fa-coins', style: 'font-size:12px' }), fmtN(cost) + 'g'),
                        !maxed && h('div', { class: 'uc-eff' }, '→ ' + def.lvs[lv + 1].name + ': ' + def.eff(lv + 1)),
                        maxed && h('div', { class: 'uc-eff' }, '✓ Maximum level'),
                    );
                })
            );
        }

        // ──────────────────────────────────────────────
        // RESEARCH TAB
        // ──────────────────────────────────────────────
        function ResearchTab({ gs, onResearch }) {
            const byEra = [[], [], [], [], []];
            for (const r of RESEARCH) byEra[r.era].push(r);
            return h('div', null,
                byEra.map((grp, era) =>
                    grp.length === 0 ? null : h('div', { key: era, style: 'margin-bottom:14px' },
                        h('div', { class: 'era-head' }, h('span', { class: 'be' }, ERA[era])),
                        grp.map(res => {
                            const done = gs.researched.has(res.id);
                            const preOk = res.pre.every(p => gs.researched.has(p));
                            const canAff = gs.gold >= res.cost;
                            const status = done ? 'dn' : preOk ? 'av' : 'lk';
                            return h('div', { key: res.id, class: `rc ${status}`, onClick: () => status === 'av' && onResearch(res) },
                                h('div', { class: 'rc-n' }, res.name,
                                    done && h('span', { class: 'badge bd' }, 'DONE'),
                                    status === 'lk' && h('span', { class: 'badge bl' }, 'LOCKED'),
                                ),
                                h('div', { class: 'rc-d' }, res.eff),
                                !done && preOk && h('div', { class: 'rc-cost', style: canAff ? '' : 'color:var(--red)' },
                                    h('i', { class: 'fa-solid fa-coins', style: 'font-size:11px;margin-right:3px' }), fmtN(res.cost) + 'g'
                                ),
                                !done && !preOk && h('div', { class: 'rc-req' }, 'Needs: ' + res.pre.map(p => RESEARCH.find(r => r.id === p)?.name || p).join(', ')),
                            );
                        })
                    )
                )
            );
        }

        // ──────────────────────────────────────────────
        // CONTRACTS TAB
        // ──────────────────────────────────────────────
        function ContractsTab({ gs, onActivate, onFulfill }) {
            return h('div', null,
                CONTRACTS.map(con => {
                    const done = gs.completedContracts.has(con.id);
                    const preOk = !con.pre || gs.completedContracts.has(con.pre);
                    const isAct = gs.activeContract === con.id;
                    const prog = con.reqs.map(req => {
                        const entries = gs.inventory[req.i] || [];
                        const haveQ = entries.filter(e => e.quality >= req.qm).reduce((a, e) => a + e.qty, 0);
                        return { ...req, have: haveQ, allDone: haveQ >= req.q };
                    });
                    const canFul = prog.every(p => p.allDone);
                    if (done) return h('div', { key: con.id, class: 'cc dn-c' }, h('div', { class: 'cc-n' }, '✓ ' + con.name), h('div', { class: 'cc-d' }, 'Fulfilled'));
                    if (!preOk) return h('div', { key: con.id, class: 'cc', style: 'opacity:.28' }, h('div', { class: 'cc-n' }, con.name), h('div', { class: 'cc-lk' }, 'Complete earlier contract first'));
                    return h('div', { key: con.id, class: `cc ${isAct ? 'act' : ''}` },
                        h('div', { class: 'cc-n' }, con.name),
                        h('div', { class: 'cc-d' }, con.desc),
                        con.reqs.map(req =>
                            h('div', { key: req.i, class: `cc-req ${prog.find(p => p.i === req.i)?.allDone ? 'ok-r' : ''}` },
                                h('span', { style: 'font-size:var(--fss);min-width:140px' }, fmtItem(req.i) + ' Q≥' + req.qm),
                                h('div', { class: 'cc-bar' }, h('div', { class: 'cc-fill', style: `width:${Math.min(100, ((prog.find(p => p.i === req.i)?.have || 0) / req.q) * 100)}%` })),
                                h('span', { class: 'cc-cnt' }, (prog.find(p => p.i === req.i)?.have || 0) + '/' + req.q)
                            )
                        ),
                        h('div', { class: 'cc-rwd' }, h('i', { class: 'fa-solid fa-coins', style: 'margin-right:5px' }), fmtN(con.rwd.g) + 'g + ' + fmtN(con.rwd.r) + ' rating'),
                        !isAct
                            ? h('button', { class: 'cc-btn', onClick: () => onActivate(con.id) }, 'Track Contract')
                            : h('button', { class: 'cc-btn', onClick: () => onFulfill(con), disabled: !canFul }, canFul ? 'Fulfill Contract →' : 'Requirements Incomplete')
                    );
                })
            );
        }

        render(h(App, null), document.getElementById('app'));
    </script>
</body>

</html>
