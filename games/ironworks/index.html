<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONWORKS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/preact/10.19.3/preact.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/preact/10.19.3/hooks.umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #0e0b07;
            --bg2: #17120d;
            --bg3: #201710;
            --bg4: #2a1f13;
            --border: #3d2d1a;
            --border2: #5a4028;
            --text: #e0c8a8;
            --text2: #b89070;
            --text3: #8a6848;
            --accent: #e08030;
            --accent2: #c06820;
            --gold: #f0c040;
            --green: #60c070;
            --red: #d05050;
            --iron: #8898b0;
            --copper: #c88040;
            --tin: #90a0a8;
            --bronze: #d08832;
            --steel: #b0c0d0;
            --silver: #d0d8e0;
            --void: #9060c0;
            --mithril: #80c0e0;
            --titan: #70d8c0;
            --fs: 17px;
            --fsm: 15px;
            --fss: 13px;
            --fsx: 11px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Crimson Pro', serif;
            height: 100vh;
            overflow: hidden;
            font-size: var(--fs);
            line-height: 1.5;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: .5;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Cinzel', serif;
            letter-spacing: .06em;
        }

        .mono {
            font-family: 'Share Tech Mono', monospace;
        }

        /* LAYOUT */
        .app {
            display: grid;
            grid-template-rows: 54px 1fr 40px;
            height: 100vh;
        }

        .header {
            background: linear-gradient(to bottom, #0a0705, var(--bg2));
            border-bottom: 1px solid var(--border);
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .h1 {
            font-size: 22px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(224, 128, 48, .5);
            letter-spacing: .15em;
        }

        .hstat {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 4px;
        }

        .hstat .lbl {
            font-size: var(--fsx);
            color: var(--text2);
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .hstat .val {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            color: var(--gold);
        }

        .hrank {
            font-size: var(--fss);
            color: var(--text2);
            font-style: italic;
        }

        .hgold {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            color: var(--gold);
            margin-left: auto;
        }

        .main {
            display: grid;
            grid-template-columns: 250px 1fr 270px;
            overflow: hidden;
        }

        .panel {
            background: var(--bg2);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .panel::-webkit-scrollbar {
            width: 4px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px;
        }

        .ptitle {
            font-family: 'Cinzel', serif;
            font-size: var(--fsx);
            letter-spacing: .18em;
            color: var(--text2);
            text-transform: uppercase;
            padding: 9px 14px 7px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .footer {
            background: var(--bg2);
            border-top: 1px solid var(--border);
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .log-lbl {
            font-size: var(--fsx);
            color: var(--text2);
            letter-spacing: .1em;
            font-family: 'Cinzel', serif;
            white-space: nowrap;
        }

        .log-msg {
            font-size: var(--fss);
            color: var(--text);
            font-style: italic;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .log-msg.hi {
            color: var(--accent);
        }

        /* TABS */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 9px 4px;
            font-size: var(--fsx);
            letter-spacing: .07em;
            color: var(--text2);
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            text-align: center;
            transition: all .15s;
            border-bottom: 2px solid transparent;
        }

        .tab.on {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab:hover:not(.on) {
            color: var(--text);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text);
            cursor: pointer;
            font-family: 'Crimson Pro', serif;
            font-size: var(--fsm);
            border-radius: 4px;
            transition: all .15s;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--bg4);
        }

        .btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .btn.pri {
            background: rgba(224, 128, 48, .14);
            border-color: var(--accent2);
            color: var(--accent);
        }

        .btn.pri:hover:not(:disabled) {
            background: rgba(224, 128, 48, .26);
            box-shadow: 0 0 12px rgba(224, 128, 48, .25);
        }

        .btn.sm {
            padding: 4px 9px;
            font-size: var(--fss);
        }

        .btn.full {
            width: 100%;
            justify-content: center;
        }

        .btn.danger {
            border-color: var(--red);
            color: var(--red);
        }

        .btn.danger:hover:not(:disabled) {
            background: rgba(208, 80, 80, .1);
        }

        .btn.active-b {
            border-color: var(--accent);
            background: rgba(224, 128, 48, .18);
            color: var(--accent);
        }

        /* TOASTS */
        .toasts {
            position: fixed;
            bottom: 48px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            align-items: flex-end;
        }

        @keyframes tin {
            from {
                transform: translateX(110%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        .toast {
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-left: 3px solid var(--accent);
            color: var(--text);
            padding: 8px 13px;
            border-radius: 4px;
            font-size: var(--fss);
            animation: tin .22s ease;
            max-width: 270px;
        }

        .toast.good {
            border-left-color: var(--green);
        }

        .toast.bad {
            border-left-color: var(--red);
        }

        /* SPARKS */
        @keyframes spk {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1
            }

            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffa000;
            animation: spk .5s ease-out forwards;
            z-index: 8000;
        }

        @keyframes opop {
            0% {
                transform: translateY(0);
                opacity: 1
            }

            100% {
                transform: translateY(-22px);
                opacity: 0
            }
        }

        .opop {
            position: fixed;
            pointer-events: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: var(--fss);
            font-weight: bold;
            animation: opop .75s ease-out forwards;
            z-index: 7000;
        }

        /* MINE */
        .mine-wrap {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .vein-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .vn {
            aspect-ratio: 1;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all .12s;
            position: relative;
            overflow: hidden;
            background: var(--bg3);
            font-size: var(--fsx);
            color: var(--text2);
        }

        .vn:hover:not(.dep) {
            transform: scale(1.05);
            background: var(--bg4);
        }

        .vn.dep {
            opacity: .3;
            cursor: not-allowed;
        }

        .vn i {
            font-size: 20px;
        }

        .vn-nm {
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
        }

        .vn-hp {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            transition: width .15s;
        }

        .vn-cd {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--fss);
            color: var(--text2);
        }

        /* PICK SHOP */
        .pick-shop {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 11px;
        }

        .pick-shop h4 {
            font-size: var(--fsm);
            color: var(--text);
            margin-bottom: 8px;
            font-family: 'Cinzel', serif;
        }

        .pick-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }

        .pick-row:last-child {
            border-bottom: none;
        }

        .pick-nm {
            flex: 1;
            font-size: var(--fsm);
        }

        .pick-yd {
            font-size: var(--fss);
            color: var(--green);
            min-width: 60px;
        }

        /* STOCK */
        .stock-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 5px;
        }

        .si-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .si-bar {
            height: 4px;
            background: var(--bg4);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 3px;
        }

        .si-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .3s;
        }

        /* CENTER */
        .workshop {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .workshop::-webkit-scrollbar {
            width: 4px;
        }

        .workshop::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        /* SMELTERY */
        .smelt-sec {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .smelt-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            width: 200px;
        }

        .smelt-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* CRUCIBLE DISPLAY */
        .crucible-box {
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 6px;
            padding: 10px;
            min-height: 80px;
        }

        .cruc-title {
            font-size: var(--fsx);
            color: var(--text2);
            font-family: 'Cinzel', serif;
            letter-spacing: .1em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cruc-layers {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cruc-layer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            background: var(--bg4);
            border-radius: 3px;
            border-left: 3px solid;
        }

        .cruc-layer-name {
            font-size: var(--fsm);
            flex: 1;
        }

        .cruc-layer-amt {
            font-family: 'Share Tech Mono', monospace;
            font-size: var(--fsm);
            min-width: 36px;
            text-align: right;
        }

        .cruc-layer-pct {
            font-size: var(--fsx);
            color: var(--text2);
            min-width: 36px;
            text-align: right;
        }

        .cruc-total {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            margin-top: 4px;
            border-top: 1px solid var(--border);
            font-size: var(--fsm);
        }

        .cruc-empty {
            color: var(--text3);
            font-style: italic;
            font-size: var(--fsm);
            padding: 6px 0;
            text-align: center;
        }

        /* ALLOY INDICATOR */
        .alloy-box {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 9px;
        }

        .alloy-name {
            font-family: 'Cinzel', serif;
            font-size: var(--fsm);
            margin-bottom: 6px;
        }

        .alloy-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }

        .alloy-comp {
            font-size: var(--fss);
            min-width: 80px;
        }

        .alloy-bar {
            flex: 1;
            height: 8px;
            background: var(--bg4);
            border-radius: 4px;
            position: relative;
            overflow: visible;
        }

        .alloy-target {
            position: absolute;
            top: -2px;
            bottom: -2px;
            width: 2px;
            background: white;
            border-radius: 1px;
            opacity: .7;
        }

        .alloy-actual {
            height: 100%;
            border-radius: 4px;
            transition: width .3s;
        }

        .alloy-ok {
            color: var(--green);
        }

        .alloy-off {
            color: var(--red);
        }

        .dump-warn {
            background: rgba(208, 80, 80, .12);
            border: 1px solid rgba(208, 80, 80, .4);
            border-radius: 4px;
            padding: 7px 10px;
            font-size: var(--fss);
            color: var(--red);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* TEMP */
        .temp-sec {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .temp-num {
            font-family: 'Share Tech Mono', monospace;
            font-size: 22px;
            font-weight: bold;
            line-height: 1;
        }

        .temp-bar-bg {
            height: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .temp-bar-fg {
            height: 100%;
            border-radius: 3px;
            transition: width .3s, background .5s;
        }

        .temp-refs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 3px;
        }

        .temp-ref {
            font-size: 10px;
            font-family: 'Share Tech Mono', monospace;
            padding: 1px 5px;
            border-radius: 2px;
            background: var(--bg3);
        }

        /* BELLOWS boost indicator */
        .bellows-boost {
            height: 4px;
            background: var(--bg3);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 3px;
        }

        .bellows-boost-bar {
            height: 100%;
            background: var(--accent);
            transition: width .2s;
        }

        /* FURNACE BTNS */
        .furnace-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        /* SMELT BUTTONS */
        .smelt-btns {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* MOLD SECTION */
        .mold-sec {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .mold-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 5px;
            margin: 8px 0;
        }

        .mb {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 5px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Crimson Pro', serif;
            font-size: var(--fss);
            text-align: center;
            transition: all .15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .mb:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--bg4);
            color: var(--accent);
        }

        .mb:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        .mb.on {
            border-color: var(--accent);
            background: rgba(224, 128, 48, .1);
        }

        .mb i {
            font-size: 16px;
        }

        .mb-c {
            font-size: 10px;
            color: var(--text3);
        }

        .mb-v {
            font-size: 10px;
            color: var(--gold);
        }

        /* QUEUE */
        .queue-sec {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .qi-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }

        .qi {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 5px 9px;
            font-size: var(--fss);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qi-pb {
            width: 48px;
            height: 4px;
            background: var(--bg4);
            border-radius: 2px;
            overflow: hidden;
        }

        .qi-pf {
            height: 100%;
            background: var(--accent);
            transition: width .2s;
        }

        /* INVENTORY */
        .inv-sec {
            padding: 12px 16px;
        }

        .inv-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 7px;
        }

        .ir {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 7px 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ir-icon {
            font-size: 15px;
            width: 18px;
            text-align: center;
        }

        .ir-name {
            flex: 1;
            font-size: var(--fsm);
        }

        .ir-q {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 2px;
            background: var(--bg4);
            color: var(--gold);
            font-family: 'Share Tech Mono', monospace;
        }

        .ir-qty {
            font-family: 'Share Tech Mono', monospace;
            font-size: var(--fsm);
            min-width: 28px;
            text-align: right;
        }

        .ir-val {
            font-size: var(--fss);
            color: var(--gold);
            font-family: 'Share Tech Mono', monospace;
            min-width: 52px;
            text-align: right;
        }

        .sb {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            padding: 3px 9px;
            cursor: pointer;
            border-radius: 2px;
            font-size: var(--fsx);
            font-family: 'Crimson Pro', serif;
            transition: all .15s;
        }

        .sb:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
        }

        .sb:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        .sba {
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--accent);
            padding: 3px 9px;
            cursor: pointer;
            border-radius: 2px;
            font-size: var(--fsx);
            font-family: 'Crimson Pro', serif;
            transition: all .15s;
        }

        .sba:hover:not(:disabled) {
            background: rgba(224, 128, 48, .1);
        }

        /* RIGHT PANEL */
        .rpanel-wrap {
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .rp {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .rp::-webkit-scrollbar {
            width: 4px;
        }

        .rp::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        /* UPGRADE CARD */
        .uc {
            background: var(--bg3);
