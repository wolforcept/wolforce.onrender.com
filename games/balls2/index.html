                    ctx.strokeStyle = 'rgba(220,255,190,.75)'; ctx.lineWidth = 1.2; ctx.stroke();   // bright rim along the wavy edge
                    ctx.fillStyle = 'rgba(255,255,255,.55)';                                        // little shine
                    ctx.beginPath(); ctx.ellipse(p.x - R * 0.35, p.y - R * 0.55, 2.4, 1.3, -0.5, 0, TAU); ctx.fill();
                    ctx.restore();
                }

                // a: how far we are between the last two physics steps (0..1), so balls and the cannon move smoothly at any refresh rate
                // view: { hover, dragging } from the input, for the placement preview
                render(a, view) {
                    const { ctx, game, camera } = this, k = this.dpr * camera.scale, shake = game.effects.shake * this.dpr;
                    this.ox = shake ? rand(-shake, shake) : 0;   // screen shake: the whole board is offset (device px)
                    this.oy = shake ? rand(-shake, shake) : 0;
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.worldTransform(k);
                    const top = camera.y - 40, bot = camera.y + camera.viewH / camera.scale + 40;   // visible world rows, with a margin
                    this.drawBoard(top, bot);
                    this.drawBucket();
                    this.drawGravityFields(top, bot);
                    this.drawPegs(k, top, bot);
                    this.drawPlacement(view);
                    this.drawBalls(a, top, bot);
                    this.drawEffects(top, bot);
                    this.drawLauncher(game.prevLaunchX + (game.launchX - game.prevLaunchX) * a, Math.min(game.worldH, bot));
                    this.drawFlash();
                }
                // world units -> device pixels, scrolled by the camera and offset by the screen shake
                worldTransform(k) { this.ctx.setTransform(k, 0, 0, k, this.ox, this.oy - this.camera.y * k); }

                drawFlash() {
                    const f = this.game.effects.flash, ctx = this.ctx;
                    if (f.a <= 0) return;
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.globalAlpha = f.a; ctx.fillStyle = f.color;
                    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    ctx.globalAlpha = 1;
                }

                // grid, depth markers, the dimmed outside, walls, ceiling and drain line
                drawBoard(top, bot) {
                    const ctx = this.ctx, worldH = this.game.worldH;
                    const visTop = Math.max(0, top), visBot = Math.min(worldH, bot);   // long lines are only drawn where visible

                    // grid, anchored to the top so it stays put when the world grows downward
                    ctx.lineWidth = 1 / this.camera.scale;
                    ctx.strokeStyle = 'rgba(138,91,255,.10)';
                    ctx.beginPath();
                    for (let x = 40; x < W; x += 40) { ctx.moveTo(x, visTop); ctx.lineTo(x, visBot); }
                    for (let y = 40; y < worldH; y += 40) {
                        if (y < top || y > bot) continue;
                        ctx.moveTo(0, y); ctx.lineTo(W, y);
                    }
                    ctx.stroke();

                    // depth markers every 200 below the ceiling
                    ctx.font = '600 9px system-ui,sans-serif';
                    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(139,134,184,.55)';
                    for (let y = 200; y < worldH; y += 200) {
                        if (y < top || y > bot) continue;
                        ctx.strokeStyle = 'rgba(138,91,255,.22)';
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                        ctx.fillText(String(y), 6, y - 4);
                    }

                    ctx.fillStyle = 'rgba(2,1,10,.65)';
                    ctx.fillRect(-10, worldH, W + 20, 4000);
                    ctx.fillRect(-10, -4000, W + 20, 4000);
                    ctx.lineCap = 'butt';
                    ctx.beginPath(); ctx.moveTo(0, visTop); ctx.lineTo(0, visBot); ctx.moveTo(W, visTop); ctx.lineTo(W, visBot);
                    if (top < 0) { ctx.moveTo(0, 0); ctx.lineTo(W, 0); }
                    this.glowStroke('#8a5bff', 2.5, 9, 0.22);
                    if (bot > worldH) {
                        ctx.setLineDash([10, 8]);
                        ctx.beginPath(); ctx.moveTo(0, worldH); ctx.lineTo(W, worldH);
                        this.glowStroke('#ff2bd6', 2.5, 9, 0.22);
                        ctx.setLineDash([]);
                    }
                }

                drawBucket() {
                    const ctx = this.ctx, game = this.game, bs = game.buckets.layout(), n = bs.length;
                    const rim = game.rimY(), bot = game.worldH - 8, base = bucketValue(game.L('bucket'));
                    for (let i = 0; i < n; i++) {
                        const b = bs[i], fl = game.buckets.flash[i];
                        const col = n === 1 ? '#b6ff2e' : b.t < 0.01 ? '#ffd23a' : b.t > 0.99 ? '#b6ff2e' : '#ff9d1a';
                        const sl = Math.min(8, b.w * 0.15);
                        const x0 = b.cx - b.w / 2, x1 = b.cx + b.w / 2;
                        ctx.save();
                        ctx.beginPath(); ctx.moveTo(x0, rim); ctx.lineTo(x0 + sl, bot); ctx.lineTo(x1 - sl, bot); ctx.lineTo(x1, rim); ctx.closePath();
                        ctx.globalAlpha = 0.08 + 0.3 * fl; ctx.fillStyle = col; ctx.fill();
                        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(x0, rim); ctx.lineTo(x0 + sl, bot); ctx.lineTo(x1 - sl, bot); ctx.lineTo(x1, rim);
                        this.glowStroke(col, n > 1 ? 2.5 : 3, 9 + 6 * fl, 0.2 + 0.3 * fl);
                        ctx.restore();
                        ctx.textAlign = 'center'; ctx.font = `800 ${Math.max(8, Math.min(12, b.w / 3.6))}px system-ui,sans-serif`;
                        ctx.fillStyle = col;
                        ctx.fillText('$' + fmt(base * b.mult), b.cx, rim + 17);
                    }
                }

                // gravity pegs: a faint field showing how far their pull reaches (drawn under the pegs)
                drawGravityFields(top, bot) {
                    const ctx = this.ctx, pegs = this.game.pegs.gravity;
                    const visible = p => p.y >= top - GRAVPEG_R && p.y <= bot + GRAVPEG_R;
                    ctx.globalCompositeOperation = 'lighter';
                    for (const p of pegs) if (visible(p)) this.glow(p.color, p.x, p.y, GRAVPEG_R * 2, 0.16);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.setLineDash([3, 6]);
                    for (const p of pegs) {
                        if (!visible(p)) continue;
                        ctx.beginPath(); ctx.arc(p.x, p.y, GRAVPEG_R, 0, TAU);
                        ctx.strokeStyle = 'rgba(46,255,176,.22)'; ctx.lineWidth = 1; ctx.stroke();
                    }
                    ctx.setLineDash([]);
                }

                // one cached sprite per peg (glow + body); the bigger flash glow, goo caps and blast counters only where needed
                drawPegs(k, top, bot) {
                    const ctx = this.ctx, camY = this.camera.y, pegs = this.game.pegs.list;
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    for (const p of pegs) {
                        if (p.y < top || p.y > bot) continue;
                        const s = this.pegSprite(p, pegCol(p), k);
                        ctx.drawImage(s, Math.round(p.x * k - s.width / 2 + this.ox), Math.round((p.y - camY) * k - s.width / 2 + this.oy));   // whole device pixels: crisp
                    }
                    this.worldTransform(k);
                    ctx.globalCompositeOperation = 'lighter';
                    for (const p of pegs) {
                        if (p.y < top || p.y > bot) continue;
                        if (p.flash > 0) this.glow(pegCol(p), p.x, p.y, 46 + 22 * p.flash, 0.65 * p.flash);
                        if (p.gooT > 0) this.glow(GOO_COL, p.x, p.y - 4, 30, 0.35);   // faint green glow from the cap only
                    }
                    ctx.globalCompositeOperation = 'source-over';
                    for (const p of pegs) {
                        if (p.y < top || p.y > bot) continue;
                        if (p.type === 'dual') {
                            ctx.fillStyle = '#ffd23a'; ctx.font = '800 10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(String(p.left), p.x, p.y + 0.5); ctx.textBaseline = 'alphabetic';
                        }
                        // the peg keeps its own colour; goo is only a green cap drawn on top of it (top side green, bottom side original)
                        if (p.gooT > 0) this.drawGooCap(p);
                        if (p.flash > 0) { this.pegPath(p); ctx.fillStyle = `rgba(255,255,255,${p.flash * 0.85})`; ctx.fill(); }
                    }
                }

                // mouse placement preview
                drawPlacement(view) {
                    const ctx = this.ctx, game = this.game;
                    if (!view.hover || view.dragging || game.pegs.ready() <= 0) return;
                    const s = game.placeSpot(view.hover.x, view.hover.y), hr = pegRadius(s.y), type = game.pegs.nextType();
                    if (type === 'research') hexPath(ctx, s.x, s.y, hr + 1); else { ctx.beginPath(); ctx.arc(s.x, s.y, hr, 0, TAU); }
                    ctx.strokeStyle = 'rgba(255,255,255,.7)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    if (type === 'gravity') {            // preview the reach of the gravity peg
                        ctx.beginPath(); ctx.arc(s.x, s.y, GRAVPEG_R, 0, TAU);
                        ctx.strokeStyle = 'rgba(46,255,176,.35)'; ctx.lineWidth = 1; ctx.setLineDash([3, 6]); ctx.stroke(); ctx.setLineDash([]);
                    }
                }

                drawBalls(a, top, bot) {
                    const ctx = this.ctx, balls = this.game.balls;
                    const pos = b => { const p = b.body.position; return [b.px + (p.x - b.px) * a, b.py + (p.y - b.py) * a]; };
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    for (const b of balls) {
                        const [x, y] = pos(b);
                        if (y < top || y > bot) continue;
                        const col = b.goo ? GOO_COL : b.gold ? GOLD : b.glow;
                        const t = b.trail;
                        if (t.length >= 4) {
                            ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = b.r * 1.1;
                            ctx.beginPath(); ctx.moveTo(t[0], t[1]);
                            for (let i = 2; i < t.length; i += 2) ctx.lineTo(t[i], t[i + 1]);
                            ctx.lineTo(x, y); ctx.stroke(); ctx.globalAlpha = 1;
                        }
                        if (b.bomb) {                    // a big red glow that throbs faster as the fuse burns down
                            const pulse = 0.5 + 0.5 * Math.sin(b.phase);
                            this.glow(BOMB_COL, x, y, b.r * (6 + 3 * pulse), 0.75 + 0.25 * pulse);
                        } else this.glow(col, x, y, b.r * 5, 0.9);
                    }
                    ctx.globalCompositeOperation = 'source-over';
                    for (const b of balls) {
                        const [x, y] = pos(b);
                        if (y < top || y > bot) continue;
                        ctx.globalAlpha = b.ghost ? 0.5 : 1;  // ghost balls are see-through
                        if (b.bomb) { this.drawBomb(b, x, y); continue; }
                        ctx.fillStyle = b.goo ? GOO_COL : b.gold ? GOLD : '#fff';
                        ctx.beginPath(); ctx.arc(x, y, b.r * 0.78, 0, TAU); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }

                // red bomb with a shine, a ring showing the fuse left, the seconds left and the loot inside
                drawBomb(b, x, y) {
                    const ctx = this.ctx, r = b.r, left = Math.max(0, b.fuse) / BOMB_FUSE, secs = Math.ceil(Math.max(0, b.fuse) / 1000);
                    const hot = left < 0.3 && Math.sin(b.phase * 2) > 0;   // the last seconds blink white-hot
                    ctx.fillStyle = hot ? '#ffd0d4' : BOMB_COL;
                    ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, TAU); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,.6)';
                    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.22, 0, TAU); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,42,61,.25)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, TAU); ctx.stroke();
                    ctx.strokeStyle = left < 0.3 ? '#ffffff' : '#ffd23a'; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.arc(x, y, r + 3.5, -Math.PI / 2, -Math.PI / 2 + TAU * left); ctx.stroke();

                    ctx.textAlign = 'center';
                    ctx.font = FONT_BIG;
                    ctx.fillStyle = hot ? '#ffffff' : '#ff6b78';
                    ctx.fillText(String(secs), this.onBoard(String(secs), x), y - r - 9);
                    const s = b.stash, loot = [s.money && '$' + fmt(s.money), s.rp && fmt(s.rp) + ' RP', s.evil && evFmt(s.evil) + ' EVIL'].filter(Boolean).join('  ');
                    if (loot) { ctx.font = FONT_SMALL; ctx.fillStyle = '#ffd23a'; ctx.fillText(loot, this.onBoard(loot, x), y - r - 26); }
                }

                drawEffects(top, bot) {
                    const ctx = this.ctx, fx = this.game.effects;
                    ctx.globalCompositeOperation = 'lighter';
                    for (const q of fx.particles) {
                        if (q.y < top || q.y > bot) continue;
                        this.glow(q.color, q.x, q.y, q.size, q.life / q.max);
                    }
                    for (const g of fx.rings) {          // shockwaves: grow fast, then slow down while fading
                        const life = g.life / g.max, rr = g.r0 + (g.r1 - g.r0) * (1 - Math.pow(life, 3));
                        if (g.fill) this.glow(g.color, g.x, g.y, rr * 2, 0.7 * life);
                        ctx.globalAlpha = life; ctx.strokeStyle = g.color; ctx.lineWidth = g.width * (0.4 + 0.6 * life);
                        ctx.beginPath(); ctx.arc(g.x, g.y, rr, 0, TAU); ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    ctx.globalCompositeOperation = 'source-over';

                    ctx.textAlign = 'center';
                    let lastFont = '';
                    for (const f of fx.floaters) {
                        if (f.y < top || f.y > bot) continue;
                        ctx.globalAlpha = Math.min(1, f.life / f.max * 1.6);
                        const font = f.huge ? FONT_HUGE : f.big ? FONT_BIG : FONT_SMALL;
                        if (font !== lastFont) { ctx.font = lastFont = font; }   // setting ctx.font re-parses the string, so only when it changes
                        ctx.fillStyle = f.color;
                        ctx.fillText(f.text, this.onBoard(f.text, f.x), f.y);
                    }
                    ctx.globalAlpha = 1;
                }

                // x for centred text, moved in so the whole text stays between the walls (uses the current font)
                onBoard(text, x) {
                    const half = this.ctx.measureText(text).width / 2 + 3;
                    return Math.min(W - half, Math.max(half, x));
                }

                drawLauncher(x, visBot) {
                    const ctx = this.ctx, y = LAUNCH_Y, recoil = this.game.recoil;

                    // faint aim line straight down, so players can time their shot
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255,157,26,.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 7]);
                    ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, Math.max(y + 2, visBot)); ctx.stroke();
                    ctx.restore();

                    ctx.globalCompositeOperation = 'lighter';
                    this.glow('#ff9d1a', x, y - 6, 70, 0.45);
                    ctx.globalCompositeOperation = 'source-over';

                    // barrel, pointing down
                    ctx.save();
                    ctx.translate(x, 0);
                    ctx.fillStyle = '#1a1038'; ctx.strokeStyle = '#ff9d1a'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.rect(-6.5, 10 - recoil * 7, 13, 24); ctx.fill(); ctx.stroke();
                    ctx.restore();

                    // carriage hanging from the ceiling
                    ctx.fillStyle = '#120b2b'; ctx.strokeStyle = '#ff9d1a'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.rect(x - 15, 0, 30, 14); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x, 7, 3.5, 0, TAU); ctx.fillStyle = '#ff9d1a'; ctx.fill();
                }

                // the ?debug readout, in a bar just above the buttons
                drawDebug(text) {
                    const ctx = this.ctx, y = this.camera.viewH - this.camera.padBot;
                    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, y - 18, this.cssW, 18);
                    ctx.fillStyle = '#fff'; ctx.font = '600 11px system-ui,sans-serif'; ctx.textAlign = 'left';
                    ctx.fillText(text, 6, y - 5);
                }
            }

            /* =====================================================================
               INPUT: drag to scroll, tap to pick up / place a peg or to launch
               ===================================================================== */
            class Input {
                constructor(canvas, game, camera, ui, store) {
                    this.canvas = canvas;
                    this.game = game;
                    this.camera = camera;
                    this.ui = ui;
                    this.store = store;
                    this.drag = null;
                    this.hover = null;                   // mouse position in the world (for the placement preview)

                    canvas.addEventListener('pointerdown', e => {
                        canvas.setPointerCapture(e.pointerId);
                        this.drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, cam0: camera.y, lastY: e.clientY, lastT: performance.now(), moved: false };
                        camera.vel = 0;
                    });
                    canvas.addEventListener('pointermove', e => this.move(e));
                    canvas.addEventListener('pointerup', e => this.end(e, false));
                    canvas.addEventListener('pointercancel', e => this.end(e, true));
                    canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') this.hover = null; });
                }
                get dragging() { return !!this.drag; }

                toWorld(cx, cy) {
                    const r = this.canvas.getBoundingClientRect();
                    return { x: (cx - r.left) / this.camera.scale, y: (cy - r.top) / this.camera.scale + this.camera.y };
                }

                move(e) {
                    const drag = this.drag, cam = this.camera;
                    if (e.pointerType === 'mouse') this.hover = this.toWorld(e.clientX, e.clientY);
                    if (!drag || e.pointerId !== drag.id) return;
                    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
                    if (!drag.moved && Math.hypot(dx, dy) > 8) drag.moved = true;
                    if (!drag.moved) return;
                    cam.y = drag.cam0 - dy / cam.scale;
                    cam.clamp();
                    const now = performance.now(), dt = now - drag.lastT;
                    if (dt > 0) {
                        const v = (drag.lastY - e.clientY) / cam.scale / dt * 1000;
                        cam.vel = cam.vel * 0.5 + v * 0.5;
                    }
                    drag.lastY = e.clientY; drag.lastT = now;
                }
                end(e, cancelled) {
                    const d = this.drag;
                    if (!d || e.pointerId !== d.id) return;
                    this.drag = null;
                    if (cancelled) return;
                    if (!d.moved) { this.camera.vel = 0; this.tap(this.toWorld(e.clientX, e.clientY)); }
                    else if (performance.now() - d.lastT > 90) this.camera.vel = 0;
                }

                tap(w) {
                    const game = this.game, ui = this.ui;
                    // 1) tap a peg: pick it back up
                    const peg = game.pegs.at(w.x, w.y);
                    if (peg) {
                        if (peg.type === 'dual') { ui.toast('Blast pegs cannot be picked up'); return; }
                        game.pegs.remove(peg);
                        ui.toast('Peg picked up');
                        ui.refresh();
                        return;
                    }
                    // 2) a peg is ready: place it right where you tapped
                    if (game.pegs.ready() > 0) {
                        const s = game.placeSpot(w.x, w.y), t = game.pegs.nextType();
                        game.pegs.add(s.x, s.y, t, t === 'dual' ? game.progress.dualReady.pop() : 0);
                        ui.refresh();
                        this.store.save();
                        return;
                    }
                    // 3) otherwise, tapping the launcher launches
                    if (Math.hypot(w.x - game.launchX, w.y - LAUNCH_Y) < 40) { ui.launch(); return; }
                    ui.toast(game.pegs.list.length ? 'No pegs ready. Buy more in the Shop.' : 'Launch balls into the bucket, then buy a peg!');
                }
            }

            /* =====================================================================
               UI: HUD, buttons, shop overlay and keyboard
               ===================================================================== */
            const TABS = { money: 'tabMoney', rp: 'tabRp', goo: 'tabGoo', evil: 'tabEvil' };   // shop tab per currency
            const PEG_LABEL = { basic: '', research: 'research ', dual: 'blast ', splitter: 'splitter ', gravity: 'gravity ' };
            const setText = (node, s) => { if (node._t !== s) { node._t = s; node.textContent = s; } };

            class Ui {
                constructor(game, camera, store) {
                    this.game = game;
                    this.camera = camera;
                    this.store = store;
                    this.d = {};
                    for (const id of ['app', 'hud', 'bar', 'hint', 'btns', 'launchBtn', 'evilBtn', 'upBtn', 'overlay', 'tabs', 'list',
                        'money', 'rpBox', 'rpNum', 'gooBox', 'gooNum', 'evilBox', 'evilNum', 'stBalls', 'stPegs', ...Object.values(TABS)]) this.d[id] = document.getElementById(id);
                    this.tab = 'money';
                    this.toastText = '';
                    this.toastUntil = 0;
                    this.hudH = -1;

                    this.cards = UPGRADES.map(u => this.makeCard(u));
                    for (const cur in TABS) this.d[TABS[cur]].addEventListener('click', () => { this.tab = cur; this.d.list.scrollTop = 0; this.refresh(); });
                    this.makeResetButton();

                    const d = this.d;
                    d.upBtn.addEventListener('click', () => this.shopOpen ? this.closeShop() : this.openShop());
                    d.launchBtn.addEventListener('click', () => {
                        if (game.L('auto') > 0) { game.autoOn = !game.autoOn; this.refresh(); store.save(); }   // with the Auto Dropper the button is the on/off switch
                        else this.launch();
                    });
                    d.evilBtn.addEventListener('click', () => this.setEvil(!game.evilOn));
                    window.addEventListener('keydown', e => {
                        if (e.key === 'Escape') this.closeShop();
                        else if ((e.key === 'e' || e.key === 'E') && !e.repeat) this.setEvil(!game.evilOn);
                        else if (e.code === 'Space' && !e.repeat) { e.preventDefault(); this.launch(); }
                    });

                    // reading offsetHeight every frame forces a layout; only re-measure when the HUD or button bar actually change size
                    this.padObserver = window.ResizeObserver ? new ResizeObserver(() => { this.measurePads(); camera.clamp(); }) : null;
                    if (this.padObserver) { this.padObserver.observe(d.hud); this.padObserver.observe(d.bar); }
                }

                get shopOpen() { return this.d.overlay.classList.contains('open'); }

                makeCard(u) {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.style.setProperty('--c', RES_COL[curOf(u)]);   // white = money, purple = research, green = goo
                    el.innerHTML =
                        '<div class="info"><div class="name"><span class="n"></span><span class="lvl"></span></div>' +
                        '<div class="desc"></div><div class="stat"></div></div>' +
                        '<button class="buy" type="button"><span class="bl"></span><span class="bc"></span></button>';
                    const ref = {
                        u, el,
                        n: el.querySelector('.n'), lvl: el.querySelector('.lvl'),
                        desc: el.querySelector('.desc'), stat: el.querySelector('.stat'),
                        btn: el.querySelector('.buy'), bl: el.querySelector('.bl'), bc: el.querySelector('.bc'),
                    };

                    // tap to buy; hold to keep buying. (Buying on click, not pointerdown, so scrolling the list never buys.)
                    let holdT = null, holdI = null, suppress = false;
                    const clearHold = () => { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; };
                    ref.btn.addEventListener('pointerdown', () => {
                        suppress = false; clearHold();
                        holdT = setTimeout(() => {
                            suppress = true;
                            if (!this.buy(u)) return;
                            holdI = setInterval(() => { if (!this.buy(u)) clearHold(); }, 90);
                        }, 450);
                    });
                    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => ref.btn.addEventListener(ev, clearHold));
                    ref.btn.addEventListener('click', () => { if (suppress) { suppress = false; return; } this.buy(u); });
                    ref.btn.addEventListener('contextmenu', e => e.preventDefault());
                    if (u.danger) ref.btn.classList.add('danger');   // glows red instead of green while running

                    this.d.list.appendChild(el);
                    return ref;
                }
                makeResetButton() {
                    const b = document.createElement('button');
                    b.id = 'resetBtn'; b.type = 'button'; b.textContent = 'Reset progress';
                    b.addEventListener('click', () => { if (confirm('Erase all progress and start over?')) this.store.reset(); });
                    this.d.list.appendChild(b);
                }

                buy(u) {
                    if (!this.game.buy(u)) return false;
                    if (u.id === 'bomb') this.closeShop();   // the shop covers the board: get out of the way so the bomb can be watched
                    else this.refresh();
                    return true;
                }
                launch() {
                    if (this.game.launch()) return;
                    this.toast(this.game.maxBalls() === 1 ? 'A ball is already in play' : 'All balls are in play');
                }
                toast(t, ms = 1600) { this.toastText = t; this.toastUntil = performance.now() + ms; }

                openShop() {
                    const d = this.d;
                    d.app.classList.add('ov');
                    d.app.style.setProperty('--barH', d.bar.offsetHeight + 'px');   // overlay stops above the button bar
                    d.overlay.classList.add('open'); d.overlay.setAttribute('aria-hidden', 'false');
                    this.refresh();
                }
                closeShop() {
                    const d = this.d;
                    d.overlay.classList.remove('open'); d.overlay.setAttribute('aria-hidden', 'true');
                    d.app.classList.remove('ov');
                    this.refresh();
                }
                setEvil(on) {
                    this.game.evilOn = !!on && this.game.L('evil') > 0;
                    this.d.app.classList.toggle('evil', this.game.evilOn);
                    this.refresh();
                }

                // how much of the screen the HUD and the button bar cover (the camera keeps the board between them)
                measurePads() {
                    const d = this.d, h = d.hud.offsetHeight;
                    if (h !== this.hudH) { this.hudH = h; d.app.style.setProperty('--hudH', h + 'px'); }   // the shop starts right below the HUD
                    this.camera.padTop = h - 6;
                    if (!d.app.classList.contains('ov')) this.camera.padBot = d.bar.offsetHeight;      // measured only while the bar is in its normal state
                }

                refresh() {
                    const game = this.game, p = game.progress, pegs = game.pegs, d = this.d;
                    game.uiDirty = false;

                    setText(d.money, '$' + fmt(Math.floor(p.money)));
                    const hasRp = p.L('research') > 0, hasGoo = p.L('goo') > 0, hasEvil = p.L('evil') > 0;
                    d.rpBox.classList.toggle('on', hasRp);
                    if (hasRp) setText(d.rpNum, fmt(Math.floor(p.rp * 10) / 10));
                    d.gooBox.classList.toggle('on', hasGoo);
                    if (hasGoo) setText(d.gooNum, fmt(Math.floor(p.goo)));
                    if (!hasEvil && game.evilOn) this.setEvil(false);
                    d.evilBox.classList.toggle('on', hasEvil);
                    if (hasEvil) setText(d.evilNum, evFmt(Math.floor(p.evil * 100) / 100));
                    d.evilBtn.classList.toggle('on', hasEvil);
                    d.evilBtn.classList.toggle('active', game.evilOn);
                    setText(d.evilBtn, game.evilOn ? 'EVIL ON' : 'EVIL');
                    d.btns.classList.toggle('three', hasEvil);
                    setText(d.stBalls, `${fmt(game.ballLoad())}/${game.maxBalls()}`);
                    setText(d.stPegs, `${pegs.list.length}/${pegs.list.length + pegs.ready()}`);   // placed / total that can be placed
                    const hasAuto = p.L('auto') > 0;
                    setText(d.launchBtn, hasAuto ? (game.autoOn ? 'AUTO: ON' : 'AUTO: OFF') : 'LAUNCH');
                    d.launchBtn.classList.toggle('autoon', hasAuto && game.autoOn);
                    d.launchBtn.classList.toggle('cant', hasAuto ? !game.autoOn : game.ballLoad() + 1 > game.maxBalls());

                    const canAfford = this.refreshCards();
                    const open = this.shopOpen;
                    d.upBtn.classList.toggle('alert', Object.keys(canAfford).length > 0 && !open);
                    setText(d.upBtn, open ? 'CLOSE' : 'SHOP');
                    d.tabs.classList.toggle('on', hasRp);
                    if (!hasRp) this.tab = 'money';
                    d.tabGoo.classList.toggle('on', hasGoo);
                    d.tabEvil.classList.toggle('on', hasEvil);
                    for (const cur in TABS) {
                        d[TABS[cur]].classList.toggle('sel', this.tab === cur);
                        d[TABS[cur]].classList.toggle('alert', !!canAfford[cur] && this.tab !== cur);
                    }

                    let h = '', pulse = false;
                    if (performance.now() < this.toastUntil) h = this.toastText;
                    else if (pegs.ready() > 0) { h = `Tap the board to place a ${PEG_LABEL[pegs.nextType()]}peg (${pegs.ready()} ready)`; pulse = true; }
                    else if (pegs.list.length === 0) {
                        h = p.money >= p.cost(UPGRADES[0]) ? 'Open the Shop and buy a peg!' : 'Press LAUNCH when the cannon lines up with the bucket';
                        pulse = true;
                    }
                    setText(d.hint, h);
                    d.hint.classList.toggle('pulse', pulse);
                }

                // updates every upgrade card; returns which currencies can buy something ({ money: true, ... })
                refreshCards() {
                    const game = this.game, p = game.progress, canAfford = {};
                    for (const c of this.cards) {
                        const u = c.u, unlocked = p.isUnlocked(u), maxed = p.isMaxed(u), l = p.L(u.id);
                        c.el.classList.toggle('locked', !unlocked);
                        c.el.classList.toggle('hid', curOf(u) !== this.tab);
                        if (!unlocked) {
                            setText(c.n, '???'); setText(c.lvl, '');
                            setText(c.desc, `Earn $${fmt(u.unlock)} in total to unlock`);
                            setText(c.stat, '');
                            setText(c.bl, 'LOCKED'); setText(c.bc, '🔒');
                            c.btn.classList.add('cant'); c.btn.classList.remove('maxed');
                            continue;
                        }
                        setText(c.n, u.name);
                        setText(c.lvl, u.temp ? (u.status ? u.status(p) : '') : maxed ? `Lv ${l} · MAX` : `Lv ${l}`);
                        setText(c.desc, u.desc);
                        setText(c.stat, (maxed || u.temp) ? u.stat(l) : `${u.stat(l)}  →  ${u.stat(l + 1)}`);
                        const tm = game.timer(u.id);
                        const afford = !maxed && !tm && p.wallet(u) >= p.cost(u);
                        if (afford) canAfford[curOf(u)] = true;
                        if (tm) { setText(c.bl, ''); setText(c.bc, tm.s + 's'); }   // only the seconds left, nothing else
                        else { setText(c.bl, maxed ? 'MAXED' : ''); setText(c.bc, maxed ? '✓' : p.priceText(u)); }
                        c.btn.classList.toggle('active', !!(tm && tm.active));      // glowing, twinkling green while running
                        c.btn.classList.toggle('cant', !afford && !maxed && !(tm && tm.active));
                        c.btn.classList.toggle('maxed', maxed);
                    }
                    return canAfford;
                }
            }

            /* =====================================================================
               SAVE / LOAD
               ===================================================================== */
            const SAVE_CODE = { research: 'r', dual: 'd', splitter: 's', gravity: 'g', basic: 'b' };
            const SAVE_TYPE = Object.fromEntries(Object.entries(SAVE_CODE).map(([type, code]) => [code, type]));

            class SaveStore {
                constructor(game) {
                    this.game = game;
                    this.resetting = false;              // no more saving once a reset is under way
                }
                autosave() {
                    setInterval(() => this.save(), 5000);
                    document.addEventListener('visibilitychange', () => { if (document.hidden) this.save(); });
                    window.addEventListener('pagehide', () => this.save());
                }
                reset() {
                    this.resetting = true;
                    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
                    location.reload();
                }
                save() {
                    if (this.resetting) return;
                    const g = this.game, p = g.progress;
                    try {
                        localStorage.setItem(SAVE_KEY, JSON.stringify({
                            v: 2, money: p.money, total: p.total, rp: p.rp, goo: p.goo, evil: p.evil, autoOn: g.autoOn, dualReady: p.dualReady, levels: p.levels,
                            timers: g.temps.toSave(),        // temporary goo upgrades: [time left running, cooldown left] (ms)
                            pegs: g.pegs.list.map(pg => [Math.round(pg.x * 10) / 10, Math.round(pg.y * 10) / 10, SAVE_CODE[pg.type] || 'b', pg.left || 0, Math.round(pg.dmg * 100) / 100]),
                        }));
                    } catch (e) { }
                }
                load() {
                    const g = this.game, p = g.progress;
                    try {
                        const raw = localStorage.getItem(SAVE_KEY);
                        if (!raw) return;
                        const d = JSON.parse(raw);
                        const pd = v => Number.isFinite(v) ? Math.min(0.99, Math.max(0, v)) : 0;   // saved peg damage
                        for (const k of ['money', 'total', 'rp', 'goo', 'evil']) if (Number.isFinite(d[k])) p[k] = d[k];   // goo is trimmed to the limit once the levels are loaded
                        if (typeof d.autoOn === 'boolean') g.autoOn = d.autoOn;
                        if (d.timers) g.temps.load(d.timers);
                        if (Array.isArray(d.dualReady)) p.dualReady = d.dualReady.filter(Number.isFinite).map(n => n | 0);
                        if (d.levels) for (const u of UPGRADES) if (Number.isFinite(d.levels[u.id])) p.levels[u.id] = d.levels[u.id] | 0;
                        g.growWorld();
                        p.goo = Math.min(p.goo, p.gooCap());
                        if (Array.isArray(d.pegs)) {
                            for (const pt of d.pegs) {
                                if (!Array.isArray(pt) || !Number.isFinite(pt[0]) || !Number.isFinite(pt[1])) continue;
                                if (pt[2] === 'd') { if (Number.isFinite(pt[3]) && pt[3] > 0) g.pegs.add(pt[0], pt[1], 'dual', pt[3] | 0, pd(pt[4])); continue; }
                                const type = SAVE_TYPE[pt[2]] || 'basic';
                                if (g.pegs.readyOf(type) <= 0) continue;   // never more pegs than owned
                                g.pegs.add(pt[0], pt[1], type, 0, pd(pt[4]));
                            }
                        }
                    } catch (e) { }
                }
            }

            /* =====================================================================
               APP: wires everything together and runs the frame loop
               ===================================================================== */
            class App {
                constructor() {
                    this.game = new Game();
                    this.camera = new Camera(() => this.game.worldH);
                    this.store = new SaveStore(this.game);
                    this.renderer = new Renderer(document.getElementById('game'), this.game, this.camera);
                    this.ui = new Ui(this.game, this.camera, this.store);
                    this.input = new Input(this.renderer.canvas, this.game, this.camera, this.ui, this.store);

                    this.store.autosave();
                    window.addEventListener('resize', () => this.resize());
                    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 150));

                    this.store.load();
                    this.resize();
                    this.camera.y = this.camera.range()[0];   // start looking at the top, where the launcher is
                    this.ui.refresh();

                    this.last = performance.now();
                    this.acc = 0;                        // simulated time owed to the physics (ms)
                    this.uiT = 0;
                    this.skipRender = false;
                    this.frameAvg = 16;                  // quality governor: average frame time and how long it has been too slow
                    this.slowT = 0;
                    this.dbg = { frames: 0, phys: 0, draw: 0, t: 0, text: '' };
                    this.frame = this.frame.bind(this);
                }

                resize() {
                    this.renderer.resize();
                    this.ui.measurePads();
                    this.camera.clamp();
                }
                start() { requestAnimationFrame(this.frame); }

                // if frames stay slow (below ~50 fps) for 1.5 seconds, lower the canvas pixel ratio one tier
                governQuality(raw) {
                    if (raw >= 250) return;              // ignore the gap after the tab was hidden
                    this.frameAvg += (raw - this.frameAvg) * 0.05;
                    this.slowT = this.frameAvg > 20 ? this.slowT + raw : 0;
                    if (this.slowT > 1500 && this.renderer.lowerQuality()) { this.slowT = 0; this.frameAvg = 16; this.resize(); }
                }

                frame(t) {
                    const raw = t - this.last, dt = Math.min(100, raw);
                    this.last = t;
                    this.governQuality(raw);

                    // fixed-timestep physics, identical behaviour on 60 Hz and 120 Hz screens
                    const t0 = DEBUG ? performance.now() : 0;
                    this.acc += dt;
                    let n = 0;
                    while (this.acc >= STEP && n < MAX_STEPS) { this.game.step(STEP); this.acc -= STEP; n++; }
                    if (n === MAX_STEPS) this.acc = Math.min(this.acc, STEP);
                    const t1 = DEBUG ? performance.now() : 0;

                    if (!this.ui.padObserver) this.ui.measurePads();
                    this.camera.coast(dt, this.input.dragging);

                    // the shop covers most of the board, so the board is only drawn every other frame while it is open
                    this.skipRender = this.ui.shopOpen && !this.skipRender;
                    if (!this.skipRender) this.renderer.render(this.acc / STEP, this.input);
                    if (DEBUG) this.debug(raw, t1 - t0, performance.now() - t1);

                    this.uiT += dt;
                    if (this.uiT > 100 || this.game.uiDirty) { this.uiT = 0; this.ui.refresh(); }
                    requestAnimationFrame(this.frame);
                }

                debug(raw, phys, draw) {
                    const d = this.dbg, g = this.game;
                    d.frames++; d.phys += phys; d.draw += draw; d.t += raw;
                    if (d.t >= 1000) {
                        d.text = `${Math.round(d.frames * 1000 / d.t)} fps  phys ${(d.phys / d.frames).toFixed(1)}ms  draw ${(d.draw / d.frames).toFixed(1)}ms  dpr ${this.renderer.dpr}  pegs ${g.pegs.list.length}  balls ${g.balls.length}`;
                        d.frames = d.phys = d.draw = d.t = 0;
                    }
                    this.renderer.drawDebug(d.text);
                }
            }

            new App().start();
        })();
    </script>
</body>
