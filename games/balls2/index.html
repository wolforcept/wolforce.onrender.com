<!doctype html>
<html lang="en">

<head>
    <base href="./">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07051a">
    <title>Neon Pegs</title>
    <style>
        :root {
            --bg: #07051a;
            --cyan: #19f5ff;
            --mag: #ff2bd6;
            --lime: #b6ff2e;
            --orange: #ff9d1a;
            --violet: #8a5bff;
            --goo: #6bff1f;
            --gold: #ffd23a;
            --evil: #ff2a3d;
            --text: #e8e6ff;
            --dim: #8b86b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #03020c;
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            background: radial-gradient(120% 80% at 50% 0%, #1a1252 0%, var(--bg) 62%);
            box-shadow: 0 0 60px rgba(138, 91, 255, .25);
        }

        canvas#game {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none
        }

        /* ---------- evil mode: the whole screen turns red ---------- */
        #evilBg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .7s ease;
            background: radial-gradient(120% 80% at 50% 0%, #9c0f22 0%, #3d0510 62%)
        }

        #evilVig {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity .7s ease;
            box-shadow: inset 0 0 140px 20px rgba(255, 20, 50, .55);
            background: rgba(255, 20, 40, .07)
        }

        #app.evil #evilBg,
        #app.evil #evilVig {
            opacity: 1
        }

        #app.evil #hud {
            background: linear-gradient(#2a0409f2 55%, #2a040900)
        }

        #app.evil #bar {
            background: linear-gradient(#2a040900, #2a0409f0 38%)
        }

        #app.evil.ov #bar {
            background: rgba(30, 3, 8, .96)
        }

        /* ---------- HUD ---------- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            pointer-events: none;
            padding: calc(env(safe-area-inset-top) + 10px) 14px 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(#07051af2 55%, #07051a00);
        }

        #money {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.05;
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold), 0 0 22px rgba(255, 210, 58, .55)
        }

        #rate {
            font-size: 12px;
            font-weight: 600;
            color: var(--lime);
            text-shadow: 0 0 8px rgba(182, 255, 46, .7);
            margin-top: 2px
        }

        #topL {
            display: flex;
            gap: 16px;
            align-items: flex-start
        }

        #resCol {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-top: 2px
        }

        .res {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1
        }

        .res.on {
            display: flex
        }

        .res svg {
            width: 18px;
            height: 18px;
            flex: none
        }

        .res small {
            font-size: 11px;
            font-weight: 600;
            opacity: .85
        }

        #rpBox {
            color: var(--violet);
            text-shadow: 0 0 8px var(--violet), 0 0 20px rgba(138, 91, 255, .5)
        }

        #rpBox svg {
            filter: drop-shadow(0 0 4px var(--violet))
        }

        #gooBox {
            color: var(--goo);
            text-shadow: 0 0 8px var(--goo), 0 0 20px rgba(107, 255, 31, .45)
        }

        #gooBox svg {
            filter: drop-shadow(0 0 4px var(--goo))
        }

        #evilBox {
            color: var(--evil);
            text-shadow: 0 0 8px var(--evil), 0 0 20px rgba(255, 42, 61, .5)
        }

        #evilBox svg {
            filter: drop-shadow(0 0 4px var(--evil))
        }

        #stats {
            text-align: right;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--dim);
            line-height: 1.55;
            font-weight: 600
        }

        #stats b {
            color: var(--mag);
            text-shadow: 0 0 8px rgba(255, 43, 214, .7);
            font-size: 13px
        }

        /* ---------- round buttons ---------- */
        .round {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid var(--violet);
            color: #fff;
            font-size: 15px;
            background: rgba(138, 91, 255, .16);
            box-shadow: 0 0 10px rgba(138, 91, 255, .55);
            cursor: pointer;
        }

        .round:active {
            transform: scale(.92)
        }

        /* ---------- bottom bar ---------- */
        #bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 25;
            pointer-events: none;
            padding: 26px 14px calc(env(safe-area-inset-bottom) + 12px);
            background: linear-gradient(#07051a00, #07051af0 38%);
        }

        #app.ov #bar {
            padding-top: 10px;
            background: rgba(5, 3, 20, .96);
            border-top: 1px solid rgba(138, 91, 255, .35)
        }

        #app.ov #hint {
            display: none
        }

        #hint {
            min-height: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            color: var(--lime);
            text-shadow: 0 0 8px rgba(182, 255, 46, .7);
            margin-bottom: 8px;
        }

        #hint.pulse {
            animation: pulse 1.4s ease-in-out infinite
        }

        @keyframes pulse {
            50% {
                opacity: .45
            }
        }

        #btns {
            display: flex;
            gap: 10px
        }

        .big {
            --k: var(--mag);
            pointer-events: auto;
            position: relative;
            height: 56px;
            border-radius: 16px;
            cursor: pointer;
            color: #fff;
            font: 800 15px/1 system-ui, sans-serif;
            letter-spacing: 3px;
            border: 2px solid var(--k);
            background: color-mix(in srgb, var(--k) 12%, transparent);
            text-shadow: 0 0 8px var(--k);
            box-shadow: 0 0 14px color-mix(in srgb, var(--k) 55%, transparent), inset 0 0 16px color-mix(in srgb, var(--k) 22%, transparent);
        }

        .big:active {
            transform: scale(.97)
        }

        .big.cant {
            opacity: .4;
            box-shadow: none
        }

        #launchBtn {
            --k: var(--cyan);
            flex: 1.25
        }

        #launchBtn.autoon {
            background: color-mix(in srgb, var(--k) 42%, transparent);
            box-shadow: 0 0 24px var(--k), inset 0 0 20px color-mix(in srgb, var(--k) 45%, transparent)
        }

        #upBtn {
            --k: var(--mag);
            flex: 1
        }

        #evilBtn {
            --k: var(--evil);
            flex: 1;
            display: none
        }

        #evilBtn.on {
            display: block
        }

        #evilBtn.active {
            background: color-mix(in srgb, var(--k) 42%, transparent);
            box-shadow: 0 0 24px var(--k), inset 0 0 20px color-mix(in srgb, var(--k) 45%, transparent)
        }

        #btns.three .big {
            letter-spacing: 1.5px;
            font-size: 13px
        }

        #upBtn.alert::after {
            content: "";
            position: absolute;
            top: 8px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 10px var(--lime);
            animation: pulse 1s ease-in-out infinite;
        }

        /* ---------- upgrades overlay (sits above the button bar so you can keep launching) ---------- */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--barH, 0px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            background: rgba(5, 3, 20, .80);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            transform: translateY(100%);
            visibility: hidden;
            transition: transform .26s ease, visibility 0s .26s;
        }

        #overlay.open {
            transform: none;
            visibility: visible;
            transition: transform .26s ease, visibility 0s 0s
        }

        #ovHead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
            border-bottom: 1px solid rgba(138, 91, 255, .35);
        }

        .ovTitle {
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 800;
            color: var(--mag);
            text-shadow: 0 0 8px var(--mag)
        }

        #ovMoney {
            font-size: 26px;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold), 0 0 20px rgba(255, 210, 58, .5)
        }

        #closeBtn {
            border-color: var(--mag);
            box-shadow: 0 0 10px rgba(255, 43, 214, .55);
            background: rgba(255, 43, 214, .14)
        }

        #tabs {
            display: none;
            gap: 8px;
            padding: 10px 12px 0
        }

        #tabs.on {
            display: flex
        }

        .tab {
            flex: 1;
            position: relative;
            height: 38px;
            border-radius: 10px;
            border: 1.5px solid #4a4670;
            background: rgba(255, 255, 255, .04);
            color: var(--dim);
            font: 800 11px/1 system-ui, sans-serif;
            letter-spacing: 1px;
            cursor: pointer
        }

        .tab.sel {
            color: #fff;
            border-color: var(--k);
            background: color-mix(in srgb, var(--k) 16%, transparent);
            box-shadow: 0 0 10px color-mix(in srgb, var(--k) 55%, transparent)
        }

        #tabMoney {
            --k: var(--cyan)
        }

        #tabRp {
            --k: var(--violet)
        }

        #tabGoo {
            --k: var(--goo);
            display: none
        }

        #tabGoo.on {
            display: block
        }

        #tabEvil {
            --k: var(--evil);
            display: none
        }

        #tabEvil.on {
            display: block
        }

        .tab.alert::after {
            content: "";
            position: absolute;
            top: 6px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 8px var(--lime)
        }

        .card.hid {
            display: none
        }

        #ovBal {
            display: flex;
            gap: 12px;
            align-items: center
        }

        #ovRp {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 800;
            color: var(--violet);
            text-shadow: 0 0 8px var(--violet)
        }

        #ovRp.on {
            display: flex
        }

        #ovRp svg,
        #ovGoo svg {
            width: 18px;
            height: 18px;
            flex: none
        }

        #ovGoo {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 800;
            color: var(--goo);
            text-shadow: 0 0 8px var(--goo)
        }

        #ovGoo.on {
            display: flex
        }

        #ovEvil {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 800;
            color: var(--evil);
            text-shadow: 0 0 8px var(--evil)
        }

        #ovEvil.on {
            display: flex
        }

        #ovEvil svg {
            width: 18px;
            height: 18px;
            flex: none
        }

        #list {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 28px;
        }

        .card {
            --c: var(--cyan);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 12px 12px 14px;
            border-radius: 14px;
            background: rgba(16, 12, 46, .72);
            border: 1px solid rgba(255, 255, 255, .08);
            border-left: 3px solid var(--c);
            box-shadow: 0 0 14px color-mix(in srgb, var(--c) 18%, transparent);
        }

        .card .name {
            font-weight: 800;
            font-size: 15px;
            color: var(--c);
            text-shadow: 0 0 8px color-mix(in srgb, var(--c) 70%, transparent)
        }

        .card .lvl {
            color: var(--dim);
            font-weight: 600;
            font-size: 12px;
            margin-left: 6px;
            text-shadow: none
        }

        .card .desc {
            font-size: 12px;
            color: #b9b5e0;
            margin-top: 3px;
            line-height: 1.35
        }

        .card .stat {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px
        }

        .card.locked {
            --c: #5d5a82;
            opacity: .65
        }

        .card.locked .name {
            text-shadow: none
        }

        .buy {
            min-width: 100px;
            min-height: 54px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid var(--c);
            background: color-mix(in srgb, var(--c) 14%, transparent);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-family: inherit;
            box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-y;
        }

        .buy .bl {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px
        }

        .buy .bc {
            font-size: 15px;
            font-weight: 800
        }

        .buy:active {
            transform: scale(.95)
        }

        .buy.cant {
            opacity: .38;
            box-shadow: none;
            border-color: #6b678f;
            background: rgba(255, 255, 255, .04)
        }

        .buy.maxed,
        .card.locked .buy {
            opacity: .4;
            box-shadow: none;
            cursor: default
        }

        #resetBtn {
            display: block;
            margin: 22px auto 0;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #4a4670;
            background: none;
            color: var(--dim);
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="evilBg"></div>
        <canvas id="game"></canvas>
        <div id="evilVig"></div>

        <div id="hud">
            <div id="topL">
                <div>
                    <div id="money">$0</div>
                    <div id="rate">+0/s</div>
                </div>
                <div id="resCol">
                    <div class="res" id="rpBox"><svg viewBox="0 0 24 24">
                            <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="rgba(138,91,255,.25)" stroke="#8a5bff" stroke-width="2.2" stroke-linejoin="round" />
                        </svg><span id="rpNum">0</span><small id="rpRate">+0/s</small></div>
                    <div class="res" id="gooBox"><svg viewBox="0 0 24 24">
                            <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z" fill="rgba(107,255,31,.3)" stroke="#6bff1f" stroke-width="2.2" stroke-linejoin="round" />
                        </svg><span id="gooNum">0</span></div>
                    <div class="res" id="evilBox"><svg viewBox="0 0 24 24">
                            <polygon points="12,2.5 14.4,9.3 21.5,9.4 15.8,13.7 17.9,20.6 12,16.5 6.1,20.6 8.2,13.7 2.5,9.4 9.6,9.3" fill="rgba(255,42,61,.3)" stroke="#ff2a3d" stroke-width="2" stroke-linejoin="round" />
                        </svg><span id="evilNum">0</span></div>
                </div>
            </div>
            <div id="stats">BALLS <b id="stBalls">0/1</b><br>PEGS <b id="stPegs">0</b><br>READY <b id="stReady">0</b></div>
        </div>

        <div id="bar">
            <div id="hint"></div>
            <div id="btns">
                <button id="launchBtn" class="big" type="button">LAUNCH</button>
                <button id="evilBtn" class="big" type="button">EVIL</button>
                <button id="upBtn" class="big" type="button">UPGRADES</button>
            </div>
        </div>

        <div id="overlay" aria-hidden="true">
            <div id="ovHead">
                <div>
                    <div class="ovTitle">UPGRADES</div>
                    <div id="ovBal">
                        <div id="ovMoney">$0</div>
                        <div id="ovRp"><svg viewBox="0 0 24 24">
                                <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="rgba(138,91,255,.25)" stroke="#8a5bff" stroke-width="2.2" stroke-linejoin="round" />
                            </svg><span id="ovRpNum">0</span></div>
                        <div id="ovGoo"><svg viewBox="0 0 24 24">
                                <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z" fill="rgba(107,255,31,.3)" stroke="#6bff1f" stroke-width="2.2" stroke-linejoin="round" />
                            </svg><span id="ovGooNum">0</span></div>
                        <div id="ovEvil"><svg viewBox="0 0 24 24">
                                <polygon points="12,2.5 14.4,9.3 21.5,9.4 15.8,13.7 17.9,20.6 12,16.5 6.1,20.6 8.2,13.7 2.5,9.4 9.6,9.3" fill="rgba(255,42,61,.3)" stroke="#ff2a3d" stroke-width="2" stroke-linejoin="round" />
                            </svg><span id="ovEvilNum">0</span></div>
                    </div>
                </div>
                <button class="round" id="closeBtn" type="button" aria-label="Close">✕</button>
            </div>
            <div id="tabs">
                <button class="tab sel" id="tabMoney" type="button">MONEY</button>
                <button class="tab" id="tabRp" type="button">RESEARCH</button>
                <button class="tab" id="tabGoo" type="button">GOO</button>
                <button class="tab" id="tabEvil" type="button">EVIL</button>
            </div>
            <div id="list"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        (() => {
            'use strict';

            /* =====================================================================
               CONFIG
               ===================================================================== */
            const W = 360;                              // logical world width (height grows with upgrades)
            const STEP = 1000 / 90;                     // fixed physics step (ms)
            const PEG_R = 9;
            const LAUNCH_Y = 38;                        // ball leaves the cannon just below the ceiling
            const BUCKET_X = W / 2;
            const LAUNCH_SPEED = 3;                     // initial downward speed (px per physics step)
            const SWEEP_MS = 3600;                      // time for one full left-right-left sweep
            const SWEEP_MARGIN = 26;                    // how close the cannon gets to the walls
            const MAX_SPEED = 22;
            const GRAVITY_SCALE = 0.0004;
            const G_STEP = GRAVITY_SCALE * (1000 / 60) * (1000 / 60);   // gravity in Matter's px/step^2
            const PALETTE = ['#19f5ff', '#ff2bd6', '#b6ff2e', '#ff9d1a', '#8a5bff'];
            const GOLD = '#ffd23a';
            const BALL_GLOWS = ['#3d8bff', '#4da3ff', '#19a8ff', '#5b7bff', '#7a4dff', '#8a5bff', '#a56bff', '#b78cff'];   // each ball gets a random bluish or purplish glow
            const randGlow = () => BALL_GLOWS[(Math.random() * BALL_GLOWS.length) | 0];
            const PEG_TYPES = { basic: { color: '#ffffff' }, research: { color: '#8a5bff' }, dual: { color: '#ffd23a' }, splitter: { color: '#4da3ff' } };   // more peg types (other colours, other effects) go here
            const SAVE_KEY = 'neonpegs.save.v2';

            /* =====================================================================
               UPGRADES  (data driven: add an object here and it shows up in the list)
               ===================================================================== */
            const worldHeight = l => 360 + 140 * l;
            const spreadDeg = l => 1 + 3 * l;                            // total random launch range, in degrees
            const bucketW = l => 160 + 14 * l;
            const bucketValue = l => 1 + l;
            const restitution = l => 0.5 + 0.045 * l;
            const ballRadius = l => 6 + 0.6 * l;
            const rpRate = l => 0.1 * l;                                 // research points per second
            const RP_PEG = 0.5;                                          // research points per research-peg hit
            const autoInterval = l => 2000 * Math.pow(0.85, l - 1);      // ms between automatic drops
            const bucketCount = l => l >= 20 ? 7 : l >= 15 ? 6 : l >= 10 ? 5 : l >= 7 ? 4 : l >= 4 ? 3 : l >= 1 ? 2 : 1;
            const BUCKET_GAP = 12;                                       // empty space between neighbouring buckets (a ball falling in the gap is lost)
            const midMult = l => 1 + 0.5 * l;                            // value multiplier of the middle bucket
            const MONEY_MAX = 5;                                         // base max level of the normal money upgrades
            const GOO_COL = '#6bff1f';                                   // acid green
            const GOO_MAX = 10;                                          // research levels of Phlegm Goo
            const gooChance = l => l <= 0 ? 0 : 0.01 + 0.04 * (1 - Math.pow(0.75, l - 1)) / (1 - Math.pow(0.75, GOO_MAX - 1));   // 1% at level 1, 5% at max level, diminishing steps
            const GOLD_CHANCE = 0.05;                                     // chance that a launched ball is a gold ball (once researched)
            const goldMult = l => l <= 0 ? 1 : 2 + 0.25 * (l - 1);       // money multiplier of gold balls: x2 at level 1, slowly rising
            const GOOBALL_PEGS = 10;                                     // a gooball vanishes after touching this many pegs
            const GOO_PEG_MS = 12000;                                    // how long a pegs stays goo-coated
            const GOO_PER_HIT = 1;                                       // Phlegm Goo per (non-goo) ball hit on a goo peg
            const DUAL_HITS = 5, DUAL_MULT = 100;                        // dual peg: hits before it vanishes, reward multiplier
            const BURST_MS = 8000, BURST_CD = 30000;                     // ball burst: duration, cooldown after it ends
            const GHOST_MS = 10000;                                      // ghost balls duration
            const edgeMult = l => 1 / (1 + 0.1 * l);                     // value multiplier of the outermost buckets

            // upgrade card colour = the colour of the resource it is paid with
            const RES_COL = { money: '#ffffff', rp: '#8a5bff', goo: '#6bff1f', evil: '#ff2a3d' };

            /* ---- evil: a 4th resource (red star). While the Evil toggle is on, every peg hit damages the peg and yields evil ---- */
            const EVIL_COL = '#ff2a3d';
            const EVIL_COST = 1000;                                      // research points needed to unlock evil
            const EVIL_BASE = 0.01;                                      // evil per hit on an undamaged peg; grows towards 1 as the peg gets damaged
            const EVIL_KILL = 50;                                        // evil from destroying a peg
            const evilDmg = l => 0.05 * Math.pow(0.88, l);               // damage per hit (a peg is destroyed at 1)
            const evilRegen = l => 0.02 * (1 + 0.6 * l);                 // damage healed per second while evil is off
            const evilYield = l => 1 + 0.25 * l;                         // multiplier on all evil gained

            const UPGRADES = [
                {
                    id: 'peg', name: 'New Peg', color: '#19f5ff', base: 5, growth: 1.13, max: 0, unlock: 0,
                    desc: 'Adds a peg to place. Tap the board to place it, tap a placed peg to pick it back up.',
                    stat: l => `${l} owned`
                },
                {
                    id: 'ball', name: 'Ball Value', color: '#b6ff2e', base: 20, growth: 1.5, max: MONEY_MAX, unlock: 8,
                    desc: 'Every peg hit pays more.',
                    stat: l => `$${fmt(1 + l)} per hit`
                },
                {
                    id: 'bucket', name: 'Bucket Value', color: '#ffd23a', base: 25, growth: 1.55, max: MONEY_MAX, unlock: 15,
                    desc: 'A ball landing in the bucket pays more.',
                    stat: l => `$${fmt(bucketValue(l))} per catch`
                },
                {
                    id: 'balls', name: 'Extra Ball', color: '#ff9d1a', base: 50, growth: 2.4, max: MONEY_MAX, unlock: 30,
                    desc: 'Allows one more ball in play at the same time.',
                    stat: l => `${1 + l} ball${l ? 's' : ''} at once`
                },
                {
                    id: 'power', name: 'Peg Power', color: '#ff2bd6', base: 120, growth: 1.8, max: MONEY_MAX, unlock: 60,
                    desc: 'Multiplies the value of every peg hit.',
                    stat: l => `x${(1 + 0.5 * l).toFixed(1)}`
                },
                {
                    id: 'research', name: 'Research Lab', color: '#8a5bff', base: 200, growth: 1.7, max: MONEY_MAX, unlock: 120,
                    desc: 'Unlocks research points (hexagons), which generate slowly on their own. Every level makes them come faster.',
                    stat: l => `${rpRate(l).toFixed(1)} RP per second`
                },
                {
                    id: 'wide', name: 'Wide Bucket', color: '#b6ff2e', base: 120, growth: 1.9, max: MONEY_MAX, unlock: 200,
                    desc: 'A wider bucket is easier to hit (with more buckets, the whole row gets wider).',
                    stat: l => `${bucketW(l)} wide`
                },
                {
                    id: 'spread', name: 'Wild Launch', color: '#ff9d1a', base: 200, growth: 2.0, max: MONEY_MAX, unlock: 250,
                    desc: 'The launch angle gets more random: balls spread out and reach more pegs.',
                    stat: l => `${spreadDeg(l)}° range`
                },
                {
                    id: 'combo', name: 'Combo Chain', color: '#19f5ff', base: 400, growth: 1.7, max: MONEY_MAX, unlock: 400,
                    desc: 'Each consecutive peg hit by the same ball is worth more.',
                    stat: l => `+${5 * l}% per hit in a row`
                },
                {
                    id: 'gold', name: 'Golden Pegs', color: '#ffd23a', base: 900, growth: 2.0, max: MONEY_MAX, unlock: 800,
                    desc: 'Hits can turn golden and pay x5.',
                    stat: l => `${4 * l}% chance`
                },
                {
                    id: 'bounce', name: 'Bouncy Balls', color: '#b6ff2e', base: 1200, growth: 1.9, max: MONEY_MAX, unlock: 1000,
                    desc: 'Balls keep more energy when they bounce.',
                    stat: l => `${Math.round(restitution(l) * 100)}% bounce`
                },
                {
                    id: 'fat', name: 'Fat Balls', color: '#ff9d1a', base: 2000, growth: 1.9, max: MONEY_MAX, unlock: 1500,
                    desc: 'Bigger balls are harder to miss with.',
                    stat: l => `radius ${ballRadius(l).toFixed(1)}`
                },

                /* ---- research tab: these cost research points (cur: 'rp') ---- */
                {
                    id: 'depth', cur: 'rp', name: 'Taller World', color: '#8a5bff', base: 3, growth: 1.8, max: 8, unlock: 0,
                    desc: 'Makes the board taller: more room below the launcher for pegs.',
                    stat: l => `${worldHeight(l)} tall`
                },
                {
                    id: 'cap', cur: 'rp', name: 'Upgrade Limit', color: '#ffd23a', base: 12, growth: 1.5, max: 15, unlock: 0,
                    desc: 'Raises the maximum level of every money upgrade by 1 per level. New Peg has no limit anyway.',
                    stat: l => `money upgrades up to Lv ${MONEY_MAX + l}`
                },
                {
                    id: 'auto', cur: 'rp', name: 'Auto Dropper', color: '#19f5ff', base: 4, growth: 1.6, max: 14, unlock: 0,
                    desc: 'Balls drop on their own (still limited by your max balls). Every level drops faster.',
                    stat: l => l ? `1 ball every ${(autoInterval(l) / 1000).toFixed(2)}s` : 'off'
                },
                {
                    id: 'rpeg', cur: 'rp', name: 'Research Pegs', color: '#8a5bff', base: 6, growth: 1.5, max: 20, unlock: 0,
                    desc: 'Adds a hexagonal research peg to place. Balls that hit it earn research points instead of money.',
                    stat: l => `${l} owned, +${RP_PEG} RP per hit`
                },
                {
                    id: 'splitpeg', cur: 'rp', name: 'Splitter Pegs', color: '#4da3ff', base: 10, growth: 1.45, max: 10, unlock: 0,
                    desc: 'Adds a blue splitter peg to place. A ball that hits it splits in two half-size balls, each counting as half a ball for your ball limit. Half-size balls cannot be split again.',
                    stat: l => `${l} owned`
                },
                {
                    id: 'goldball', cur: 'rp', name: 'Gold Balls', color: '#ffd23a', base: 20, growth: 1.5, max: 12, unlock: 0,
                    desc: `Unlocks gold balls: ${GOLD_CHANCE * 100}% of launched balls are gold, and all the money a gold ball earns (pegs and buckets) is multiplied. More levels make the multiplier bigger.`,
                    stat: l => `${GOLD_CHANCE * 100}% chance, x${goldMult(l).toFixed(2)} money`
                },
                {
                    id: 'buckets', cur: 'rp', name: 'More Buckets', color: '#ffd23a', base: 8, growth: 1.25, max: 0, unlock: 0,
                    desc: 'Splits the bottom into several separate buckets: 2 at level 1, then 3, 4, 5, 6 and 7 (at levels 4, 7, 10, 15 and 20). The middle ones pay more and the outer ones less, and every level widens the gap. Balls that fall between buckets are lost.',
                    stat: l => l ? `${bucketCount(l)} buckets, middle x${midMult(l).toFixed(1)}, edges x${edgeMult(l).toFixed(2)}` : '1 bucket'
                },
                {
                    id: 'goo', cur: 'rp', name: 'Phlegm Goo', color: '#6bff1f', base: 15, growth: 1.6, max: GOO_MAX, unlock: 0,
                    desc: 'Unlocks Phlegm Goo. Some balls become gooballs (they vanish after touching 10 pegs): pegs they hit turn into goo pegs for a while, and any other ball hitting a goo peg produces Phlegm Goo. More levels mean more gooballs, with diminishing returns.',
                    stat: l => `${(gooChance(l) * 100).toFixed(1)}% gooball chance`
                },

                {
                    id: 'evil', cur: 'rp', fixed: true, name: 'Evil', color: '#ff2a3d', base: EVIL_COST, growth: 1, max: 1, unlock: 0,
                    desc: 'Unlocks the Evil toggle, the Evil resource (red star) and a new Evil tab. While Evil is on, every peg that is hit takes damage, turns redder and yields Evil. Destroyed pegs must be placed again. Pegs heal while Evil is off.',
                    stat: l => l ? 'unlocked' : 'locked'
                },

                /* ---- goo tab: temporary upgrades, paid in Phlegm Goo, fixed price (growth 1) ---- */
                {
                    id: 'dual', cur: 'goo', temp: true, name: 'Dual Pegs', color: '#ffd23a', base: 10, growth: 1, max: 0, unlock: 0,
                    desc: `Adds a temporary dual peg to place. Every hit pays money AND research points at x${DUAL_MULT}. It disappears after ${DUAL_HITS} hits.`,
                    status: () => `${state.dualReady.length} ready`,
                    stat: () => `x${DUAL_MULT} money and RP, ${DUAL_HITS} hits`,
                    onBuy: () => { state.dualReady.push(DUAL_HITS); }
                },
                {
                    id: 'burst', cur: 'goo', temp: true, name: 'Ball Burst', color: '#ff9d1a', base: 25, growth: 1, max: 0, unlock: 0,
                    desc: `For ${BURST_MS / 1000} seconds you can have 10x as many balls in play. Then it needs ${BURST_CD / 1000} seconds to recharge.`,
                    badge: () => burstT > 0 ? `ACTIVE ${Math.ceil(burstT / 1000)}s` : burstCD > 0 ? `COOLDOWN ${Math.ceil(burstCD / 1000)}s` : '',
                    stat: () => `x10 ball limit for ${BURST_MS / 1000}s`,
                    onBuy: () => { burstT = BURST_MS; }
                },
                {
                    id: 'ghost', cur: 'goo', temp: true, name: 'Ghost Balls', color: '#19f5ff', base: 20, growth: 1, max: 0, unlock: 0,
                    desc: `For ${GHOST_MS / 1000} seconds every ball passes through pegs, but still hits them and earns the rewards.`,
                    badge: () => ghostT > 0 ? `ACTIVE ${Math.ceil(ghostT / 1000)}s` : '',
                    stat: () => `non-solid balls for ${GHOST_MS / 1000}s`,
                    onBuy: () => { ghostT = GHOST_MS; for (const b of balls) b.body.collisionFilter.mask = 4; }
                },

                /* ---- evil tab: paid in Evil (red star) ---- */
                {
                    id: 'evilhard', cur: 'evil', name: 'Sturdy Pegs', color: '#ff2a3d', base: 25, growth: 1.6, max: 10, unlock: 0,
                    desc: 'Pegs take less damage from each hit while Evil is on, so they last longer (and pay more Evil per hit before breaking).',
                    stat: l => `${(evilDmg(l) * 100).toFixed(1)}% damage per hit`
                },
                {
                    id: 'evilregen', cur: 'evil', name: 'Fast Healing', color: '#ff2a3d', base: 25, growth: 1.6, max: 10, unlock: 0,
                    desc: 'Damaged pegs heal faster while Evil is off.',
                    stat: l => `${(evilRegen(l) * 100).toFixed(1)}% healed per second`
                },
                {
                    id: 'evilyield', cur: 'evil', name: 'Dark Harvest', color: '#ff2a3d', base: 50, growth: 1.7, max: 10, unlock: 0,
                    desc: 'Every hit and every destroyed peg yields more Evil.',
                    stat: l => `x${evilYield(l).toFixed(2)} Evil`
                },
            ];

            /* =====================================================================
               STATE
               ===================================================================== */
            const state = { money: 0, total: 0, rp: 0, goo: 0, evil: 0, dualReady: [], levels: {}, pegs: [] };
            UPGRADES.forEach(u => state.levels[u.id] = 0);
            const L = id => state.levels[id] | 0;
            const placedOf = t => state.pegs.filter(p => p.type === t).length;
            const readyOf = t => Math.max(0, (t === 'research' ? L('rpeg') : t === 'splitter' ? L('splitpeg') : L('peg')) - placedOf(t));
            const ready = () => readyOf('basic') + readyOf('research') + readyOf('splitter') + state.dualReady.length;
            const nextType = () => state.dualReady.length ? 'dual' : readyOf('research') > 0 ? 'research' : readyOf('splitter') > 0 ? 'splitter' : 'basic';   // dual first, then research
            const maxBalls = () => (1 + L('balls')) * (burstT > 0 ? 10 : 1);
            let worldH = worldHeight(0);
            let evilOn = false;                          // the Evil toggle (not saved: it always starts off)
            let burstT = 0, burstCD = 0, ghostT = 0;      // temporary goo upgrades (ms remaining)
            let launchX = W / 2;                         // the cannon sweeps left and right along the ceiling

            // the launcher stays near the top; the bucket is anchored to the floor, because the world grows downward
            const rimY = () => worldH - 36;
            const catchY = () => worldH - 30;

            /* =====================================================================
               HELPERS
               ===================================================================== */
            const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
            function fmt(n) {
                if (!isFinite(n)) return '∞';
                if (n < 1000) return (n >= 100 || Math.abs(n - Math.round(n)) < 0.05) ? String(Math.round(n)) : n.toFixed(1);
                const e = Math.floor(Math.log10(n) / 3);
                if (e >= SUF.length) return n.toExponential(2);
                const v = n / Math.pow(1000, e);
                return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[e];
            }
            // research (RP) upgrades get an extra price multiplier: x2 at level 0, rising smoothly to x10 from level 10 on
            const researchMult = l => 2 * Math.pow(5, Math.min(1, l / 10));
            const cost = (u, l = L(u.id)) => u.fixed ? u.base : Math.ceil(u.base * Math.pow(u.growth, l) * (u.cur === 'rp' ? researchMult(l) : 1));
            const isUnlocked = u => state.total >= u.unlock || L(u.id) > 0;
            const maxOf = u => u.max > 0 && curOf(u) === 'money' ? u.max + L('cap') : u.max;   // money upgrades get +1 per Upgrade Limit level
            const isMaxed = u => { const m = maxOf(u); return m > 0 && L(u.id) >= m; };
            const isRp = u => u.cur === 'rp';
            const curOf = u => u.cur || 'money';
            const wallet = u => curOf(u) === 'rp' ? state.rp : curOf(u) === 'goo' ? state.goo : curOf(u) === 'evil' ? state.evil : state.money;
            const priceText = u => curOf(u) === 'rp' ? fmt(cost(u)) + ' RP' : curOf(u) === 'goo' ? fmt(cost(u)) + ' GOO' : curOf(u) === 'evil' ? fmt(cost(u)) + ' EVIL' : '$' + fmt(cost(u));
            const rand = (a, b) => a + Math.random() * (b - a);
            // evil comes in small amounts (0.01 per hit), so show two decimals until it gets big
            const evFmt = n => n < 100 ? n.toFixed(2) : fmt(n);

            /* =====================================================================
               PHYSICS
               ===================================================================== */
            const { Engine, Bodies, Body, Composite, Events } = Matter;
            const engine = Engine.create();
            engine.gravity.y = 1;
            engine.gravity.scale = GRAVITY_SCALE;
            const world = engine.world;

            (function buildWalls() {
                const o = { isStatic: true, restitution: 0.5, friction: 0, label: 'wall', collisionFilter: { category: 4, mask: 0xFFFFFFFF, group: 0 } };
                Composite.add(world, [
                    Bodies.rectangle(-30, 4000, 60, 10000, o),        // left
                    Bodies.rectangle(W + 30, 4000, 60, 10000, o),     // right
                    Bodies.rectangle(W / 2, -30, W + 200, 60, o),     // ceiling
                ]);
            })();

            const balls = [];
            let simT = 0;
            let recoil = 0;
            const bucketFlash = [0, 0, 0, 0, 0, 0, 0];
            let autoT = 0;
            let autoOn = true;                           // auto dropper switch (the LAUNCH button becomes this switch once Auto Dropper is bought)
            const pendingRemove = [], pendingSplit = [];
            const ballLoad = () => balls.reduce((a, b) => a + b.w, 0);   // half-size balls count 0.5

            function addPeg(x, y, type = 'basic', left = 0, dmg = 0) {
                const po = { isStatic: true, restitution: 0.5, friction: 0, label: 'peg' };
                const body = type === 'research' ? Bodies.polygon(x, y, 6, PEG_R + 1, po) : Bodies.circle(x, y, PEG_R, po);
                const peg = { x, y, type, body, flash: 0, color: PEG_TYPES[type].color, gooT: 0, left, dead: false, dmg, gone: false, evilKill: false };
                body.peg = peg;
                Composite.add(world, body);
                state.pegs.push(peg);
                return peg;
            }
            function removePeg(peg) {
                const i = state.pegs.indexOf(peg);
                if (i < 0) return;
                Composite.remove(world, peg.body);
                state.pegs.splice(i, 1);
            }

            /* ---------- launching ----------
               The cannon hangs from the ceiling and sweeps left and right all the time. It fires straight down
               from wherever it is when the player presses LAUNCH. */
            function launch(auto) {
                if (ballLoad() + 1 > maxBalls()) {
                    if (!auto) toast(maxBalls() === 1 ? 'A ball is already in play' : 'All balls are in play');
                    return false;
                }
                const half = spreadDeg(L('spread')) * Math.PI / 180 / 2;
                const th = rand(-half, half);                 // 0 = straight down
                const r = ballRadius(L('fat'));
                const body = Bodies.circle(launchX, LAUNCH_Y, r, {
                    restitution: restitution(L('bounce')), friction: 0, frictionStatic: 0, frictionAir: 0, density: 0.002,
                    collisionFilter: { category: 2, mask: ghostT > 0 ? 4 : 5 },   // balls ignore each other; ghost balls only touch walls (4)
                    label: 'ball',
                });
                Body.setVelocity(body, { x: LAUNCH_SPEED * Math.sin(th), y: LAUNCH_SPEED * Math.cos(th) });
                const isGoo = Math.random() < gooChance(L('goo'));
                const isGold = !isGoo && L('goldball') > 0 && Math.random() < GOLD_CHANCE;   // a ball is never both
                const ball = {
                    body, r, hits: 0, age: 0, still: 0, tick: 0, trail: [], lastPeg: null, lastT: 0,
                    goo: isGoo, gold: isGold, gooHits: 0, expired: false, touch: new Set(), w: 1, split: false, glow: randGlow()
                };
                body.ball = ball;
                Composite.add(world, body);
                balls.push(ball);
                recoil = 1;
                refreshUI();
                return true;
            }

            /* ---------- scoring ---------- */
            const earnLog = [];
            const t0 = performance.now();
            function gain(v) {
                state.money += v; state.total += v;
                earnLog.push({ t: performance.now(), v });
            }

            const particles = [];
            const floaters = [];
            function burst(x, y, color, n) {
                for (let i = 0; i < n && particles.length < 250; i++) {
                    const a = rand(0, 6.283), s = rand(40, 130);
                    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 450, max: 450, color });
                }
            }

            const goldMul = b => b.gold ? goldMult(L('goldball')) : 1;

            function hitPeg(ball, peg) {
                if (peg.dead) return;
                if (ball.lastPeg === peg && simT - ball.lastT < 200) return;   // no farming one peg while resting on it
                ball.lastPeg = peg; ball.lastT = simT;
                peg.flash = 1;
                if (ball.goo && ++ball.gooHits >= GOOBALL_PEGS) ball.expired = true;   // gooballs burn out after enough pegs

                // evil: while the toggle is on, every hit damages the peg and yields evil (more evil the more damaged the peg is)
                if (evilOn) {
                    const ey = evilYield(L('evilyield'));
                    const ev = (EVIL_BASE + (1 - EVIL_BASE) * peg.dmg) * ey;
                    state.evil += ev;
                    peg.dmg += evilDmg(L('evilhard'));
                    if (ev >= 0.25 && floaters.length < 30) floaters.push({ x: peg.x - 10, y: peg.y - 22, text: '+' + evFmt(ev), life: 800, max: 800, color: EVIL_COL, big: false });
                    if (peg.dmg >= 1) {                      // too much damage: the peg breaks and must be placed again
                        peg.dmg = 1; peg.dead = true; peg.evilKill = true; pendingRemove.push(peg);
                        const ek = EVIL_KILL * ey;
                        state.evil += ek;
                        burst(peg.x, peg.y, EVIL_COL, 24);
                        floaters.push({ x: peg.x, y: peg.y - 34, text: '+' + evFmt(ek), life: 1100, max: 1100, color: EVIL_COL, big: true });
                    }
                }

                // goo: a gooball coats pegs; any other ball that hits a coated peg produces Phlegm Goo
                if (peg.type !== 'dual') {
                    if (ball.goo) peg.gooT = GOO_PEG_MS;
                    else if (peg.gooT > 0) {
                        state.goo += GOO_PER_HIT;
                        if (floaters.length < 30) floaters.push({ x: peg.x + 10, y: peg.y - 22, text: '+' + fmt(GOO_PER_HIT), life: 800, max: 800, color: GOO_COL, big: false });
                    }
                }

                if (peg.type === 'splitter' && ball.w === 1 && !ball.split) { ball.split = true; pendingSplit.push({ ball, peg }); }

                if (peg.type === 'dual') {
                    const v = DUAL_MULT * (1 + L('ball')) * (1 + 0.5 * L('power')) * (1 + 0.05 * L('combo') * ball.hits) * goldMul(ball);
                    ball.hits++;
                    gain(v);
                    state.rp += RP_PEG * DUAL_MULT;
                    burst(peg.x, peg.y, '#ffd23a', 10);
                    floaters.push({ x: peg.x, y: peg.y - 12, text: '+$' + fmt(v), life: 900, max: 900, color: '#ffd23a', big: true });
                    floaters.push({ x: peg.x, y: peg.y - 28, text: '+' + fmt(RP_PEG * DUAL_MULT) + ' RP', life: 900, max: 900, color: '#8a5bff', big: true });
                    if (--peg.left <= 0) { peg.dead = true; pendingRemove.push(peg); }
                    return;
                }

                if (peg.type === 'research') {
                    ball.hits++;
                    state.rp += RP_PEG;
                    burst(peg.x, peg.y, peg.color, 6);
                    if (floaters.length < 30) floaters.push({ x: peg.x, y: peg.y - 12, text: '+' + fmt(RP_PEG) + ' RP', life: 800, max: 800, color: peg.color, big: false });
                    return;
                }

                let v = (1 + L('ball')) * (1 + 0.5 * L('power')) * (1 + 0.05 * L('combo') * ball.hits) * goldMul(ball);
                ball.hits++;
                const gold = Math.random() < 0.04 * L('gold');
                if (gold) v *= 5;
                gain(v);

                const col = gold ? GOLD : peg.color;
                burst(peg.x, peg.y, col, gold ? 10 : 5);
                if (floaters.length < 30) {
                    floaters.push({ x: peg.x, y: peg.y - 12, text: '+' + fmt(v), life: 800, max: 800, color: col, big: gold });
                }
            }

            /* A full-size ball that hits a splitter peg becomes two half-size balls (deferred until the physics step is over). */
            function splitBall(ball, peg) {
                const i = balls.indexOf(ball);
                if (i < 0) return;
                const p = ball.body.position, v = ball.body.velocity, r = ball.r / 2;
                const base = Math.atan2(v.y, v.x), sp = Math.max(Math.hypot(v.x, v.y), 3);
                Composite.remove(world, ball.body);
                balls.splice(i, 1);
                for (const sg of [-1, 1]) {
                    const a = base + sg * 0.5;
                    const body = Bodies.circle(p.x, p.y, r, {
                        restitution: ball.body.restitution, friction: 0, frictionStatic: 0, frictionAir: 0, density: 0.002,
                        collisionFilter: { category: 2, mask: ghostT > 0 ? 4 : 5 }, label: 'ball',
                    });
                    Body.setVelocity(body, { x: sp * Math.cos(a), y: sp * Math.sin(a) });
                    const nb = {
                        body, r, hits: ball.hits, age: ball.age, still: 0, tick: 0, trail: [], lastPeg: peg, lastT: simT,
                        goo: ball.goo, gold: ball.gold, gooHits: ball.gooHits, expired: false, touch: new Set([peg]), w: 0.5, split: true, glow: ball.glow
                    };
                    body.ball = nb;
                    Composite.add(world, body);
                    balls.push(nb);
                }
                burst(peg.x, peg.y, peg.color, 8);
                refreshUI();
            }

            /* The bucket row is only drawn: catching is a position check in stepGame().
               With more buckets the same total width is split into equal buckets; the further from the middle, the lower the multiplier. */
            function bucketLayout() {
                const l = L('buckets'), n = bucketCount(l), w = bucketW(L('wide')) / n, pitch = w + BUCKET_GAP;
                const span = w * n + BUCKET_GAP * (n - 1), x0 = BUCKET_X - span / 2;
                const cm = (n - 1) / 2, mid = midMult(l), edge = edgeMult(l), out = [];
                const inner = n % 2 === 0 ? 0.5 : 0;                             // with an even count there is no single middle bucket
                for (let i = 0; i < n; i++) {
                    const d = Math.abs(i - cm);
                    const t = cm > inner ? (d - inner) / (cm - inner) : 0;         // 0 = innermost, 1 = outermost
                    out.push({ cx: x0 + w / 2 + pitch * i, w, t, mult: n === 1 ? 1 : Math.pow(mid, 1 - t) * Math.pow(edge, t) });
                }
                return out;
            }
            function bucketIndexAt(bs, x) {
                for (let i = 0; i < bs.length; i++) if (Math.abs(x - bs[i].cx) < bs[i].w / 2 - 2) return i;
                return -1;
            }

            function catchBall(ball, bk, idx) {
                const v = bucketValue(L('bucket')) * bk.mult * goldMul(ball);
                gain(v);
                bucketFlash[idx] = 1;
                burst(bk.cx, rimY() + 4, '#b6ff2e', 10);
                floaters.push({ x: bk.cx, y: rimY() - 8, text: '+$' + fmt(v), life: 900, max: 900, color: '#b6ff2e', big: true });
                Composite.remove(world, ball.body);
                balls.splice(balls.indexOf(ball), 1);
            }

            Events.on(engine, 'collisionStart', ev => {
                for (const p of ev.pairs) {
                    let b = p.bodyA, o = p.bodyB;
                    if (!b.ball) { b = p.bodyB; o = p.bodyA; }
                    if (b.ball && o.peg) hitPeg(b.ball, o.peg);
                }
            });

            function stepGame(dt) {
                simT += dt;
                state.rp += rpRate(L('research')) * dt / 1000;
                launchX = W / 2 + (W / 2 - SWEEP_MARGIN) * Math.sin(simT * Math.PI * 2 / SWEEP_MS);

                if (burstT > 0) { burstT -= dt; if (burstT <= 0) { burstT = 0; burstCD = BURST_CD; } }
                else if (burstCD > 0) burstCD = Math.max(0, burstCD - dt);
                if (ghostT > 0) { ghostT -= dt; if (ghostT <= 0) { ghostT = 0; for (const b of balls) b.body.collisionFilter.mask = 5; } }

                const al = L('auto');                          // auto dropper: keeps trying until a ball slot is free
                if (al > 0 && autoOn) {
                    autoT = Math.min(autoT + dt, autoInterval(al));
                    if (autoT >= autoInterval(al) && launch(true)) autoT = 0;
                }
                Engine.update(engine, dt);

                const bs = bucketLayout();
                for (let i = balls.length - 1; i >= 0; i--) {
                    const b = balls[i], p = b.body.position, v = b.body.velocity;
                    const sp = Math.hypot(v.x, v.y);
                    if (sp > MAX_SPEED) Body.setVelocity(b.body, { x: v.x / sp * MAX_SPEED, y: v.y / sp * MAX_SPEED });
                    b.age += dt;
                    b.still = sp < 0.15 ? b.still + dt : 0;
                    if (ghostT > 0) {          // ghost balls do not collide with pegs: detect the overlaps ourselves
                        for (const pg of state.pegs) {
                            const dx = p.x - pg.x, dy = p.y - pg.y, rr = b.r + PEG_R;
                            if (dx * dx + dy * dy < rr * rr) { if (!b.touch.has(pg)) { b.touch.add(pg); hitPeg(b, pg); } }
                            else b.touch.delete(pg);
                        }
                    }
                    if ((++b.tick & 1) === 0) { b.trail.push(p.x, p.y); if (b.trail.length > 14) b.trail.splice(0, 2); }

                    // the bucket is not a physics body: a falling ball whose centre passes the bucket mouth inside its width is caught
                    const bi = (v.y > 0 && b.age > 250 && p.y >= catchY()) ? bucketIndexAt(bs, p.x) : -1;
                    if (bi >= 0) {
                        catchBall(b, bs[bi], bi);
                    } else if (p.y > worldH + 40 || b.age > 25000 || b.still > 1500 || b.expired) {
                        if (b.expired) burst(p.x, p.y, GOO_COL, 12);
                        Composite.remove(world, b.body);
                        balls.splice(i, 1);
                    }
                }

                while (pendingSplit.length) { const sp = pendingSplit.pop(); splitBall(sp.ball, sp.peg); }
                while (pendingRemove.length) {
                    const pg = pendingRemove.pop();
                    if (pg.gone) continue;
                    pg.gone = true;
                    if (pg.evilKill && pg.type === 'dual' && pg.left > 0) state.dualReady.push(pg.left);   // a dual peg broken by evil comes back with its remaining hits
                    removePeg(pg);
                }
                for (let i = 0; i < bucketFlash.length; i++) bucketFlash[i] = Math.max(0, bucketFlash[i] - dt / 260);
                for (const pg of state.pegs) {
                    if (pg.flash > 0) pg.flash = Math.max(0, pg.flash - dt / 220);
                    if (pg.gooT > 0) pg.gooT = Math.max(0, pg.gooT - dt);
                    if (!evilOn && pg.dmg > 0) pg.dmg = Math.max(0, pg.dmg - evilRegen(L('evilregen')) * dt / 1000);   // pegs heal while evil is off
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const q = particles[i];
                    q.life -= dt; q.x += q.vx * dt / 1000; q.y += q.vy * dt / 1000; q.vy += 300 * dt / 1000;
                    if (q.life <= 0) particles.splice(i, 1);
                }
                for (let i = floaters.length - 1; i >= 0; i--) {
                    const f = floaters[i];
                    f.life -= dt; f.y -= 28 * dt / 1000;
                    if (f.life <= 0) floaters.splice(i, 1);
                }
            }

            /* =====================================================================
               CAMERA + CANVAS
               ===================================================================== */
            const app = document.getElementById('app');
            const cv = document.getElementById('game');
            const ctx = cv.getContext('2d');
            const hudEl = document.getElementById('hud');
            const barEl = document.getElementById('bar');
            let dpr = 1, scale = 1, cssW = 360, cssH = 640;
            let camY = 0, camVel = 0;
            let padTop = 70, padBot = 100;

            function measurePads() {
                padTop = hudEl.offsetHeight - 6;
                if (!app.classList.contains('ov')) padBot = barEl.offsetHeight;   // measured only while the bar is in its normal state
            }
            // If the world fits between the HUD and the button bar it is centred and cannot be dragged.
            function camRange() {
                const lo = -padTop / scale, hi = worldH + padBot / scale - cssH / scale;
                if (hi >= lo) return [lo, hi];
                const free = cssH - padTop - padBot;
                const c = -(padTop + (free - worldH * scale) / 2) / scale;
                return [c, c];
            }
            function clampCam() {
                const [lo, hi] = camRange();
                camY = Math.min(hi, Math.max(lo, camY));
            }

            function resize() {
                const r = cv.getBoundingClientRect();
                cssW = r.width; cssH = r.height;
                dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                cv.width = Math.round(cssW * dpr);
                cv.height = Math.round(cssH * dpr);
                scale = cssW / W;
                measurePads();
                clampCam();
            }
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 150));

            /* ---------- drag to scroll + tap ---------- */
            let drag = null;
            let hover = null;
            const toWorld = (cx, cy) => {
                const r = cv.getBoundingClientRect();
                return { x: (cx - r.left) / scale, y: (cy - r.top) / scale + camY };
            };

            cv.addEventListener('pointerdown', e => {
                cv.setPointerCapture(e.pointerId);
                drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, cam0: camY, lastY: e.clientY, lastT: performance.now(), moved: false };
                camVel = 0;
            });
            cv.addEventListener('pointermove', e => {
                if (e.pointerType === 'mouse') hover = toWorld(e.clientX, e.clientY);
                if (!drag || e.pointerId !== drag.id) return;
                const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
                if (!drag.moved && Math.hypot(dx, dy) > 8) drag.moved = true;
                if (!drag.moved) return;
                camY = drag.cam0 - dy / scale;
                clampCam();
                const now = performance.now(), dt = now - drag.lastT;
                if (dt > 0) {
                    const v = (drag.lastY - e.clientY) / scale / dt * 1000;
                    camVel = camVel * 0.5 + v * 0.5;
                }
                drag.lastY = e.clientY; drag.lastT = now;
            });
            function endDrag(e, cancelled) {
                if (!drag || e.pointerId !== drag.id) return;
                const d = drag; drag = null;
                if (cancelled) return;
                if (!d.moved) { camVel = 0; onTap(toWorld(e.clientX, e.clientY)); }
                else if (performance.now() - d.lastT > 90) camVel = 0;
            }
            cv.addEventListener('pointerup', e => endDrag(e, false));
            cv.addEventListener('pointercancel', e => endDrag(e, true));
            cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = null; });

            /* ---------- tap actions ---------- */
            let toastText = '', toastUntil = 0;
            const toast = (t, ms = 1600) => { toastText = t; toastUntil = performance.now() + ms; };

            // Pegs can go anywhere. The only thing done is keeping them inside the walls and the floor,
            // so a tap in the dimmed area outside the board lands on the nearest spot inside it.
            const placeSpot = (x, y) => ({
                x: Math.min(W - PEG_R, Math.max(PEG_R, x)),
                y: Math.min(worldH - PEG_R, Math.max(PEG_R, y)),
            });

            function onTap(w) {
                // 1) tap a peg: pick it back up
                for (const p of state.pegs) {
                    if (Math.hypot(w.x - p.x, w.y - p.y) < PEG_R + 8) {
                        if (p.type === 'dual') { toast('Dual pegs cannot be picked up'); return; }
                        removePeg(p);
                        toast('Peg picked up');
                        refreshUI();
                        return;
                    }
                }
                // 2) a peg is ready: place it right where you tapped
                if (ready() > 0) {
                    const s = placeSpot(w.x, w.y);
                    const t = nextType();
                    addPeg(s.x, s.y, t, t === 'dual' ? state.dualReady.pop() : 0);
                    refreshUI();
                    save();
                    return;
                }
                // 3) otherwise, tapping the launcher launches
                if (Math.hypot(w.x - launchX, w.y - LAUNCH_Y) < 40) { launch(); return; }
                toast(state.pegs.length ? 'No pegs ready. Buy more in Upgrades.' : 'Launch balls into the bucket, then buy a peg!');
            }

            /* =====================================================================
               RENDERING
               ===================================================================== */
            // damaged pegs blend from their own colour towards evil red (damage rounded to 0.1 steps so the glow sprites stay cached)
            const mixCache = {};
            function mixCol(a, b, t) {
                const k = a + b + t;
                if (mixCache[k]) return mixCache[k];
                const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
                const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
                return (mixCache[k] = '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1));
            }
            const pegCol = p => p.dmg > 0.02 ? mixCol(p.color, EVIL_COL, Math.round(p.dmg * 10) / 10) : p.color;

            const glowCache = {};
            function glowSprite(color) {
                if (glowCache[color]) return glowCache[color];
                const c = document.createElement('canvas'); c.width = c.height = 64;
                const g = c.getContext('2d');
                const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                gr.addColorStop(0, color + 'ff'); gr.addColorStop(0.35, color + '77'); gr.addColorStop(1, color + '00');
                g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
                return (glowCache[color] = c);
            }
            function drawGlow(color, x, y, size, alpha) {
                ctx.globalAlpha = alpha;
                ctx.drawImage(glowSprite(color), x - size / 2, y - size / 2, size, size);
                ctx.globalAlpha = 1;
            }
            const TAU = Math.PI * 2;
            function hexPath(x, y, r) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3, px = x + r * Math.cos(a), py = y + r * Math.sin(a);
                    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
                }
                ctx.closePath();
            }

            function render(dt) {
                recoil = Math.max(0, recoil - dt / 220);

                const k = dpr * scale;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, cv.width, cv.height);
                ctx.setTransform(k, 0, 0, k, 0, -camY * k);
                const viewTop = camY - 40, viewBot = camY + cssH / scale + 40;

                // grid, anchored to the top so it stays put when the world grows downward
                ctx.lineWidth = 1 / scale;
                ctx.strokeStyle = 'rgba(138,91,255,.10)';
                ctx.beginPath();
                for (let x = 40; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, worldH); }
                for (let y = 40; y < worldH; y += 40) {
                    if (y < viewTop || y > viewBot) continue;
                    ctx.moveTo(0, y); ctx.lineTo(W, y);
                }
                ctx.stroke();

                // depth markers every 200 below the ceiling
                ctx.font = '600 9px system-ui,sans-serif';
                ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(139,134,184,.55)';
                for (let y = 200; y < worldH; y += 200) {
                    if (y < viewTop || y > viewBot) continue;
                    ctx.strokeStyle = 'rgba(138,91,255,.22)';
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                    ctx.fillText(String(y), 6, y - 4);
                }

                // outside of the world: dimmed; walls, ceiling and drain line
                ctx.fillStyle = 'rgba(2,1,10,.65)';
                ctx.fillRect(-10, worldH, W + 20, 4000);
                ctx.fillRect(-10, -4000, W + 20, 4000);
                ctx.save();
                ctx.shadowColor = '#8a5bff'; ctx.shadowBlur = 14; ctx.strokeStyle = '#8a5bff'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, worldH); ctx.moveTo(W, 0); ctx.lineTo(W, worldH);
                ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.stroke();
                ctx.shadowColor = '#ff2bd6'; ctx.strokeStyle = '#ff2bd6';
                ctx.setLineDash([10, 8]);
                ctx.beginPath(); ctx.moveTo(0, worldH); ctx.lineTo(W, worldH); ctx.stroke();
                ctx.restore();
                ctx.setLineDash([]);

                drawBucket();

                // pegs: glow pass
                ctx.globalCompositeOperation = 'lighter';
                for (const p of state.pegs) {
                    if (p.y < viewTop || p.y > viewBot) continue;
                    const gg = p.gooT > 0;
                    drawGlow(gg ? GOO_COL : pegCol(p), p.x, p.y, 46 + 22 * p.flash, Math.min(1, (gg ? 0.7 : 0.35) + 0.65 * p.flash));
                }
                ctx.globalCompositeOperation = 'source-over';
                // pegs: body pass
                ctx.lineWidth = 2.5;
                for (const p of state.pegs) {
                    if (p.y < viewTop || p.y > viewBot) continue;
                    if (p.type === 'research') hexPath(p.x, p.y, PEG_R + 1); else { ctx.beginPath(); ctx.arc(p.x, p.y, PEG_R, 0, TAU); }
                    ctx.fillStyle = '#0b0825'; ctx.fill();
                    const goo = p.gooT > 0 && (p.gooT > 2000 || ((simT / 140) | 0) % 2 === 0);
                    if (goo) { ctx.fillStyle = 'rgba(107,255,31,.38)'; ctx.fill(); }
                    if (p.dmg > 0.02) { ctx.fillStyle = `rgba(255,30,50,${p.dmg * 0.5})`; ctx.fill(); }
                    ctx.strokeStyle = goo ? GOO_COL : pegCol(p); ctx.stroke();
                    if (p.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${p.flash * 0.85})`; ctx.fill(); }
                    if (p.type === 'dual') {
                        ctx.fillStyle = '#ffd23a'; ctx.font = '800 10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(String(p.left), p.x, p.y + 0.5); ctx.textBaseline = 'alphabetic';
                    }
                    if (p.type === 'splitter') {            // a vertical split line marks the splitter
                        ctx.beginPath(); ctx.moveTo(p.x, p.y - 5); ctx.lineTo(p.x, p.y + 5);
                        ctx.strokeStyle = goo ? GOO_COL : pegCol(p); ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 2.5;
                    }
                }

                // mouse placement ghost
                if (hover && ready() > 0 && !drag) {
                    const s = placeSpot(hover.x, hover.y);
                    if (nextType() === 'research') hexPath(s.x, s.y, PEG_R + 1); else { ctx.beginPath(); ctx.arc(s.x, s.y, PEG_R, 0, TAU); }
                    ctx.strokeStyle = 'rgba(255,255,255,.7)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                }

                // balls
                ctx.globalCompositeOperation = 'lighter';
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                for (const b of balls) {
                    const p = b.body.position;
                    if (p.y < viewTop || p.y > viewBot) continue;
                    const col = b.goo ? GOO_COL : b.gold ? GOLD : b.glow;
                    const t = b.trail;
                    if (t.length >= 4) {
                        ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = b.r * 1.1;
                        ctx.beginPath(); ctx.moveTo(t[0], t[1]);
                        for (let i = 2; i < t.length; i += 2) ctx.lineTo(t[i], t[i + 1]);
                        ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.globalAlpha = 1;
                    }
                    drawGlow(col, p.x, p.y, b.r * 5, 0.9);
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = ghostT > 0 ? 0.5 : 1;       // ghost balls are see-through
                for (const b of balls) {
                    const p = b.body.position;
                    if (p.y < viewTop || p.y > viewBot) continue;
                    ctx.fillStyle = b.goo ? GOO_COL : b.gold ? GOLD : '#fff';
                    ctx.beginPath(); ctx.arc(p.x, p.y, b.r * 0.78, 0, TAU); ctx.fill();
                }
                ctx.globalAlpha = 1;

                // particles
                ctx.globalCompositeOperation = 'lighter';
                for (const q of particles) {
                    if (q.y < viewTop || q.y > viewBot) continue;
                    drawGlow(q.color, q.x, q.y, 10, q.life / q.max);
                }
                ctx.globalCompositeOperation = 'source-over';

                // floating numbers
                ctx.textAlign = 'center';
                for (const f of floaters) {
                    if (f.y < viewTop || f.y > viewBot) continue;
                    ctx.globalAlpha = Math.min(1, f.life / f.max * 1.6);
                    ctx.font = (f.big ? '800 15px' : '700 11px') + ' system-ui,sans-serif';
                    ctx.fillStyle = f.color;
                    ctx.fillText(f.text, f.x, f.y);
                }
                ctx.globalAlpha = 1;

                drawLauncher();
            }

            function drawBucket() {
                const bs = bucketLayout(), n = bs.length, rim = rimY(), bot = worldH - 8, base = bucketValue(L('bucket'));
                for (let i = 0; i < n; i++) {
                    const b = bs[i], fl = bucketFlash[i];
                    const col = n === 1 ? '#b6ff2e' : b.t < 0.01 ? '#ffd23a' : b.t > 0.99 ? '#b6ff2e' : '#ff9d1a';
                    const sl = Math.min(8, b.w * 0.15);
                    const x0 = b.cx - b.w / 2, x1 = b.cx + b.w / 2;
                    ctx.save();
                    ctx.shadowColor = col; ctx.shadowBlur = 12 + 14 * fl;
                    ctx.beginPath(); ctx.moveTo(x0, rim); ctx.lineTo(x0 + sl, bot); ctx.lineTo(x1 - sl, bot); ctx.lineTo(x1, rim); ctx.closePath();
                    ctx.globalAlpha = 0.08 + 0.3 * fl; ctx.fillStyle = col; ctx.fill();
                    ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = n > 1 ? 2.5 : 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(x0, rim); ctx.lineTo(x0 + sl, bot); ctx.lineTo(x1 - sl, bot); ctx.lineTo(x1, rim); ctx.stroke();
                    ctx.restore();
                    ctx.textAlign = 'center'; ctx.font = `800 ${Math.max(8, Math.min(12, b.w / 3.6))}px system-ui,sans-serif`;
                    ctx.fillStyle = col;
                    ctx.fillText('$' + fmt(base * b.mult), b.cx, rim + 17);
                }
            }

            function drawLauncher() {
                const x = launchX, y = LAUNCH_Y;

                // faint aim line straight down, so players can time their shot
                ctx.save();
                ctx.strokeStyle = 'rgba(255,157,26,.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 7]);
                ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, worldH); ctx.stroke();
                ctx.restore();

                ctx.globalCompositeOperation = 'lighter';
                drawGlow('#ff9d1a', x, y - 6, 70, 0.45);
                ctx.globalCompositeOperation = 'source-over';

                // barrel, pointing down
                ctx.save();
                ctx.translate(x, 0);
                ctx.fillStyle = '#1a1038'; ctx.strokeStyle = '#ff9d1a'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.rect(-6.5, 10 - recoil * 7, 13, 24); ctx.fill(); ctx.stroke();
                ctx.restore();

                // carriage hanging from the ceiling
                ctx.fillStyle = '#120b2b'; ctx.strokeStyle = '#ff9d1a'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.rect(x - 15, 0, 30, 14); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, 7, 3.5, 0, TAU); ctx.fillStyle = '#ff9d1a'; ctx.fill();
            }

            /* =====================================================================
               UI
               ===================================================================== */
            const $ = id => document.getElementById(id);
            const tabsEl = $('tabs'), tabMoney = $('tabMoney'), tabRp = $('tabRp'), tabGoo = $('tabGoo'), ovRp = $('ovRp'), ovRpNum = $('ovRpNum');
            const ovGoo = $('ovGoo'), ovGooNum = $('ovGooNum'), gooBox = $('gooBox'), gooNum = $('gooNum');
            let curTab = 'money';
            const tabEvil = $('tabEvil'), ovEvil = $('ovEvil'), ovEvilNum = $('ovEvilNum'), evilBox = $('evilBox'), evilNum = $('evilNum'), evilBtn = $('evilBtn'), btnsEl = $('btns');
            const evilShow = () => evFmt(Math.floor(state.evil * 100) / 100);
            const rpShow = () => fmt(Math.floor(state.rp * 10) / 10);
            const gooShow = () => fmt(Math.floor(state.goo));
            const rpBox = $('rpBox'), rpNum = $('rpNum'), rpRateEl = $('rpRate');
            const moneyEl = $('money'), rateEl = $('rate'), ovMoney = $('ovMoney');
            const stBalls = $('stBalls'), stPegs = $('stPegs'), stReady = $('stReady'), hintEl = $('hint');
            const overlay = $('overlay'), upBtn = $('upBtn'), launchBtn = $('launchBtn'), listEl = $('list');

            const setText = (node, s) => { if (node._t !== s) { node._t = s; node.textContent = s; } };

            function buy(u) {
                if (!isUnlocked(u) || isMaxed(u)) return false;
                const c = cost(u);
                if (u.badge && u.badge()) return false;            // temporary upgrades can be busy (active / cooling down)
                if (wallet(u) < c) return false;
                if (isRp(u)) state.rp -= c; else if (curOf(u) === 'goo') state.goo -= c; else if (curOf(u) === 'evil') state.evil -= c; else state.money -= c;
                if (u.onBuy) u.onBuy(); else state.levels[u.id]++;
                if (u.id === 'depth') growWorld();
                refreshUI();
                return true;
            }

            // The world grows downward: the launcher and every peg stay where they are, the floor and bucket move down.
            function growWorld() {
                worldH = worldHeight(L('depth'));
                clampCam();
            }

            const cards = UPGRADES.map(u => {
                const el = document.createElement('div');
                el.className = 'card';
                el.style.setProperty('--c', RES_COL[curOf(u)]);   // white = money, purple = research, green = goo
                el.innerHTML =
                    '<div class="info"><div class="name"><span class="n"></span><span class="lvl"></span></div>' +
                    '<div class="desc"></div><div class="stat"></div></div>' +
                    '<button class="buy" type="button"><span class="bl"></span><span class="bc"></span></button>';
                const ref = {
                    u, el,
                    n: el.querySelector('.n'), lvl: el.querySelector('.lvl'),
                    desc: el.querySelector('.desc'), stat: el.querySelector('.stat'),
                    btn: el.querySelector('.buy'), bl: el.querySelector('.bl'), bc: el.querySelector('.bc'),
                };

                // tap to buy; hold to keep buying. (Buying on click, not pointerdown, so scrolling the list never buys.)
                let holdT = null, holdI = null, suppress = false;
                const clearHold = () => { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; };
                ref.btn.addEventListener('pointerdown', () => {
                    suppress = false; clearHold();
                    holdT = setTimeout(() => {
                        suppress = true;
                        if (!buy(u)) return;
                        holdI = setInterval(() => { if (!buy(u)) clearHold(); }, 90);
                    }, 450);
                });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => ref.btn.addEventListener(ev, clearHold));
                ref.btn.addEventListener('click', () => { if (suppress) { suppress = false; return; } buy(u); });
                ref.btn.addEventListener('contextmenu', e => e.preventDefault());

                listEl.appendChild(el);
                return ref;
            });

            tabMoney.addEventListener('click', () => { curTab = 'money'; listEl.scrollTop = 0; refreshUI(); });
            tabRp.addEventListener('click', () => { curTab = 'rp'; listEl.scrollTop = 0; refreshUI(); });
            tabGoo.addEventListener('click', () => { curTab = 'goo'; listEl.scrollTop = 0; refreshUI(); });
            tabEvil.addEventListener('click', () => { curTab = 'evil'; listEl.scrollTop = 0; refreshUI(); });

            const resetBtn = document.createElement('button');
