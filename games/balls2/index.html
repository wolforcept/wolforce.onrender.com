                },

                /* ---- goo tab: temporary upgrades, paid in Phlegm Goo, fixed price (growth 1) ---- */
                {
                    id: 'goocap', cur: 'goo', name: 'Goo Tank', color: '#6bff1f', costFn: l => gooCap(l), max: 0, unlock: 0,
                    desc: `Raises the most Phlegm Goo you can hold by ${GOO_CAP_STEP}. It always costs a full tank: as much goo as your current limit.`,
                    stat: l => `holds up to ${gooCap(l)} goo`
                },
                {
                    id: 'dual', cur: 'goo', temp: true, name: 'Blast Pegs', color: '#ffd23a', base: 100, growth: 1, max: 0, unlock: 0,
                    desc: `Adds a temporary blast peg to place. Every hit pays money AND research points at x${DUAL_MULT}. It disappears after ${DUAL_HITS} hits.`,
                    status: () => `${state.dualReady.length} ready`,
                    stat: () => `x${DUAL_MULT} money and RP, ${DUAL_HITS} hits`,
                    onBuy: () => { state.dualReady.push(DUAL_HITS); }
                },
                {
                    id: 'ghost', cur: 'goo', temp: true, name: 'Ghost Balls', color: '#19f5ff', base: 200, growth: 1, max: 0, unlock: 0,
                    desc: `For ${GHOST_MS / 1000} seconds every ball passes through pegs, but still hits them and earns the rewards. Then it needs ${GHOST_CD / 1000} seconds to recharge.`,
                    timer: () => tmr(ghostT, ghostCD),
                    stat: () => `non-solid balls for ${GHOST_MS / 1000}s`,
                    onBuy: () => { ghostT = GHOST_MS; for (const b of balls) b.body.collisionFilter.mask = 4; }
                },
                {
                    id: 'gravity', cur: 'goo', temp: true, name: 'Heavy Gravity', color: '#b6ff2e', base: 250, growth: 1, max: 0, unlock: 0,
                    desc: `For ${GRAV_MS / 1000} seconds gravity is ${GRAV_MULT}x stronger: balls fall much faster. Then it needs ${GRAV_CD / 1000} seconds to recharge.`,
                    timer: () => tmr(gravT, gravCD),
                    stat: () => `${GRAV_MULT}x gravity for ${GRAV_MS / 1000}s`,
                    onBuy: () => { gravT = GRAV_MS; }
                },
                {
                    id: 'dead', cur: 'goo', temp: true, name: 'Dead Balls', color: '#ffffff', base: 300, growth: 1, max: 0, unlock: 0,
                    desc: `For ${DEAD_MS / 1000} seconds balls lose almost all their bounce: pegs, walls and buckets just stop them. Then it needs ${DEAD_CD / 1000} seconds to recharge.`,
                    timer: () => tmr(deadT, deadCD),
                    stat: () => `almost no bounce for ${DEAD_MS / 1000}s`,
                    onBuy: () => { deadT = DEAD_MS; }
                },
                {
                    id: 'chaos', cur: 'goo', temp: true, name: 'Chaos Balls', color: '#ff2bd6', base: 333, growth: 1, max: 0, unlock: 0,
                    desc: `For ${CHAOS_MS / 1000} seconds balls ignore the laws of physics when they bounce: every impact sends them off in a strange, random direction and speed. Then it needs ${CHAOS_CD / 1000} seconds to recharge.`,
                    timer: () => tmr(chaosT, chaosCD),
                    stat: () => `random bounces for ${CHAOS_MS / 1000}s`,
                    onBuy: () => { chaosT = CHAOS_MS; }
                },
                {
                    id: 'burst', cur: 'goo', temp: true, name: 'Ball Burst', color: '#ff9d1a', base: 700, growth: 1, max: 0, unlock: 0,
                    desc: `For ${BURST_MS / 1000} seconds you can have 10x as many balls in play. Then it needs ${BURST_CD / 1000} seconds to recharge.`,
                    timer: () => tmr(burstT, burstCD),
                    stat: () => `x10 ball limit for ${BURST_MS / 1000}s`,
                    onBuy: () => { burstT = BURST_MS; }
                },

                /* ---- evil tab: paid in Evil (red star) ---- */
                {
                    id: 'evilhard', cur: 'evil', name: 'Sturdy Pegs', color: '#ff2a3d', base: 25, growth: 1.6, max: 0, unlock: 0,
                    desc: 'Pegs take less damage from each hit while Evil is on, so they last longer. Can be bought without end, but each level helps less and damage never drops below 10% of the original.',
                    stat: l => `${(evilDmg(l) * 100).toFixed(2)}% damage per hit (${Math.round(evilDmg(l) / EVIL_DMG * 100)}% of base)`
                },
                {
                    id: 'evilregen', cur: 'evil', name: 'Fast Healing', color: '#ff2a3d', base: 25, growth: 1.6, max: 10, unlock: 0,
                    desc: 'Damaged pegs heal faster while Evil is off.',
                    stat: l => `${(evilRegen(l) * 100).toFixed(1)}% healed per second`
                },
                {
                    id: 'evilyield', cur: 'evil', name: 'Dark Harvest', color: '#ff2a3d', base: 50, growth: 1.7, max: 10, unlock: 0,
                    desc: 'Every hit and every destroyed peg yields more Evil.',
                    stat: l => `x${evilYield(l).toFixed(2)} Evil`
                },
            ];

            /* =====================================================================
               STATE
               ===================================================================== */
            const state = { money: 0, total: 0, rp: 0, goo: 0, evil: 0, dualReady: [], levels: {}, pegs: [] };
            UPGRADES.forEach(u => state.levels[u.id] = 0);
            const L = id => state.levels[id] | 0;
            const placedOf = t => state.pegs.filter(p => p.type === t).length;
            const readyOf = t => Math.max(0, (t === 'research' ? L('rpeg') : t === 'splitter' ? L('splitpeg') : t === 'gravity' ? L('gravpeg') : L('peg')) - placedOf(t));
            const ready = () => readyOf('basic') + readyOf('research') + readyOf('splitter') + readyOf('gravity') + state.dualReady.length;
            const nextType = () => state.dualReady.length ? 'dual' : readyOf('research') > 0 ? 'research' : readyOf('splitter') > 0 ? 'splitter' : readyOf('gravity') > 0 ? 'gravity' : 'basic';   // dual first, then research, splitter, gravity
            const maxBalls = () => (1 + L('balls')) * (burstT > 0 ? 10 : 1);
            let worldH = worldHeight(0);
            let evilOn = false;                          // the Evil toggle (not saved: it always starts off)
            let deadT = 0, deadCD = 0, deadApplied = false, ghostCD = 0, gravCD = 0, chaosT = 0, chaosCD = 0;
            let burstT = 0, burstCD = 0, ghostT = 0, gravT = 0;   // temporary goo upgrades (ms remaining)
            let launchX = W / 2;                         // the cannon sweeps left and right along the ceiling
            let prevLaunchX = launchX;                   // launchX before the last physics step (for smooth drawing)
            let uiDirty = false;                         // refreshUI() runs on the next frame (never from inside a physics step)

            // the launcher stays near the top; the bucket is anchored to the floor, because the world grows downward
            const rimY = () => worldH - 36;
            const catchY = () => worldH - 30;

            /* =====================================================================
               HELPERS
               ===================================================================== */
            const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
            function fmt(n) {
                if (!isFinite(n)) return '∞';
                if (n < 1000) return (n >= 100 || Math.abs(n - Math.round(n)) < 0.05) ? String(Math.round(n)) : n.toFixed(1);
                const e = Math.floor(Math.log10(n) / 3);
                if (e >= SUF.length) return n.toExponential(2);
                const v = n / Math.pow(1000, e);
                return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[e];
            }
            // research (RP) upgrades get an extra price multiplier: x2 at level 0, rising smoothly to x10 from level 10 on
            const researchMult = l => 2 * Math.pow(5, Math.min(1, l / 10));
            const cost = (u, l = L(u.id)) => u.costFn ? u.costFn(l) : u.fixed ? u.base : Math.ceil(u.base * Math.pow(u.growth, l) * (u.cur === 'rp' ? researchMult(l) : 1));
            const isUnlocked = u => state.total >= u.unlock || L(u.id) > 0;
            const maxOf = u => u.max > 0 && curOf(u) === 'money' ? u.max + 5 * L('cap') : u.max;   // money upgrades get +1 per Upgrade Limit level
            const isMaxed = u => { const m = maxOf(u); return m > 0 && L(u.id) >= m; };
            const isRp = u => u.cur === 'rp';
            const curOf = u => u.cur || 'money';
            const wallet = u => curOf(u) === 'rp' ? state.rp : curOf(u) === 'goo' ? state.goo : curOf(u) === 'evil' ? state.evil : state.money;
            const priceText = u => curOf(u) === 'rp' ? fmt(cost(u)) + ' RP' : curOf(u) === 'goo' ? fmt(cost(u)) + ' GOO' : curOf(u) === 'evil' ? fmt(cost(u)) + ' EVIL' : '$' + fmt(cost(u));
            const rand = (a, b) => a + Math.random() * (b - a);
            // evil comes in small amounts (0.01 per hit), so show two decimals until it gets big
            const evFmt = n => n < 100 ? n.toFixed(2) : fmt(n);

            /* =====================================================================
               PHYSICS
               ===================================================================== */
            const { Engine, Bodies, Body, Composite, Events } = Matter;
            const engine = Engine.create();
            engine.gravity.y = 1;
            engine.gravity.scale = GRAVITY_SCALE;
            const world = engine.world;

            const wallBodies = [];
            (function buildWalls() {
                const o = { isStatic: true, restitution: 0.5, friction: 0, label: 'wall', collisionFilter: { category: 4, mask: 0xFFFFFFFF, group: 0 } };
                wallBodies.push(
                    Bodies.rectangle(-30, 500000, 60, 1000000, o),    // left (very tall: the board has no maximum height)
                    Bodies.rectangle(W + 30, 500000, 60, 1000000, o), // right
                    Bodies.rectangle(W / 2, -30, W + 200, 60, o),     // ceiling
                );
                Composite.add(world, wallBodies);
            })();
            // Dead Balls: Matter uses the higher restitution of the two bodies, so pegs and walls have to go dead as well
            function setDead(on) {
                const r = on ? DEAD_REST : 0.5;
                for (const w of wallBodies) w.restitution = r;
                for (const p of state.pegs) p.body.restitution = r;
                for (const b of balls) b.body.restitution = on ? DEAD_REST : restitution(L('bounce'));
            }

            const balls = [];
            let simT = 0;
            let recoil = 0;
            const bucketFlash = [0, 0, 0, 0, 0, 0, 0];
            let autoT = 0;
            let autoOn = true;                           // auto dropper switch (the LAUNCH button becomes this switch once Auto Dropper is bought)
            const pendingRemove = [], pendingSplit = [];
            const ballLoad = () => balls.reduce((a, b) => a + b.w, 0);   // half-size balls count 0.5

            function addPeg(x, y, type = 'basic', left = 0, dmg = 0) {
                const po = { isStatic: true, restitution: deadT > 0 ? DEAD_REST : 0.5, friction: 0, label: 'peg' };
                const r = pegRadius(y);
                const body = type === 'research' ? Bodies.polygon(x, y, 6, r + 1, po) : Bodies.circle(x, y, r, po);
                if (type === 'research') Body.rotate(body, Math.PI / 6);   // Matter's hexagon has a pointy top; hexPath() draws a flat top
                const peg = { x, y, r, type, body, flash: 0, color: PEG_TYPES[type].color, gooT: 0, left, dead: false, dmg, gone: false, evilKill: false };
                body.peg = peg;
                Composite.add(world, body);
                state.pegs.push(peg);
                pegGrid = null;
                return peg;
            }
            function removePeg(peg) {
                const i = state.pegs.indexOf(peg);
                if (i < 0) return;
                Composite.remove(world, peg.body);
                state.pegs.splice(i, 1);
                pegGrid = null;
            }

            /* Pegs never move, so they are kept in a grid of cells and a ball is only checked against the pegs in nearby cells. */
            const CELL = 32;
            let pegGrid = null;                          // Map: cell key -> pegs; null = rebuild on next use
            const cellKey = (cx, cy) => cy * 64 + cx + 8;
            function pegsNear(x0, y0, x1, y1, out) {
                if (!pegGrid) {
                    pegGrid = new Map();
                    for (const p of state.pegs) {
                        const k = cellKey(Math.floor(p.x / CELL), Math.floor(p.y / CELL));
                        const a = pegGrid.get(k);
                        if (a) a.push(p); else pegGrid.set(k, [p]);
                    }
                }
                out.length = 0;
                const m = PEG_R + 2;                     // a peg is filed under its centre, so widen the search by a peg radius
                const cx0 = Math.floor((x0 - m) / CELL), cx1 = Math.floor((x1 + m) / CELL);
                const cy0 = Math.floor((y0 - m) / CELL), cy1 = Math.floor((y1 + m) / CELL);
                for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
                    const a = pegGrid.get(cellKey(cx, cy));
                    if (a) for (const p of a) out.push(p);
                }
                return out;
            }

            // Matter's detector sweeps over every body on every step, which gets slow with hundreds of pegs.
            // Only balls ever collide (balls ignore each other, pegs and walls are static), so check just the balls against nearby pegs and the walls.
            if (Matter.Detector && Matter.Collision && Matter.Collision.collides) {
                const { Detector, Collision } = Matter;
                const near = [];
                Detector.collisions = function (detector) {
                    const out = [], pairs = detector.pairs;
                    const test = (A, B) => {
                        const a = A.bounds, b = B.bounds;
                        if (b.min.x > a.max.x || b.max.x < a.min.x || b.min.y > a.max.y || b.max.y < a.min.y) return;
                        if (!Detector.canCollide(A.collisionFilter, B.collisionFilter)) return;
                        const c = Collision.collides(A, B, pairs);
                        if (c) out.push(c);
                    };
                    for (const ball of balls) {
                        const A = ball.body, a = A.bounds;
                        for (const w of wallBodies) test(A, w);
                        for (const p of pegsNear(a.min.x, a.min.y, a.max.x, a.max.y, near)) test(A, p.body);
                    }
                    return out;
                };
            }

            /* ---------- launching ----------
               The cannon hangs from the ceiling and sweeps left and right all the time. It fires straight down
               from wherever it is when the player presses LAUNCH. */
            function launch(auto) {
                if (ballLoad() + 1 > maxBalls()) {
                    if (!auto) toast(maxBalls() === 1 ? 'A ball is already in play' : 'All balls are in play');
                    return false;
                }
                const half = spreadDeg(L('spread')) * Math.PI / 180 / 2;
                const th = rand(-half, half);                 // 0 = straight down
                const r = ballRadius(L('fat'));
                const body = Bodies.circle(launchX, LAUNCH_Y, r, {
                    restitution: deadT > 0 ? DEAD_REST : restitution(L('bounce')), friction: 0, frictionStatic: 0, frictionAir: 0, density: 0.002,
                    collisionFilter: { category: 2, mask: ghostT > 0 ? 4 : 5 },   // balls ignore each other; ghost balls only touch walls (4)
                    label: 'ball',
                });
                Body.setVelocity(body, { x: LAUNCH_SPEED * Math.sin(th), y: LAUNCH_SPEED * Math.cos(th) });
                const isGoo = Math.random() < gooChance(L('goo'));
                const isGold = !isGoo && L('goldball') > 0 && Math.random() < GOLD_CHANCE;   // a ball is never both
                const ball = {
                    body, r, px: launchX, py: LAUNCH_Y, hits: 0, age: 0, still: 0, tick: 0, trail: [], lastPeg: null, lastT: 0,
                    goo: isGoo, gold: isGold, gooHits: 0, expired: false, touch: new Set(), w: 1, split: false, glow: randGlow()
                };
                body.ball = ball;
                Composite.add(world, body);
                balls.push(ball);
                recoil = 1;
                uiDirty = true;
                return true;
            }

            /* ---------- scoring ---------- */
            function gain(v) {
                state.money += v; state.total += v;
            }

            const particles = [];
            const floaters = [];
            function burst(x, y, color, n) {
                for (let i = 0; i < n && particles.length < 250; i++) {
                    const a = rand(0, 6.283), s = rand(40, 130);
                    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 450, max: 450, color });
                }
            }

            const goldMul = b => b.gold ? goldMult(L('goldball')) : 1;

            function hitPeg(ball, peg) {
                if (peg.dead) return;
                if (ball.lastPeg === peg && simT - ball.lastT < 200) return;   // no farming one peg while resting on it
                ball.lastPeg = peg; ball.lastT = simT;
                peg.flash = 1;
                if (ball.goo && ++ball.gooHits >= GOOBALL_PEGS) ball.expired = true;   // gooballs burn out after enough pegs

                // evil: while the toggle is on, every hit damages the peg and yields evil (more evil the more damaged the peg is)
                if (evilOn) {
                    const ey = evilYield(L('evilyield'));
                    const ev = (EVIL_BASE + (1 - EVIL_BASE) * peg.dmg) * ey;
                    state.evil += ev;
                    peg.dmg += evilDmg(L('evilhard'));
                    if (ev >= 0.25 && floaters.length < 30) floaters.push({ x: peg.x - 10, y: peg.y - 22, text: '+' + evFmt(ev), life: 800, max: 800, color: EVIL_COL, big: false });
                    if (peg.dmg >= 1) {                      // too much damage: the peg breaks and must be placed again
                        peg.dmg = 1; peg.dead = true; peg.evilKill = true; pendingRemove.push(peg);
                        const ek = EVIL_KILL * ey;
                        state.evil += ek;
                        burst(peg.x, peg.y, EVIL_COL, 24);
                        floaters.push({ x: peg.x, y: peg.y - 34, text: '+' + evFmt(ek), life: 1100, max: 1100, color: EVIL_COL, big: true });
                    }
                }

                // goo: a gooball coats pegs; any other ball that hits a coated peg produces Phlegm Goo
                if (peg.type !== 'dual') {
                    if (ball.goo) peg.gooT = GOO_PEG_MS;
                    else if (peg.gooT > 0) {
                        state.goo = Math.min(gooCap(), state.goo + GOO_PER_HIT);
                        if (floaters.length < 30) floaters.push({ x: peg.x + 10, y: peg.y - 22, text: '+' + fmt(GOO_PER_HIT), life: 800, max: 800, color: GOO_COL, big: false });
                    }
                }

                if (peg.type === 'splitter' && ball.w === 1 && !ball.split) { ball.split = true; pendingSplit.push({ ball, peg }); }

                if (peg.type === 'dual') {
                    const v = DUAL_MULT * (1 + L('ball')) * (1 + 0.5 * L('power')) * (1 + 0.05 * L('combo') * ball.hits) * goldMul(ball);
                    ball.hits++;
                    gain(v);
                    state.rp += RP_PEG * DUAL_MULT;
                    burst(peg.x, peg.y, '#ffd23a', 10);
                    floaters.push({ x: peg.x, y: peg.y - 12, text: '+$' + fmt(v), life: 900, max: 900, color: '#ffd23a', big: true });
                    floaters.push({ x: peg.x, y: peg.y - 28, text: '+' + fmt(RP_PEG * DUAL_MULT) + ' RP', life: 900, max: 900, color: '#8a5bff', big: true });
                    if (--peg.left <= 0) { peg.dead = true; pendingRemove.push(peg); }
                    return;
                }

                if (peg.type === 'research') {
                    ball.hits++;
                    state.rp += RP_PEG;
                    burst(peg.x, peg.y, peg.color, 6);
                    if (floaters.length < 30) floaters.push({ x: peg.x, y: peg.y - 12, text: '+' + fmt(RP_PEG) + ' RP', life: 800, max: 800, color: peg.color, big: false });
                    return;
                }

                let v = (1 + L('ball')) * (1 + 0.5 * L('power')) * (1 + 0.05 * L('combo') * ball.hits) * goldMul(ball);
                ball.hits++;
                const gold = Math.random() < 0.04 * L('gold');
                if (gold) v *= 5;
                gain(v);

                const col = gold ? GOLD : peg.color;
                burst(peg.x, peg.y, col, gold ? 10 : 5);
                if (floaters.length < 30) {
                    floaters.push({ x: peg.x, y: peg.y - 12, text: '+' + fmt(v), life: 800, max: 800, color: col, big: gold });
                }
            }

            /* A full-size ball that hits a splitter peg becomes two half-size balls (deferred until the physics step is over). */
            function splitBall(ball, peg) {
                const i = balls.indexOf(ball);
                if (i < 0) return;
                const p = ball.body.position, v = ball.body.velocity, r = ball.r / 2;
                const base = Math.atan2(v.y, v.x), sp = Math.max(Math.hypot(v.x, v.y), 3);
                Composite.remove(world, ball.body);
                balls.splice(i, 1);
                for (const sg of [-1, 1]) {
                    const a = base + sg * 0.5;
                    const body = Bodies.circle(p.x, p.y, r, {
                        restitution: ball.body.restitution, friction: 0, frictionStatic: 0, frictionAir: 0, density: 0.002,
                        collisionFilter: { category: 2, mask: ghostT > 0 ? 4 : 5 }, label: 'ball',
                    });
                    Body.setVelocity(body, { x: sp * Math.cos(a), y: sp * Math.sin(a) });
                    const nb = {
                        body, r, px: p.x, py: p.y, hits: ball.hits, age: ball.age, still: 0, tick: 0, trail: [], lastPeg: peg, lastT: simT,
                        goo: ball.goo, gold: ball.gold, gooHits: ball.gooHits, expired: false, touch: new Set([peg]), w: 0.5, split: true, glow: ball.glow
                    };
                    body.ball = nb;
                    Composite.add(world, body);
                    balls.push(nb);
                }
                burst(peg.x, peg.y, peg.color, 8);
                uiDirty = true;
            }

            /* The bucket row is only drawn: catching is a position check in stepGame().
               With more buckets the same total width is split into equal buckets; the further from the middle, the lower the multiplier. */
            let bucketKey = '', bucketCache = null;
            function bucketLayout() {
                const key = L('buckets') + ',' + L('wide');
                if (key !== bucketKey) { bucketKey = key; bucketCache = buildBuckets(); }
                return bucketCache;
            }
            function buildBuckets() {
                const l = L('buckets'), n = bucketCount(l), w = bucketW(L('wide')) / n, pitch = w + BUCKET_GAP;
                const span = w * n + BUCKET_GAP * (n - 1), x0 = BUCKET_X - span / 2;
                const cm = (n - 1) / 2, mid = midMult(l), edge = edgeMult(l), out = [];
                const inner = n % 2 === 0 ? 0.5 : 0;                             // with an even count there is no single middle bucket
                for (let i = 0; i < n; i++) {
                    const d = Math.abs(i - cm);
                    const t = cm > inner ? (d - inner) / (cm - inner) : 0;         // 0 = innermost, 1 = outermost
                    out.push({ cx: x0 + w / 2 + pitch * i, w, t, mult: n === 1 ? 1 : Math.pow(mid, 1 - t) * Math.pow(edge, t) });
                }
                return out;
            }
            function bucketIndexAt(bs, x) {
                for (let i = 0; i < bs.length; i++) if (Math.abs(x - bs[i].cx) < bs[i].w / 2 - 2) return i;
                return -1;
            }

            function catchBall(ball, bk, idx) {
                const v = bucketValue(L('bucket')) * bk.mult * goldMul(ball);
                gain(v);
                bucketFlash[idx] = 1;
                burst(bk.cx, rimY() + 4, '#b6ff2e', 10);
                floaters.push({ x: bk.cx, y: rimY() - 8, text: '+$' + fmt(v), life: 900, max: 900, color: '#b6ff2e', big: true });
                Composite.remove(world, ball.body);
                balls.splice(balls.indexOf(ball), 1);
            }

            Events.on(engine, 'collisionStart', ev => {
                for (const p of ev.pairs) {
                    let b = p.bodyA, o = p.bodyB;
                    if (!b.ball) { b = p.bodyB; o = p.bodyA; }
                    if (b.ball && chaosT > 0) b.ball.chaos = true;      // randomised right after this physics step
                    if (b.ball && o.peg) hitPeg(b.ball, o.peg);
                }
            });

            // Gravity pegs: every ball within reach is pulled gently towards the peg's centre; the closer the ball, the stronger the pull.
            function applyGravityPegs() {
                for (const pg of state.pegs) {
                    if (pg.type !== 'gravity' || pg.dead) continue;
                    for (const b of balls) {
                        const p = b.body.position;
                        const dx = pg.x - p.x, dy = pg.y - p.y, d = Math.hypot(dx, dy);
                        if (d >= GRAVPEG_R || d < 1) continue;
                        const f = GRAVPEG_PULL * (1 - d / GRAVPEG_R);
                        const v = b.body.velocity;
                        Body.setVelocity(b.body, { x: v.x + dx / d * f, y: v.y + dy / d * f });
                    }
                }
            }

            function stepGame(dt) {
                simT += dt;
                state.rp += rpRate(L('research')) * dt / 1000;
                prevLaunchX = launchX;
                launchX = W / 2 + (W / 2 - SWEEP_MARGIN) * Math.sin(simT * Math.PI * 2 / SWEEP_MS);

                if (burstT > 0) { burstT -= dt; if (burstT <= 0) { burstT = 0; burstCD = BURST_CD; } }
                else if (burstCD > 0) burstCD = Math.max(0, burstCD - dt);
                if (deadT > 0) { deadT -= dt; if (deadT <= 0) { deadT = 0; deadCD = DEAD_CD; } }
                else if (deadCD > 0) deadCD = Math.max(0, deadCD - dt);
                if ((deadT > 0) !== deadApplied) { deadApplied = deadT > 0; setDead(deadApplied); }
                if (chaosT > 0) { chaosT -= dt; if (chaosT <= 0) { chaosT = 0; chaosCD = CHAOS_CD; } }
                else if (chaosCD > 0) chaosCD = Math.max(0, chaosCD - dt);
                if (gravT > 0) { gravT -= dt; if (gravT <= 0) { gravT = 0; gravCD = GRAV_CD; } }
                else if (gravCD > 0) gravCD = Math.max(0, gravCD - dt);
                engine.gravity.scale = GRAVITY_SCALE * (gravT > 0 ? GRAV_MULT : 1);
                if (ghostT > 0) { ghostT -= dt; if (ghostT <= 0) { ghostT = 0; ghostCD = GHOST_CD; for (const b of balls) b.body.collisionFilter.mask = 5; } }
                else if (ghostCD > 0) ghostCD = Math.max(0, ghostCD - dt);

                const al = L('auto');                          // auto dropper: keeps trying until a ball slot is free
                if (al > 0 && autoOn) {
                    autoT = Math.min(autoT + dt, autoInterval(al));
                    if (autoT >= autoInterval(al) && launch(true)) autoT = 0;
                }
                for (const b of balls) { b.px = b.body.position.x; b.py = b.body.position.y; }
                applyGravityPegs();
                Engine.update(engine, dt);

                // Chaos Balls: whatever the physics just decided, throw the ball in a random direction at a random speed
                for (const b of balls) {
                    if (!b.chaos) continue;
                    b.chaos = false;
                    if (chaosT <= 0) continue;
                    const v = b.body.velocity, sp = Math.hypot(v.x, v.y);
                    const s = Math.min(MAX_SPEED, Math.max(2.5, sp * rand(0.7, 1.4)));
                    const a = rand(0, 6.2832);
                    Body.setVelocity(b.body, { x: s * Math.cos(a), y: s * Math.sin(a) });
                    burst(b.body.position.x, b.body.position.y, '#ff2bd6', 3);
                }

                const bs = bucketLayout(), ghostNear = [];
                for (let i = balls.length - 1; i >= 0; i--) {
                    const b = balls[i], p = b.body.position, v = b.body.velocity;
                    const sp = Math.hypot(v.x, v.y);
                    if (sp > MAX_SPEED) Body.setVelocity(b.body, { x: v.x / sp * MAX_SPEED, y: v.y / sp * MAX_SPEED });
                    b.age += dt;
                    b.still = sp < 0.15 ? b.still + dt : 0;
                    if (ghostT > 0) {          // ghost balls do not collide with pegs: detect the overlaps ourselves
                        for (const pg of b.touch) {
                            const dx = p.x - pg.x, dy = p.y - pg.y, rr = b.r + pg.r;
                            if (dx * dx + dy * dy >= rr * rr) b.touch.delete(pg);
                        }
                        for (const pg of pegsNear(p.x - b.r, p.y - b.r, p.x + b.r, p.y + b.r, ghostNear)) {
                            const dx = p.x - pg.x, dy = p.y - pg.y, rr = b.r + pg.r;
                            if (dx * dx + dy * dy < rr * rr && !b.touch.has(pg)) { b.touch.add(pg); hitPeg(b, pg); }
                        }
                    }
                    if ((++b.tick & 1) === 0) { b.trail.push(p.x, p.y); if (b.trail.length > 14) b.trail.splice(0, 2); }

                    // the bucket is not a physics body: a falling ball whose centre passes the bucket mouth inside its width is caught
                    const bi = (v.y > 0 && b.age > 250 && p.y >= catchY()) ? bucketIndexAt(bs, p.x) : -1;
                    if (bi >= 0) {
                        catchBall(b, bs[bi], bi);
                    } else if (p.y > worldH + 40 || b.age > 25000 || b.still > 1500 || b.expired) {
                        if (b.expired) burst(p.x, p.y, GOO_COL, 12);
                        Composite.remove(world, b.body);
                        balls.splice(i, 1);
                    }
                }

                while (pendingSplit.length) { const sp = pendingSplit.pop(); splitBall(sp.ball, sp.peg); }
                while (pendingRemove.length) {
                    const pg = pendingRemove.pop();
                    if (pg.gone) continue;
                    pg.gone = true;
                    if (pg.evilKill && pg.type === 'dual' && pg.left > 0) state.dualReady.push(pg.left);   // a dual peg broken by evil comes back with its remaining hits
                    removePeg(pg);
                }
                for (let i = 0; i < bucketFlash.length; i++) bucketFlash[i] = Math.max(0, bucketFlash[i] - dt / 260);
                for (const pg of state.pegs) {
                    if (pg.flash > 0) pg.flash = Math.max(0, pg.flash - dt / 220);
                    if (pg.gooT > 0) pg.gooT = Math.max(0, pg.gooT - dt);
                    if (!evilOn && pg.dmg > 0) pg.dmg = Math.max(0, pg.dmg - evilRegen(L('evilregen')) * dt / 1000);   // pegs heal while evil is off
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const q = particles[i];
                    q.life -= dt; q.x += q.vx * dt / 1000; q.y += q.vy * dt / 1000; q.vy += 300 * dt / 1000;
                    if (q.life <= 0) particles.splice(i, 1);
                }
                for (let i = floaters.length - 1; i >= 0; i--) {
                    const f = floaters[i];
                    f.life -= dt; f.y -= 28 * dt / 1000;
                    if (f.life <= 0) floaters.splice(i, 1);
                }
            }

            /* =====================================================================
               CAMERA + CANVAS
               ===================================================================== */
            const app = document.getElementById('app');
            const cv = document.getElementById('game');
            const ctx = cv.getContext('2d');
            const hudEl = document.getElementById('hud');
            const barEl = document.getElementById('bar');
            let dpr = 1, scale = 1, cssW = 360, cssH = 640;
            let camY = 0, camVel = 0;
            let padTop = 70, padBot = 100;

            let hudH = -1;
            function measurePads() {
                const h = hudEl.offsetHeight;
                if (h !== hudH) { hudH = h; app.style.setProperty('--hudH', h + 'px'); }   // the shop starts right below the HUD
                padTop = h - 6;
                if (!app.classList.contains('ov')) padBot = barEl.offsetHeight;   // measured only while the bar is in its normal state
            }
            // If the world fits between the HUD and the button bar it is centred and cannot be dragged.
            function camRange() {
                const lo = -padTop / scale, hi = worldH + padBot / scale - cssH / scale;
                if (hi >= lo) return [lo, hi];
                const free = cssH - padTop - padBot;
                const c = -(padTop + (free - worldH * scale) / 2) / scale;
                return [c, c];
            }
            function clampCam() {
                const [lo, hi] = camRange();
                camY = Math.min(hi, Math.max(lo, camY));
            }

            // quality tiers: the max canvas pixel ratio. A phone that keeps dropping frames steps down one tier at a time.
            const DPR_TIERS = [2, 1.5, 1.25, 1];
            let qTier = navigator.deviceMemory && navigator.deviceMemory <= 4 ? 1 : 0;   // low-memory phones (Chrome reports this) start one tier down
            function resize() {
                const r = cv.getBoundingClientRect();
                cssW = r.width; cssH = r.height;
                dpr = Math.min(window.devicePixelRatio || 1, DPR_TIERS[qTier]);
                cv.width = Math.round(cssW * dpr);
                cv.height = Math.round(cssH * dpr);
                scale = cssW / W;
                for (const key in pegSprites) delete pegSprites[key];   // sprites are drawn at device pixels
                measurePads();
                clampCam();
            }
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 150));
            // reading offsetHeight every frame forces a layout; only re-measure when the HUD or button bar actually change size
            const padObserver = window.ResizeObserver ? new ResizeObserver(() => { measurePads(); clampCam(); }) : null;
            if (padObserver) { padObserver.observe(hudEl); padObserver.observe(barEl); }

            /* ---------- drag to scroll + tap ---------- */
            let drag = null;
            let hover = null;
            const toWorld = (cx, cy) => {
                const r = cv.getBoundingClientRect();
                return { x: (cx - r.left) / scale, y: (cy - r.top) / scale + camY };
            };

            cv.addEventListener('pointerdown', e => {
                cv.setPointerCapture(e.pointerId);
                drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, cam0: camY, lastY: e.clientY, lastT: performance.now(), moved: false };
                camVel = 0;
            });
            cv.addEventListener('pointermove', e => {
                if (e.pointerType === 'mouse') hover = toWorld(e.clientX, e.clientY);
                if (!drag || e.pointerId !== drag.id) return;
                const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
                if (!drag.moved && Math.hypot(dx, dy) > 8) drag.moved = true;
                if (!drag.moved) return;
                camY = drag.cam0 - dy / scale;
                clampCam();
                const now = performance.now(), dt = now - drag.lastT;
                if (dt > 0) {
                    const v = (drag.lastY - e.clientY) / scale / dt * 1000;
                    camVel = camVel * 0.5 + v * 0.5;
                }
                drag.lastY = e.clientY; drag.lastT = now;
            });
            function endDrag(e, cancelled) {
                if (!drag || e.pointerId !== drag.id) return;
                const d = drag; drag = null;
                if (cancelled) return;
                if (!d.moved) { camVel = 0; onTap(toWorld(e.clientX, e.clientY)); }
                else if (performance.now() - d.lastT > 90) camVel = 0;
            }
            cv.addEventListener('pointerup', e => endDrag(e, false));
            cv.addEventListener('pointercancel', e => endDrag(e, true));
            cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = null; });

            /* ---------- tap actions ---------- */
            let toastText = '', toastUntil = 0;
            const toast = (t, ms = 1600) => { toastText = t; toastUntil = performance.now() + ms; };

            // Pegs can go anywhere. The only thing done is keeping them inside the walls and the floor,
            // so a tap in the dimmed area outside the board lands on the nearest spot inside it.
            const placeSpot = (x, y) => ({
                x: Math.min(W - PEG_R, Math.max(PEG_R, x)),
                y: Math.min(worldH - PEG_R, Math.max(PEG_R, y)),
            });

            function onTap(w) {
                // 1) tap a peg: pick it back up
                for (const p of state.pegs) {
                    if (Math.hypot(w.x - p.x, w.y - p.y) < p.r + 8) {
                        if (p.type === 'dual') { toast('Blast pegs cannot be picked up'); return; }
                        removePeg(p);
                        toast('Peg picked up');
                        refreshUI();
                        return;
                    }
                }
                // 2) a peg is ready: place it right where you tapped
                if (ready() > 0) {
                    const s = placeSpot(w.x, w.y);
                    const t = nextType();
                    addPeg(s.x, s.y, t, t === 'dual' ? state.dualReady.pop() : 0);
                    refreshUI();
                    save();
                    return;
                }
                // 3) otherwise, tapping the launcher launches
                if (Math.hypot(w.x - launchX, w.y - LAUNCH_Y) < 40) { launch(); return; }
                toast(state.pegs.length ? 'No pegs ready. Buy more in the Shop.' : 'Launch balls into the bucket, then buy a peg!');
            }

            /* =====================================================================
               RENDERING
               ===================================================================== */
            // damaged pegs blend from their own colour towards evil red (damage rounded to 0.1 steps so the glow sprites stay cached)
            const mixCache = {};
            function mixCol(a, b, t) {
                const k = a + b + t;
                if (mixCache[k]) return mixCache[k];
                const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
                const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
                return (mixCache[k] = '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1));
            }
            const pegCol = p => p.dmg > 0.02 ? mixCol(p.color, EVIL_COL, Math.round(p.dmg * 10) / 10) : p.color;

            const glowCache = {};
            function glowSprite(color) {
                if (glowCache[color]) return glowCache[color];
                const c = document.createElement('canvas'); c.width = c.height = 64;
                const g = c.getContext('2d');
                const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                gr.addColorStop(0, color + 'ff'); gr.addColorStop(0.35, color + '77'); gr.addColorStop(1, color + '00');
                g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
                return (glowCache[color] = c);
            }
            function drawGlow(color, x, y, size, alpha) {
                ctx.globalAlpha = alpha;
                ctx.drawImage(glowSprite(color), x - size / 2, y - size / 2, size, size);
                ctx.globalAlpha = 1;
            }
            const TAU = Math.PI * 2;
            const FONT_BIG = '800 15px system-ui,sans-serif', FONT_SMALL = '700 11px system-ui,sans-serif';
            function hexPath(x, y, r, g = ctx) {
                g.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3, px = x + r * Math.cos(a), py = y + r * Math.sin(a);
                    if (i) g.lineTo(px, py); else g.moveTo(px, py);
                }
                g.closePath();
            }

            // Each peg look (type, colour, damage, radius) is drawn once into a sprite at device pixels: glow, body, outline.
            // Drawing hundreds of cached images is far cheaper than hundreds of glows plus path fills and strokes every frame.
            const pegSprites = {};
            const PEG_GLOW = 12;                         // how far the resting glow reaches past the peg edge
            function pegSprite(p, col, k) {
                const r = Math.round(p.r * 4) / 4, dmg = p.dmg > 0.02 ? Math.round(p.dmg * 10) / 10 : 0;
                const key = p.type + col + dmg + ',' + r;
                let s = pegSprites[key];
                if (s) return s;
                const R = r + 1 + PEG_GLOW, size = Math.ceil(2 * R * k) + 2, c = size / 2 / k;
                s = document.createElement('canvas'); s.width = s.height = size;
                const g = s.getContext('2d');
                g.scale(k, k);
                const gr = g.createRadialGradient(c, c, 0, c, c, R);
                gr.addColorStop(0, col + '59'); gr.addColorStop(0.35, col + '29'); gr.addColorStop(1, col + '00');
                g.fillStyle = gr; g.fillRect(0, 0, 2 * c, 2 * c);
                if (p.type === 'research') hexPath(c, c, r + 1, g); else { g.beginPath(); g.arc(c, c, r, 0, TAU); }
                g.fillStyle = '#0b0825'; g.fill();
                if (dmg) { g.fillStyle = `rgba(255,30,50,${dmg * 0.5})`; g.fill(); }
                g.strokeStyle = col; g.lineWidth = 2.5; g.stroke();
                if (p.type === 'splitter') {             // a vertical split line marks the splitter
                    g.beginPath(); g.moveTo(c, c - 5); g.lineTo(c, c + 5);
                    g.lineWidth = 2; g.lineCap = 'round'; g.stroke();
                }
                if (p.type === 'gravity') {              // a small ring around a dot marks the gravity peg
                    g.beginPath(); g.arc(c, c, r * 0.5, 0, TAU);
                    g.lineWidth = 1.6; g.stroke();
                    g.beginPath(); g.arc(c, c, 1.6, 0, TAU);
                    g.fillStyle = col; g.fill();
                }
                return (pegSprites[key] = s);
            }

            // the old shadowBlur glow, faked with a wide faint stroke under the real one (shadowBlur is very slow on phones)
            function glowStroke(color, width, glowW, glowA) {
                ctx.strokeStyle = color;
                ctx.globalAlpha = glowA; ctx.lineWidth = glowW; ctx.stroke();
                ctx.globalAlpha = 1; ctx.lineWidth = width; ctx.stroke();
            }

            // a goo-covered peg wears a wavy green cap on its top side, like icing on a cake; it slowly slides off as the goo wears out
            function pegPath(p, grow = 0) {
                if (p.type === 'research') hexPath(p.x, p.y, p.r + 1 + grow); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r + grow, 0, TAU); }
            }
            function drawGooCap(p) {
                const R = p.r + 1.5, cover = Math.min(1, p.gooT / 2500);
                const edge = p.y - R * 1.25 + R * 1.45 * cover;              // full cover: the goo reaches just below the middle of the peg
                const wave = x => Math.sin(x * 0.62 + simT / 260 + p.x) * 1.6 + Math.sin(x * 1.5 - simT / 380 + p.y) * 0.9;
                ctx.save();
                pegPath(p, 1.3); ctx.clip();                                  // slightly larger than the peg so the cap also covers the outline
                ctx.beginPath();
                ctx.moveTo(p.x - R - 1, p.y - R - 3);
                ctx.lineTo(p.x + R + 1, p.y - R - 3);
                for (let dx = R + 1; dx >= -R - 1; dx -= 1) ctx.lineTo(p.x + dx, edge + wave(p.x + dx));
                ctx.closePath();
                ctx.fillStyle = 'rgba(107,255,31,.9)'; ctx.fill();
                ctx.strokeStyle = 'rgba(220,255,190,.75)'; ctx.lineWidth = 1.2; ctx.stroke();   // bright rim along the wavy edge
                ctx.fillStyle = 'rgba(255,255,255,.55)';                                        // little shine
                ctx.beginPath(); ctx.ellipse(p.x - R * 0.35, p.y - R * 0.55, 2.4, 1.3, -0.5, 0, TAU); ctx.fill();
                ctx.restore();
                pegPath(p);                                                  // leave the peg outline as the current path for the code that follows
            }

            // a: how far we are between the last two physics steps (0..1), so balls and the cannon move smoothly at any refresh rate
            function render(dt, a) {
                recoil = Math.max(0, recoil - dt / 220);

                const k = dpr * scale;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, cv.width, cv.height);
                ctx.setTransform(k, 0, 0, k, 0, -camY * k);
                const viewTop = camY - 40, viewBot = camY + cssH / scale + 40;
                const visTop = Math.max(0, viewTop), visBot = Math.min(worldH, viewBot);   // long lines are only drawn where visible

                // grid, anchored to the top so it stays put when the world grows downward
                ctx.lineWidth = 1 / scale;
                ctx.strokeStyle = 'rgba(138,91,255,.10)';
                ctx.beginPath();
                for (let x = 40; x < W; x += 40) { ctx.moveTo(x, visTop); ctx.lineTo(x, visBot); }
                for (let y = 40; y < worldH; y += 40) {
                    if (y < viewTop || y > viewBot) continue;
                    ctx.moveTo(0, y); ctx.lineTo(W, y);
                }
                ctx.stroke();

                // depth markers every 200 below the ceiling
                ctx.font = '600 9px system-ui,sans-serif';
                ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(139,134,184,.55)';
                for (let y = 200; y < worldH; y += 200) {
                    if (y < viewTop || y > viewBot) continue;
                    ctx.strokeStyle = 'rgba(138,91,255,.22)';
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                    ctx.fillText(String(y), 6, y - 4);
                }

                // outside of the world: dimmed; walls, ceiling and drain line
                ctx.fillStyle = 'rgba(2,1,10,.65)';
                ctx.fillRect(-10, worldH, W + 20, 4000);
                ctx.fillRect(-10, -4000, W + 20, 4000);
                ctx.lineCap = 'butt';
                ctx.beginPath(); ctx.moveTo(0, visTop); ctx.lineTo(0, visBot); ctx.moveTo(W, visTop); ctx.lineTo(W, visBot);
                if (viewTop < 0) { ctx.moveTo(0, 0); ctx.lineTo(W, 0); }
                glowStroke('#8a5bff', 2.5, 9, 0.22);
                if (viewBot > worldH) {
                    ctx.setLineDash([10, 8]);
                    ctx.beginPath(); ctx.moveTo(0, worldH); ctx.lineTo(W, worldH);
                    glowStroke('#ff2bd6', 2.5, 9, 0.22);
                    ctx.setLineDash([]);
                }

                drawBucket();

                // gravity pegs: a faint field showing how far their pull reaches (drawn under the pegs)
                ctx.globalCompositeOperation = 'lighter';
                for (const p of state.pegs) {
                    if (p.type !== 'gravity') continue;
                    if (p.y < viewTop - GRAVPEG_R || p.y > viewBot + GRAVPEG_R) continue;
                    drawGlow(p.color, p.x, p.y, GRAVPEG_R * 2, 0.16);
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.setLineDash([3, 6]);
                for (const p of state.pegs) {
                    if (p.type !== 'gravity') continue;
                    if (p.y < viewTop - GRAVPEG_R || p.y > viewBot + GRAVPEG_R) continue;
                    ctx.beginPath(); ctx.arc(p.x, p.y, GRAVPEG_R, 0, TAU);
                    ctx.strokeStyle = 'rgba(46,255,176,.22)'; ctx.lineWidth = 1; ctx.stroke();
                }
                ctx.setLineDash([]);

                // pegs: one cached sprite each (glow + body); the bigger flash glow is only drawn while a peg flashes
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                for (const p of state.pegs) {
                    if (p.y < viewTop || p.y > viewBot) continue;
                    const s = pegSprite(p, pegCol(p), k);
                    ctx.drawImage(s, Math.round(p.x * k - s.width / 2), Math.round((p.y - camY) * k - s.width / 2));   // whole device pixels: crisp
                }
                ctx.setTransform(k, 0, 0, k, 0, -camY * k);
                ctx.globalCompositeOperation = 'lighter';
                for (const p of state.pegs) {
                    if (p.y < viewTop || p.y > viewBot) continue;
                    if (p.flash > 0) drawGlow(pegCol(p), p.x, p.y, 46 + 22 * p.flash, 0.65 * p.flash);
                    if (p.gooT > 0) drawGlow(GOO_COL, p.x, p.y - 4, 30, 0.35);  // faint green glow from the cap only
                }
                ctx.globalCompositeOperation = 'source-over';
                for (const p of state.pegs) {
                    if (p.y < viewTop || p.y > viewBot) continue;
                    if (p.type === 'dual') {
                        ctx.fillStyle = '#ffd23a'; ctx.font = '800 10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(String(p.left), p.x, p.y + 0.5); ctx.textBaseline = 'alphabetic';
                    }
                    // the peg keeps its own colour; goo is only a green cap drawn on top of it (top side green, bottom side original)
                    if (p.gooT > 0) drawGooCap(p);          // covers the outline and everything else on the top side
                    if (p.flash > 0) { pegPath(p); ctx.fillStyle = `rgba(255,255,255,${p.flash * 0.85})`; ctx.fill(); }
                }

                // mouse placement ghost
                if (hover && ready() > 0 && !drag) {
                    const s = placeSpot(hover.x, hover.y);
                    const hr = pegRadius(s.y);
                    if (nextType() === 'research') hexPath(s.x, s.y, hr + 1); else { ctx.beginPath(); ctx.arc(s.x, s.y, hr, 0, TAU); }
                    ctx.strokeStyle = 'rgba(255,255,255,.7)';
                    ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    if (nextType() === 'gravity') {         // preview the reach of the gravity peg
                        ctx.beginPath(); ctx.arc(s.x, s.y, GRAVPEG_R, 0, TAU);
                        ctx.strokeStyle = 'rgba(46,255,176,.35)'; ctx.lineWidth = 1; ctx.setLineDash([3, 6]); ctx.stroke(); ctx.setLineDash([]);
                    }
                }

                // balls
                ctx.globalCompositeOperation = 'lighter';
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                for (const b of balls) {
                    const p = b.body.position, x = b.px + (p.x - b.px) * a, y = b.py + (p.y - b.py) * a;
                    if (y < viewTop || y > viewBot) continue;
                    const col = b.goo ? GOO_COL : b.gold ? GOLD : b.glow;
                    const t = b.trail;
                    if (t.length >= 4) {
                        ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = b.r * 1.1;
                        ctx.beginPath(); ctx.moveTo(t[0], t[1]);
                        for (let i = 2; i < t.length; i += 2) ctx.lineTo(t[i], t[i + 1]);
                        ctx.lineTo(x, y); ctx.stroke(); ctx.globalAlpha = 1;
                    }
                    drawGlow(col, x, y, b.r * 5, 0.9);
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = ghostT > 0 ? 0.5 : 1;       // ghost balls are see-through
                for (const b of balls) {
                    const p = b.body.position, x = b.px + (p.x - b.px) * a, y = b.py + (p.y - b.py) * a;
                    if (y < viewTop || y > viewBot) continue;
                    ctx.fillStyle = b.goo ? GOO_COL : b.gold ? GOLD : '#fff';
                    ctx.beginPath(); ctx.arc(x, y, b.r * 0.78, 0, TAU); ctx.fill();
                }
                ctx.globalAlpha = 1;

                // particles
                ctx.globalCompositeOperation = 'lighter';
                for (const q of particles) {
                    if (q.y < viewTop || q.y > viewBot) continue;
                    drawGlow(q.color, q.x, q.y, 10, q.life / q.max);
                }
                ctx.globalCompositeOperation = 'source-over';

                // floating numbers
                ctx.textAlign = 'center';
                let lastFont = '';
                for (const f of floaters) {
                    if (f.y < viewTop || f.y > viewBot) continue;
                    ctx.globalAlpha = Math.min(1, f.life / f.max * 1.6);
                    const font = f.big ? FONT_BIG : FONT_SMALL;
                    if (font !== lastFont) { ctx.font = lastFont = font; }   // setting ctx.font re-parses the string, so only when it changes
                    ctx.fillStyle = f.color;
                    ctx.fillText(f.text, f.x, f.y);
                }
                ctx.globalAlpha = 1;

                drawLauncher(prevLaunchX + (launchX - prevLaunchX) * a, visBot);
            }

            function drawBucket() {
                const bs = bucketLayout(), n = bs.length, rim = rimY(), bot = worldH - 8, base = bucketValue(L('bucket'));
                for (let i = 0; i < n; i++) {
                    const b = bs[i], fl = bucketFlash[i];
                    const col = n === 1 ? '#b6ff2e' : b.t < 0.01 ? '#ffd23a' : b.t > 0.99 ? '#b6ff2e' : '#ff9d1a';
                    const sl = Math.min(8, b.w * 0.15);
                    const x0 = b.cx - b.w / 2, x1 = b.cx + b.w / 2;
                    ctx.save();
                    ctx.beginPath(); ctx.moveTo(x0, rim); ctx.lineTo(x0 + sl, bot); ctx.lineTo(x1 - sl, bot); ctx.lineTo(x1, rim); ctx.closePath();
                    ctx.globalAlpha = 0.08 + 0.3 * fl; ctx.fillStyle = col; ctx.fill();
                    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(x0, rim); ctx.lineTo(x0 + sl, bot); ctx.lineTo(x1 - sl, bot); ctx.lineTo(x1, rim);
                    glowStroke(col, n > 1 ? 2.5 : 3, 9 + 6 * fl, 0.2 + 0.3 * fl);
                    ctx.restore();
                    ctx.textAlign = 'center'; ctx.font = `800 ${Math.max(8, Math.min(12, b.w / 3.6))}px system-ui,sans-serif`;
                    ctx.fillStyle = col;
                    ctx.fillText('$' + fmt(base * b.mult), b.cx, rim + 17);
                }
            }

            function drawLauncher(x, visBot) {
                const y = LAUNCH_Y;

                // faint aim line straight down, so players can time their shot
                ctx.save();
                ctx.strokeStyle = 'rgba(255,157,26,.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 7]);
                ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, Math.max(y + 2, visBot)); ctx.stroke();
                ctx.restore();

                ctx.globalCompositeOperation = 'lighter';
                drawGlow('#ff9d1a', x, y - 6, 70, 0.45);
                ctx.globalCompositeOperation = 'source-over';

                // barrel, pointing down
                ctx.save();
                ctx.translate(x, 0);
                ctx.fillStyle = '#1a1038'; ctx.strokeStyle = '#ff9d1a'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.rect(-6.5, 10 - recoil * 7, 13, 24); ctx.fill(); ctx.stroke();
                ctx.restore();

                // carriage hanging from the ceiling
                ctx.fillStyle = '#120b2b'; ctx.strokeStyle = '#ff9d1a'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.rect(x - 15, 0, 30, 14); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, 7, 3.5, 0, TAU); ctx.fillStyle = '#ff9d1a'; ctx.fill();
            }

            /* =====================================================================
               UI
               ===================================================================== */
            const $ = id => document.getElementById(id);
            const tabsEl = $('tabs'), tabMoney = $('tabMoney'), tabRp = $('tabRp'), tabGoo = $('tabGoo');
            const gooBox = $('gooBox'), gooNum = $('gooNum');
            let curTab = 'money';
            const tabEvil = $('tabEvil'), evilBox = $('evilBox'), evilNum = $('evilNum'), evilBtn = $('evilBtn'), btnsEl = $('btns');
            const evilShow = () => evFmt(Math.floor(state.evil * 100) / 100);
            const rpShow = () => fmt(Math.floor(state.rp * 10) / 10);
            const gooShow = () => fmt(Math.floor(state.goo));
            const rpBox = $('rpBox'), rpNum = $('rpNum');
            const moneyEl = $('money');
            const stBalls = $('stBalls'), stPegs = $('stPegs'), hintEl = $('hint');
            const overlay = $('overlay'), upBtn = $('upBtn'), launchBtn = $('launchBtn'), listEl = $('list');

            const setText = (node, s) => { if (node._t !== s) { node._t = s; node.textContent = s; } };

            function buy(u) {
                if (!isUnlocked(u) || isMaxed(u)) return false;
                const c = cost(u);
                if (u.timer && u.timer()) return false;            // temporary upgrades can be busy (active / cooling down)
                if (wallet(u) < c) return false;
                if (isRp(u)) state.rp -= c; else if (curOf(u) === 'goo') state.goo -= c; else if (curOf(u) === 'evil') state.evil -= c; else state.money -= c;
                if (u.onBuy) u.onBuy(); else state.levels[u.id]++;
                if (u.id === 'depth') growWorld();
                refreshUI();
                return true;
            }

            // The world grows downward: the launcher and every peg stay where they are, the floor and bucket move down.
            function growWorld() {
                worldH = worldHeight(L('depth'));
                clampCam();
            }

            const cards = UPGRADES.map(u => {
                const el = document.createElement('div');
                el.className = 'card';
                el.style.setProperty('--c', RES_COL[curOf(u)]);   // white = money, purple = research, green = goo
                el.innerHTML =
                    '<div class="info"><div class="name"><span class="n"></span><span class="lvl"></span></div>' +
                    '<div class="desc"></div><div class="stat"></div></div>' +
                    '<button class="buy" type="button"><span class="bl"></span><span class="bc"></span></button>';
                const ref = {
                    u, el,
                    n: el.querySelector('.n'), lvl: el.querySelector('.lvl'),
                    desc: el.querySelector('.desc'), stat: el.querySelector('.stat'),
                    btn: el.querySelector('.buy'), bl: el.querySelector('.bl'), bc: el.querySelector('.bc'),
                };

                // tap to buy; hold to keep buying. (Buying on click, not pointerdown, so scrolling the list never buys.)
                let holdT = null, holdI = null, suppress = false;
                const clearHold = () => { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; };
                ref.btn.addEventListener('pointerdown', () => {
                    suppress = false; clearHold();
                    holdT = setTimeout(() => {
                        suppress = true;
                        if (!buy(u)) return;
                        holdI = setInterval(() => { if (!buy(u)) clearHold(); }, 90);
                    }, 450);
                });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => ref.btn.addEventListener(ev, clearHold));
                ref.btn.addEventListener('click', () => { if (suppress) { suppress = false; return; } buy(u); });
                ref.btn.addEventListener('contextmenu', e => e.preventDefault());

                listEl.appendChild(el);
                return ref;
            });

            tabMoney.addEventListener('click', () => { curTab = 'money'; listEl.scrollTop = 0; refreshUI(); });
            tabRp.addEventListener('click', () => { curTab = 'rp'; listEl.scrollTop = 0; refreshUI(); });
            tabGoo.addEventListener('click', () => { curTab = 'goo'; listEl.scrollTop = 0; refreshUI(); });
            tabEvil.addEventListener('click', () => { curTab = 'evil'; listEl.scrollTop = 0; refreshUI(); });

            const resetBtn = document.createElement('button');
            resetBtn.id = 'resetBtn'; resetBtn.type = 'button'; resetBtn.textContent = 'Reset progress';
            let resetting = false;
            resetBtn.addEventListener('click', () => {
                if (!confirm('Erase all progress and start over?')) return;
                resetting = true;
                try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
                location.reload();
            });
            listEl.appendChild(resetBtn);

            const PEG_LABEL = { basic: '', research: 'research ', dual: 'blast ', splitter: 'splitter ', gravity: 'gravity ' };

            function refreshUI() {
                uiDirty = false;
                const now = performance.now();

                const m = '$' + fmt(Math.floor(state.money));
                setText(moneyEl, m);
                const hasRp = L('research') > 0;
                rpBox.classList.toggle('on', hasRp);
                const hasGoo = L('goo') > 0;
                gooBox.classList.toggle('on', hasGoo);
                if (hasGoo) setText(gooNum, gooShow());
                const hasEvil = L('evil') > 0;
                if (!hasEvil && evilOn) setEvil(false);
                evilBox.classList.toggle('on', hasEvil);
                if (hasEvil) setText(evilNum, evilShow());
                evilBtn.classList.toggle('on', hasEvil);
                evilBtn.classList.toggle('active', evilOn);
                setText(evilBtn, evilOn ? 'EVIL ON' : 'EVIL');
                btnsEl.classList.toggle('three', hasEvil);
                if (hasRp) setText(rpNum, rpShow());
                setText(stBalls, `${fmt(ballLoad())}/${maxBalls()}`);
                setText(stPegs, `${state.pegs.length}/${state.pegs.length + ready()}`);   // placed / total that can be placed
                const hasAuto = L('auto') > 0;
                setText(launchBtn, hasAuto ? (autoOn ? 'AUTO: ON' : 'AUTO: OFF') : 'LAUNCH');
                launchBtn.classList.toggle('autoon', hasAuto && autoOn);
                launchBtn.classList.toggle('cant', hasAuto ? !autoOn : ballLoad() + 1 > maxBalls());

                let affordM = false, affordR = false, affordG = false, affordE = false;
                for (const c of cards) {
                    const u = c.u, unlocked = isUnlocked(u), maxed = isMaxed(u), l = L(u.id);
                    c.el.classList.toggle('locked', !unlocked);
                    c.el.classList.toggle('hid', curOf(u) !== curTab);
                    if (!unlocked) {
                        setText(c.n, '???'); setText(c.lvl, '');
                        setText(c.desc, `Earn $${fmt(u.unlock)} in total to unlock`);
                        setText(c.stat, '');
                        setText(c.bl, 'LOCKED'); setText(c.bc, '🔒');
                        c.btn.classList.add('cant'); c.btn.classList.remove('maxed');
                        continue;
                    }
                    setText(c.n, u.name);
                    setText(c.lvl, u.temp ? (u.status ? u.status() : '') : maxed ? `Lv ${l} · MAX` : `Lv ${l}`);
                    setText(c.desc, u.desc);
                    setText(c.stat, (maxed || u.temp) ? u.stat(l) : `${u.stat(l)}  →  ${u.stat(l + 1)}`);
                    const tm = u.timer ? u.timer() : null;          // temporary upgrades: { active, s } while running or cooling down
                    const afford = !maxed && !tm && wallet(u) >= cost(u);
                    if (afford) { if (isRp(u)) affordR = true; else if (curOf(u) === 'goo') affordG = true; else if (curOf(u) === 'evil') affordE = true; else affordM = true; }
                    if (tm) { setText(c.bl, ''); setText(c.bc, tm.s + 's'); }   // only the seconds left, nothing else
                    else { setText(c.bl, maxed ? 'MAXED' : ''); setText(c.bc, maxed ? '✓' : priceText(u)); }
                    c.btn.classList.toggle('active', !!(tm && tm.active));      // glowing, twinkling green while running
                    c.btn.classList.toggle('cant', !afford && !maxed && !(tm && tm.active));
                    c.btn.classList.toggle('maxed', maxed);
                }
                const open = overlay.classList.contains('open');
                upBtn.classList.toggle('alert', (affordM || affordR || affordG || affordE) && !open);
                setText(upBtn, open ? 'CLOSE' : 'SHOP');
                tabsEl.classList.toggle('on', hasRp);
                if (!hasRp) curTab = 'money';
                tabGoo.classList.toggle('on', hasGoo);
                tabMoney.classList.toggle('sel', curTab === 'money'); tabRp.classList.toggle('sel', curTab === 'rp'); tabGoo.classList.toggle('sel', curTab === 'goo');
                tabGoo.classList.toggle('alert', affordG && curTab !== 'goo');
                tabEvil.classList.toggle('on', hasEvil);
                tabEvil.classList.toggle('sel', curTab === 'evil');
                tabEvil.classList.toggle('alert', affordE && curTab !== 'evil');
                tabMoney.classList.toggle('alert', affordM && curTab !== 'money'); tabRp.classList.toggle('alert', affordR && curTab !== 'rp');

                let h = '', pulse = false;
                if (now < toastUntil) h = toastText;
                else if (ready() > 0) { h = `Tap the board to place a ${PEG_LABEL[nextType()]}peg (${ready()} ready)`; pulse = true; }
                else if (state.pegs.length === 0) {
                    h = state.money >= cost(UPGRADES[0]) ? 'Open the Shop and buy a peg!' : 'Press LAUNCH when the cannon lines up with the bucket';
                    pulse = true;
                }
                setText(hintEl, h);
                hintEl.classList.toggle('pulse', pulse);
            }

            function openOverlay() {
                app.classList.add('ov');
                app.style.setProperty('--barH', barEl.offsetHeight + 'px');   // overlay stops above the button bar
                overlay.classList.add('open'); overlay.setAttribute('aria-hidden', 'false');
                refreshUI();
            }
            function closeOverlay() {
                overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true');
                app.classList.remove('ov');
                refreshUI();
            }
            upBtn.addEventListener('click', () => overlay.classList.contains('open') ? closeOverlay() : openOverlay());
            launchBtn.addEventListener('click', () => {
                if (L('auto') > 0) { autoOn = !autoOn; refreshUI(); save(); }   // with the Auto Dropper the button is the on/off switch
                else launch();
            });
            function setEvil(on) {
                evilOn = !!on && L('evil') > 0;
                app.classList.toggle('evil', evilOn);
                refreshUI();
            }
            evilBtn.addEventListener('click', () => setEvil(!evilOn));
            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeOverlay();
                else if ((e.key === 'e' || e.key === 'E') && !e.repeat) setEvil(!evilOn);
                else if (e.code === 'Space' && !e.repeat) { e.preventDefault(); launch(); }
            });

            /* =====================================================================
               SAVE / LOAD
               ===================================================================== */
            const SAVE_CODE = { research: 'r', dual: 'd', splitter: 's', gravity: 'g', basic: 'b' };
            function save() {
                if (resetting) return;
                try {
                    localStorage.setItem(SAVE_KEY, JSON.stringify({
                        v: 2, money: state.money, total: state.total, rp: state.rp, goo: state.goo, evil: state.evil, autoOn, dualReady: state.dualReady, levels: state.levels,
                        pegs: state.pegs.map(p => [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10, SAVE_CODE[p.type] || 'b', p.left || 0, Math.round(p.dmg * 100) / 100]),
                    }));
                } catch (e) { }
            }
            function load() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return;
                    const d = JSON.parse(raw);
                    const pd = v => Number.isFinite(v) ? Math.min(0.99, Math.max(0, v)) : 0;   // saved peg damage
                    if (Number.isFinite(d.money)) state.money = d.money;
                    if (Number.isFinite(d.total)) state.total = d.total;
                    if (Number.isFinite(d.rp)) state.rp = d.rp;
                    if (Number.isFinite(d.goo)) state.goo = d.goo;       // trimmed to the goo limit once the levels are loaded
                    if (Number.isFinite(d.evil)) state.evil = d.evil;
                    if (typeof d.autoOn === 'boolean') autoOn = d.autoOn;
                    if (Array.isArray(d.dualReady)) state.dualReady = d.dualReady.filter(Number.isFinite).map(n => n | 0);
                    if (d.levels) for (const u of UPGRADES) if (Number.isFinite(d.levels[u.id])) state.levels[u.id] = d.levels[u.id] | 0;
                    worldH = worldHeight(L('depth'));
                    state.goo = Math.min(state.goo, gooCap());
                    if (Array.isArray(d.pegs)) {
                        const lim = { basic: L('peg'), research: L('rpeg'), splitter: L('splitpeg'), gravity: L('gravpeg') }, cnt = { basic: 0, research: 0, splitter: 0, gravity: 0 };
                        for (const pt of d.pegs) {
                            if (!Array.isArray(pt) || !Number.isFinite(pt[0]) || !Number.isFinite(pt[1])) continue;
                            if (pt[2] === 'd') { if (Number.isFinite(pt[3]) && pt[3] > 0) addPeg(pt[0], pt[1], 'dual', pt[3] | 0, pd(pt[4])); continue; }
                            const type = pt[2] === 'r' ? 'research' : pt[2] === 's' ? 'splitter' : pt[2] === 'g' ? 'gravity' : 'basic';
                            if (cnt[type] >= lim[type]) continue;
                            cnt[type]++;
                            addPeg(pt[0], pt[1], type, 0, pd(pt[4]));
                        }
                    }
                } catch (e) { }
            }
            setInterval(save, 5000);
            document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
            window.addEventListener('pagehide', save);

            /* =====================================================================
               MAIN LOOP
               ===================================================================== */
            load();
            resize();
            camY = camRange()[0];          // start looking at the top, where the launcher is
            refreshUI();

            let last = performance.now(), acc = 0, uiT = 0, renderDt = 0, skipRender = false;
            let frameAvg = 16, slowT = 0;
            // ?debug in the URL shows fps, physics ms, render ms and the pixel ratio in the corner
            const DEBUG = /[?&]debug\b/.test(location.search);
            let dbgFrames = 0, dbgPhys = 0, dbgRender = 0, dbgT = 0, dbgText = '';
            const MAX_STEPS = 3;                     // physics steps per frame; more would make a slow phone even slower (it plays in slow motion instead)
            function frame(t) {
                const raw = t - last, dt = Math.min(100, raw); last = t;

                // quality governor: if frames stay slow (below ~50 fps) for 1.5 seconds, lower the canvas pixel ratio one tier
                if (raw < 250) {                     // ignore the gap after the tab was hidden
                    frameAvg += (raw - frameAvg) * 0.05;
                    slowT = frameAvg > 20 ? slowT + raw : 0;
                    if (slowT > 1500 && qTier < DPR_TIERS.length - 1) { qTier++; slowT = 0; frameAvg = 16; resize(); }
                }

                // fixed-timestep physics, identical behaviour on 60 Hz and 120 Hz screens
                const t0 = DEBUG ? performance.now() : 0;
                acc += dt;
                let n = 0;
                while (acc >= STEP && n < MAX_STEPS) { stepGame(STEP); acc -= STEP; n++; }
                if (n === MAX_STEPS) acc = Math.min(acc, STEP);
                const t1 = DEBUG ? performance.now() : 0;

                // momentum scrolling
                if (!padObserver) measurePads();
                if (!drag && Math.abs(camVel) > 4) {
                    camY += camVel * dt / 1000;
                    camVel *= Math.pow(0.04, dt / 1000);
                    const [lo, hi] = camRange();
                    if (camY < lo || camY > hi) camVel = 0;
                } else if (!drag) camVel = 0;
                clampCam();

                // the shop covers most of the board, so the board is only drawn every other frame while it is open
                renderDt += dt;
                skipRender = overlay.classList.contains('open') && !skipRender;
                if (!skipRender) { render(renderDt, acc / STEP); renderDt = 0; }

                if (DEBUG) {
                    dbgFrames++; dbgPhys += t1 - t0; dbgRender += performance.now() - t1; dbgT += raw;
                    if (dbgT >= 1000) {
                        dbgText = `${Math.round(dbgFrames * 1000 / dbgT)} fps  phys ${(dbgPhys / dbgFrames).toFixed(1)}ms  draw ${(dbgRender / dbgFrames).toFixed(1)}ms  dpr ${dpr}  pegs ${state.pegs.length}  balls ${balls.length}`;
                        dbgFrames = dbgPhys = dbgRender = dbgT = 0;
                    }
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, cssH - padBot - 18, cssW, 18);
                    ctx.fillStyle = '#fff'; ctx.font = '600 11px system-ui,sans-serif'; ctx.textAlign = 'left';
                    ctx.fillText(dbgText, 6, cssH - padBot - 5);
                }

                uiT += dt;
                if (uiT > 100 || uiDirty) { uiT = 0; refreshUI(); }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
