<!doctype html>
<html lang="en">

<head>
    <base href="./">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07051a">
    <title>Neon Pegs</title>
    <link rel="stylesheet" href="dist/game.css?v=1">
</head>

<body>
    <div id="app">
        <div id="evilBg"></div>
        <canvas id="game"></canvas>
        <div id="evilVig"></div>

        <div id="hud">
            <div id="resRow">
                <div class="rc on" id="moneyBox"><span id="money">0</span></div>
                <div class="rc" id="rpBox"><span id="rpNum">0</span></div>
                <div class="rc" id="gooBox"><span id="gooNum">0</span></div>
                <div class="rc" id="evilBox"><span id="evilNum">0</span></div>
            </div>
            <div id="statRow">
                <div class="st">BALLS <b id="stBalls">0/1</b></div>
                <div class="st">PEGS <b id="stPegs">0</b></div>
            </div>
        </div>

        <div id="bar">
            <div id="hint"></div>
            <div id="btns">
                <button id="settingsBtn" class="rb" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h8.8M17.2 6H20M4 12h2.8M11.2 12H20M4 18h7.8M16.2 18H20" />
                        <circle cx="15" cy="6" r="2.2" />
                        <circle cx="9" cy="12" r="2.2" />
                        <circle cx="14" cy="18" r="2.2" />
                    </svg></button>
                <button id="editBtn" class="rb" type="button" title="Edit pegs" aria-label="Edit pegs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15.5 4.5l4 4L9 19l-5 1 1-5z" fill="currentColor" fill-opacity=".25" />
                        <path d="M13 7l4 4" />
                    </svg></button>
                <button id="upBtn" class="rb" type="button" title="Shop" aria-label="Shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3 5 10h4.2v5.5h5.6V10H19z" fill="currentColor" fill-opacity=".25" />
                        <path d="M8 20h8" />
                    </svg></button>
                <button id="researchBtn" class="rb locked" type="button" title="Research" aria-label="Research"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7.6 14.5h8.8l2.3 4.1A1.8 1.8 0 0 1 17.1 21H6.9a1.8 1.8 0 0 1-1.6-2.4z" fill="currentColor" fill-opacity=".25" stroke="none" />
                        <path d="M9.5 3h5M10.5 3v6.2L5.3 18.4A1.8 1.8 0 0 0 6.9 21h10.2a1.8 1.8 0 0 0 1.6-2.6L13.5 9.2V3" />
                    </svg></button>
                <button id="powersBtn" class="rb locked" type="button" title="Powers" aria-label="Powers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z" fill="currentColor" fill-opacity=".25" />
                    </svg></button>
            </div>
            <!-- edit mode: DONE centred, then the pegs that can be placed, in a strip that scrolls sideways -->
            <div id="palette">
                <div id="palTip" hidden></div>
                <div id="palDone"><button id="doneBtn" type="button">DONE</button></div>
                <div id="palStrip"></div>
            </div>
        </div>

        <div id="overlay" aria-hidden="true">
            <div id="list"></div>
        </div>

        <!-- research, system and powers: slide up like the shop; only one screen is open at a time -->
        <div id="research" aria-hidden="true">
            <div id="resTitle">RESEARCH</div>
            <div id="resList"></div>
        </div>
        <div id="system" aria-hidden="true">
            <div id="sysTitle">SYSTEM</div>
            <div id="sysMsg"></div>
            <div id="sysList"></div>
        </div>
        <div id="layouts" aria-hidden="true">
            <div id="layTitle">LAYOUTS</div>
            <div id="layMsg"></div>
            <div id="layList"></div>
        </div>
        <div id="powers" aria-hidden="true">
            <div id="powTitle">POWERS</div>
            <div id="powList"></div>
        </div>
        <!-- settings: game switches (auto launch, evil, ...) and the way to System; a half-height panel, so the board stays in view above it -->
        <div id="settings" aria-hidden="true">
            <div id="settingsTitle">SETTINGS</div>
            <div id="settingsList"></div>
        </div>
    </div>

    <script src="dist/game.js?v=1"></script>
</body>

</html>
