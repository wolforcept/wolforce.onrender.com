<!doctype html>
<html lang="en">

<head>
    <base href="/games/balls2/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07051a">
    <title>Neon Pegs</title>
    <style>
        :root {
            --bg: #07051a;
            --cyan: #19f5ff;
            --mag: #ff2bd6;
            --lime: #b6ff2e;
            --orange: #ff9d1a;
            --violet: #8a5bff;
            --goo: #6bff1f;
            --gold: #ffd23a;
            --evil: #ff2a3d;
            --text: #e8e6ff;
            --dim: #8b86b8;
            --deck: 64px;
            /* height of the bottom row: the buttons, and the peg strip in edit mode, so the bar never changes size */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        [hidden] {
            display: none !important
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #03020c;
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            background: radial-gradient(120% 80% at 50% 0%, #1a1252 0%, var(--bg) 62%);
            box-shadow: 0 0 60px rgba(138, 91, 255, .25);
        }

        canvas#game {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none
        }

        /* ---------- evil mode: the whole screen turns red ---------- */
        #evilBg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .7s ease;
            background: radial-gradient(120% 80% at 50% 0%, #9c0f22 0%, #3d0510 62%)
        }

        #evilVig {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity .7s ease;
            box-shadow: inset 0 0 140px 20px rgba(255, 20, 50, .55);
            background: rgba(255, 20, 40, .07)
        }

        #app.evil #evilBg,
        #app.evil #evilVig {
            opacity: 1
        }

        #app.evil #hud {
            background: linear-gradient(#2a0409f2 55%, #2a040900)
        }

        #app.evil #bar {
            background: linear-gradient(#2a040900, #2a0409f0 38%)
        }

        #app.evil.ov #bar {
            background: rgba(30, 3, 8, .96)
        }

        /* ---------- HUD ---------- */
        /* The HUD stays visible on top of the shop (z-index above the overlay); the shop starts right below it. */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 22;
            pointer-events: none;
            padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: linear-gradient(#07051af2 70%, #07051a00);
        }

        /* row 1: every resource counter has the same size and the same width; the symbol sits right next to the number, centred with it */
        #resRow {
            display: flex;
            gap: 4px
        }

        .rc {
            flex: 1 1 0;
            min-width: 0;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 23px;
            font-weight: 800;
            line-height: 1.1;
            white-space: nowrap
        }

        .rc.on {
            display: flex
        }

        .rc svg {
            width: 21px;
            height: 21px;
            flex: none
        }

        #moneyBox {
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold), 0 0 20px rgba(255, 210, 58, .5)
        }

        #moneyBox svg {
            filter: drop-shadow(0 0 4px var(--gold))
        }

        #rpBox {
            color: var(--violet);
            text-shadow: 0 0 8px var(--violet), 0 0 20px rgba(138, 91, 255, .5)
        }

        #rpBox svg {
            filter: drop-shadow(0 0 4px var(--violet))
        }

        #gooBox {
            color: var(--goo);
            text-shadow: 0 0 8px var(--goo), 0 0 20px rgba(107, 255, 31, .45)
        }

        #gooBox svg {
            filter: drop-shadow(0 0 4px var(--goo))
        }

        #evilBox {
            color: var(--evil);
            text-shadow: 0 0 8px var(--evil), 0 0 20px rgba(255, 42, 61, .5)
        }

        #evilBox svg {
            filter: drop-shadow(0 0 4px var(--evil))
        }

        /* row 2: balls, the edit mode switch, pegs */
        #statRow {
            display: flex;
            align-items: center;
            gap: 10px
        }

        #editBtn {
            flex: none;
            pointer-events: auto;
            height: 24px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1.5px solid var(--cyan);
            background: color-mix(in srgb, var(--cyan) 12%, transparent);
            color: #fff;
            font: 800 11px/1 system-ui, sans-serif;
            letter-spacing: 1.5px;
            text-shadow: 0 0 6px var(--cyan);
            box-shadow: 0 0 8px color-mix(in srgb, var(--cyan) 45%, transparent);
            cursor: pointer;
        }

        #app.edit #editBtn {
            background: color-mix(in srgb, var(--cyan) 45%, transparent);
            box-shadow: 0 0 16px var(--cyan)
        }

        /* ---------- edit mode: the bottom bar becomes a strip of pegs to place ---------- */
        #palette {
            display: none;
            position: relative;
            pointer-events: auto
        }

        #app.edit #palette {
            display: block
        }

        #app.edit #btns {
            display: none
        }

        /* same size as the normal bar (same padding, the strip is as tall as the buttons); only the background changes */
        #app.edit #bar {
            background: linear-gradient(#05031400, #050314f2 30%)
        }

        #palStrip {
            display: flex;
            align-items: center;
            gap: 8px;
            height: var(--deck);
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            scrollbar-width: none;
            padding: 0 2px
        }

        #palStrip::-webkit-scrollbar {
            display: none
        }

        /* a peg chip: the peg on the left, its name and price on the right */
        .chip {
            --k: #fff;
            flex: 0 0 auto;
            height: calc(var(--deck) - 8px);
            padding: 0 12px 0 8px;
            border-radius: 14px;
            border: 2px solid color-mix(in srgb, var(--k) 40%, transparent);
            background: rgba(16, 12, 46, .85);
            color: #fff;
            display: grid;
            grid-template-columns: auto auto;
            grid-template-rows: auto auto;
            column-gap: 8px;
            align-items: center;
            align-content: center;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            touch-action: pan-x
        }

        .chip canvas {
            grid-row: 1 / 3;
            width: 34px;
            height: 34px
        }

        .chip .pn {
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap
        }

        .chip .pp {
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            color: var(--gold)
        }

        .chip .pp.free {
            color: var(--lime)
        }

        .chip.sel {
            border-color: var(--k);
            background: color-mix(in srgb, var(--k) 14%, rgba(16, 12, 46, .85));
            box-shadow: 0 0 6px var(--k), inset 0 0 12px color-mix(in srgb, var(--k) 35%, transparent)
            /* a small outer glow: the strip has only 4px of room above and below a chip */
        }

        .chip.cant {
            opacity: .45
        }

        /* the description of a peg type, just above the strip */
        #palTip {
            --k: #fff;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 100%;
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(10, 7, 30, .97);
            border: 1.5px solid var(--k);
            box-shadow: 0 0 16px color-mix(in srgb, var(--k) 45%, transparent);
            font-size: 12px;
            line-height: 1.4;
            color: #d9d6ff;
            pointer-events: none
        }

        #palTip b {
            color: var(--k)
        }

        .st {
            flex: 1 1 0;
            text-align: center;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--dim);
            font-weight: 600
        }

        .st b {
            color: var(--mag);
            text-shadow: 0 0 8px rgba(255, 43, 214, .7);
            font-size: 13px
        }

        /* ---------- round buttons ---------- */
        .round {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid var(--violet);
            color: #fff;
            font-size: 15px;
            background: rgba(138, 91, 255, .16);
            box-shadow: 0 0 10px rgba(138, 91, 255, .55);
            cursor: pointer;
        }

        .round:active {
            transform: scale(.92)
        }

        /* ---------- bottom bar ---------- */
        #bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 25;
            pointer-events: none;
            padding: 26px 14px calc(env(safe-area-inset-bottom) + 12px);
            background: linear-gradient(#07051a00, #07051af0 38%);
        }

        #app.ov #bar {
            padding-top: 10px;
            background: rgba(5, 3, 20, .96);
            border-top: 1px solid rgba(138, 91, 255, .35)
        }

        #app.ov #hint {
            display: none
        }

        /* always exactly one line, so the bar keeps its height whatever the hint says */
        #hint {
            height: 20px;
            line-height: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            color: var(--lime);
            text-shadow: 0 0 8px rgba(182, 255, 46, .7);
            margin-bottom: 8px;
        }

        #hint.pulse {
            animation: pulse 1.4s ease-in-out infinite
        }

        @keyframes pulse {
            50% {
                opacity: .45
            }
        }

        /* five fixed slots: settings, auto | SHOP | goo, evil. A slot keeps its place while its button is still locked. */
        #btns {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: center;
            justify-items: center;
            height: var(--deck)
        }

        .rb {
            --k: var(--mag);
            --d: calc(var(--deck) - 12px);
            pointer-events: auto;
            position: relative;
            width: var(--d);
            height: var(--d);
            border-radius: 50%;
            padding: 0;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--k);
            border: 2px solid var(--k);
            background: color-mix(in srgb, var(--k) 12%, transparent);
            box-shadow: 0 0 14px color-mix(in srgb, var(--k) 55%, transparent), inset 0 0 16px color-mix(in srgb, var(--k) 22%, transparent);
        }

        .rb svg {
            width: 46%;
            height: 46%;
            filter: drop-shadow(0 0 4px var(--k))
        }

        .rb:active {
            transform: scale(.94)
        }

        /* switched off (auto fire off): dimmed, icon still showing */
        .rb.cant {
            opacity: .45;
            box-shadow: none
        }

        /* switched on: filled and glowing */
        .rb.on {
            background: color-mix(in srgb, var(--k) 42%, transparent);
            box-shadow: 0 0 24px var(--k), inset 0 0 20px color-mix(in srgb, var(--k) 45%, transparent)
        }

        /* not unlocked yet: an empty translucent circle holds the spot */
        .rb.locked {
            --k: #6b678f;
            opacity: .3;
            box-shadow: none;
            pointer-events: none
        }

        .rb.locked svg {
            display: none
        }

        #upBtn {
            --d: var(--deck)
        }

        #upBtn svg {
            width: 44%;
            height: 44%
        }

        #upBtn .ic-close,
        #upBtn.open .ic-shop {
            display: none
        }

        #upBtn.open .ic-close {
            display: block
        }

        #settingsBtn {
            --k: #c9c4ff
        }

        #launchBtn {
            --k: var(--cyan)
        }

        #gooBtn {
            --k: var(--goo)
        }

        #evilBtn {
            --k: var(--evil)
        }

        #upBtn.alert::after,
        #gooBtn.alert::after {
            content: "";
            position: absolute;
            top: 2px;
            right: 2px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 10px var(--lime);
            animation: pulse 1s ease-in-out infinite;
        }

        /* ---------- upgrades overlay (sits above the button bar so you can keep launching) ---------- */
        #overlay,
        #settings,
        #powers {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--barH, 0px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            padding-top: var(--hudH, 0px);
            /* the HUD sits on top of the shop, so the shop starts below it */
            background: rgba(5, 3, 20, .86);
            /* no backdrop-filter: blurring the live canvas behind it is re-done every frame and is slow on phones */
            transform: translateY(100%);
            visibility: hidden;
            transition: transform .26s ease, visibility 0s .26s;
        }

        #overlay.open,
        #settings.open,
        #powers.open {
            transform: none;
            visibility: visible;
            transition: transform .26s ease, visibility 0s 0s
        }

        #tabs {
            display: none;
            gap: 8px;
            padding: 0 12px 10px
        }

        #tabs.on {
            display: flex
        }

        .tab {
            flex: 1;
            position: relative;
            height: 38px;
            border-radius: 10px;
            border: 1.5px solid #4a4670;
            background: rgba(255, 255, 255, .04);
            color: var(--dim);
            font: 800 11px/1 system-ui, sans-serif;
            letter-spacing: 1px;
            cursor: pointer
        }

        .tab.sel {
            color: #fff;
            border-color: var(--k);
            background: color-mix(in srgb, var(--k) 16%, transparent);
            box-shadow: 0 0 10px color-mix(in srgb, var(--k) 55%, transparent)
        }

        #tabMoney {
            --k: var(--cyan)
        }

        #tabRp {
            --k: var(--violet)
        }

        .tab.alert::after {
            content: "";
            position: absolute;
            top: 6px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 8px var(--lime)
        }

        .card.hid {
            display: none
        }

        #list,
        #setList,
        #powList {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 28px;
        }

        .card {
            --c: var(--cyan);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 12px 12px 14px;
            border-radius: 14px;
            background: rgba(16, 12, 46, .72);
            border: 1px solid rgba(255, 255, 255, .08);
            border-left: 3px solid var(--c);
            box-shadow: 0 0 14px color-mix(in srgb, var(--c) 18%, transparent);
        }

        .card .name {
            font-weight: 800;
            font-size: 15px;
            color: var(--c);
            text-shadow: 0 0 8px color-mix(in srgb, var(--c) 70%, transparent)
        }

        .card .lvl {
            color: var(--dim);
            font-weight: 600;
            font-size: 12px;
            margin-left: 6px;
            text-shadow: none
        }

        .card .desc {
            font-size: 12px;
            color: #b9b5e0;
            margin-top: 3px;
            line-height: 1.35
        }

        .card .stat {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px
        }

        .card.locked {
            --c: #5d5a82;
            opacity: .65
        }

        .card.locked .name {
            text-shadow: none
        }

        .buy {
            min-width: 100px;
            min-height: 54px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid var(--c);
            background: color-mix(in srgb, var(--c) 14%, transparent);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-family: inherit;
            box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-y;
        }

        .buy .bl {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px
        }

        /* one price per line when an upgrade costs several currencies */
        .buy .bc {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px
        }

        /* a price: the currency icon, then the amount */
        .pc {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap
        }

        .pc svg {
            width: 1.05em;
            height: 1.05em;
            flex: none
        }

        .buy:active {
            transform: scale(.95)
        }

        .buy.cant {
            opacity: .38;
            box-shadow: none;
            border-color: #6b678f;
            background: rgba(255, 255, 255, .04)
        }

        .buy.maxed,
        .card.locked .buy {
            opacity: .4;
            box-shadow: none;
            cursor: default
        }

        /* a temporary upgrade that is running: glowing and twinkling in its --act colour (green by default, red for the bomb) */
        .buy.active {
            --act: #6bff1f;
            border-color: var(--act);
            background: color-mix(in srgb, var(--act) 28%, transparent);
            cursor: default;
            box-shadow: 0 0 10px var(--act), inset 0 0 8px color-mix(in srgb, var(--act) 35%, transparent);
            position: relative;
        }

        .buy.active.danger {
            --act: #ff2a3d
        }

        /* the twinkle only animates the opacity of an extra glow layer, which the GPU handles without repainting */
        .buy.active::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            pointer-events: none;
            box-shadow: 0 0 26px var(--act), 0 0 40px color-mix(in srgb, var(--act) 60%, transparent), inset 0 0 20px color-mix(in srgb, var(--act) 80%, transparent);
            animation: twinkle .9s ease-in-out infinite;
            will-change: opacity;
        }

        .buy.active .bc {
            font-size: 19px;
            color: color-mix(in srgb, var(--act) 15%, #fff);
            text-shadow: 0 0 8px var(--act), 0 0 16px var(--act)
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0
            }

            35% {
                opacity: 1
            }

            60% {
                opacity: .25
            }

            80% {
                opacity: .75
            }
        }

        /* ---------- settings screen: the same sliding panel and cards as the shop ---------- */
        #setTitle,
        #powTitle {
            padding: 14px 14px 0;
            font: 800 12px/1 system-ui, sans-serif;
            letter-spacing: 3px;
            color: var(--dim)
        }

        /* feedback line (the hint under the board is hidden while a screen is open) */
        #setMsg {
            min-height: 24px;
            padding: 8px 14px 0;
            font-size: 12px;
            font-weight: 700;
            color: var(--lime);
            text-shadow: 0 0 8px rgba(182, 255, 46, .5)
        }

        #setMsg.err {
            color: var(--evil);
            text-shadow: 0 0 8px rgba(255, 42, 61, .5)
        }

        /* a setting: text on top, its buttons in a row below */
        .card.set {
            grid-template-columns: 1fr
        }

        .acts {
            display: flex;
            gap: 8px
        }

        .acts .buy {
            flex: 1 1 0;
            min-width: 0;
            min-height: 46px
        }

        .acts .buy .bc {
            font-size: 13px;
            letter-spacing: 1px
        }
        /* ---------- scrollbars: thin, soft neon, no Windows look (violet, red in evil mode) ---------- */
        #list,
        #setList,
        #powList {
            --sb: 138, 91, 255;
            scrollbar-width: thin;
            /* Firefox */
            scrollbar-color: rgba(var(--sb), .6) transparent
        }

        #app.evil #list,
        #app.evil #setList,
        #app.evil #powList {
            --sb: 255, 42, 61
        }

        /* Chrome, Edge, Safari: a slim glowing thumb on a barely visible track */
        @supports selector(::-webkit-scrollbar) {

            #list,
            #setList,
            #powList {
                scrollbar-width: auto;
                scrollbar-color: auto
            }

            #list::-webkit-scrollbar,
            #setList::-webkit-scrollbar,
            #powList::-webkit-scrollbar {
                width: 10px
            }

            #list::-webkit-scrollbar-track,
            #setList::-webkit-scrollbar-track,
            #powList::-webkit-scrollbar-track {
                margin: 6px 0;
                background: transparent
            }

            #list::-webkit-scrollbar-thumb,
            #setList::-webkit-scrollbar-thumb,
            #powList::-webkit-scrollbar-thumb {
                border: 3px solid transparent;
                border-radius: 8px;
                background: rgba(var(--sb), .5) padding-box;
                box-shadow: 0 0 8px rgba(var(--sb), .45)
            }

            #list::-webkit-scrollbar-thumb:hover,
            #setList::-webkit-scrollbar-thumb:hover,
            #powList::-webkit-scrollbar-thumb:hover,
            #list::-webkit-scrollbar-thumb:active,
            #setList::-webkit-scrollbar-thumb:active,
            #powList::-webkit-scrollbar-thumb:active {
                background: rgba(var(--sb), .9) padding-box;
                box-shadow: 0 0 12px rgba(var(--sb), .8)
            }

            #list::-webkit-scrollbar-corner,
            #setList::-webkit-scrollbar-corner,
            #powList::-webkit-scrollbar-corner {
                background: transparent
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="evilBg"></div>
        <canvas id="game"></canvas>
        <div id="evilVig"></div>

        <div id="hud">
            <div id="resRow">
                <div class="rc on" id="moneyBox"><svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9.5" fill="#ffd23a" stroke="#fff3b0" stroke-width="1.6" />
                        <circle cx="12" cy="12" r="5.6" fill="none" stroke="#c99a00" stroke-width="1.8" />
                    </svg><span id="money">0</span></div>
                <div class="rc" id="rpBox"><svg viewBox="0 0 24 24">
                        <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="rgba(138,91,255,.25)" stroke="#8a5bff" stroke-width="2.2" stroke-linejoin="round" />
                    </svg><span id="rpNum">0</span></div>
                <div class="rc" id="gooBox"><svg viewBox="0 0 24 24">
                        <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z" fill="rgba(107,255,31,.3)" stroke="#6bff1f" stroke-width="2.2" stroke-linejoin="round" />
                    </svg><span id="gooNum">0</span></div>
                <div class="rc" id="evilBox"><svg viewBox="0 0 24 24">
                        <polygon points="12,2.5 14.4,9.3 21.5,9.4 15.8,13.7 17.9,20.6 12,16.5 6.1,20.6 8.2,13.7 2.5,9.4 9.6,9.3" fill="rgba(255,42,61,.3)" stroke="#ff2a3d" stroke-width="2" stroke-linejoin="round" />
                    </svg><span id="evilNum">0</span></div>
            </div>
            <div id="statRow">
                <div class="st">BALLS <b id="stBalls">0/1</b></div>
                <button id="editBtn" type="button">EDIT</button>
                <div class="st">PEGS <b id="stPegs">0</b></div>
            </div>
        </div>

        <div id="bar">
            <div id="hint"></div>
            <div id="btns">
                <button id="settingsBtn" class="rb" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3.2" />
                        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" />
                        <circle cx="12" cy="12" r="6.6" />
                    </svg></button>
                <button id="launchBtn" class="rb locked" type="button" title="Auto fire" aria-label="Auto fire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 12a8 8 0 1 1-2.6-5.9" />
                        <path d="M20 3.5v4.5h-4.5" />
                        <path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor" />
                    </svg></button>
                <button id="upBtn" class="rb" type="button" title="Shop" aria-label="Shop"><svg class="ic-shop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 8h14l-1.2 12.5H6.2z" />
                        <path d="M9 10.5V7a3 3 0 0 1 6 0v3.5" />
                    </svg><svg class="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg></button>
                <button id="gooBtn" class="rb locked" type="button" title="Goo" aria-label="Goo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
                        <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z" fill="currentColor" fill-opacity=".25" />
                    </svg></button>
                <button id="evilBtn" class="rb locked" type="button" title="Evil (E)" aria-label="Evil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                        <polygon points="12,2.5 14.4,9.3 21.5,9.4 15.8,13.7 17.9,20.6 12,16.5 6.1,20.6 8.2,13.7 2.5,9.4 9.6,9.3" />
                    </svg></button>
            </div>
            <!-- edit mode: the pegs that can be placed, in a strip that scrolls sideways -->
            <div id="palette">
                <div id="palTip" hidden></div>
                <div id="palStrip"></div>
            </div>
        </div>

        <div id="overlay" aria-hidden="true">
            <div id="list"></div>
            <!-- tabs sit at the bottom, just above the shop button -->
            <div id="tabs">
                <button class="tab sel" id="tabMoney" type="button">UPGRADES</button>
                <button class="tab" id="tabRp" type="button">RESEARCH</button>
            </div>
        </div>

        <!-- settings and powers: slide up like the shop; only one screen is open at a time -->
        <div id="settings" aria-hidden="true">
            <div id="setTitle">SETTINGS</div>
            <div id="setMsg"></div>
            <div id="setList"></div>
        </div>
        <div id="powers" aria-hidden="true">
            <div id="powTitle">POWERS</div>
            <div id="powList"></div>
        </div>
    </div>

    <script src="dist/game.js?v=1"></script>
</body>

</html>
