            resetBtn.id = 'resetBtn'; resetBtn.type = 'button'; resetBtn.textContent = 'Reset progress';
            let resetting = false;
            resetBtn.addEventListener('click', () => {
                if (!confirm('Erase all progress and start over?')) return;
                resetting = true;
                try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
                location.reload();
            });
            listEl.appendChild(resetBtn);

            function refreshUI() {
                const now = performance.now();
                while (earnLog.length && earnLog[0].t < now - 10000) earnLog.shift();
                let sum = 0; for (const e of earnLog) sum += e.v;
                const window_s = Math.min(10, Math.max(3, (now - t0) / 1000));

                const m = '$' + fmt(Math.floor(state.money));
                setText(moneyEl, m); setText(ovMoney, m);
                setText(rateEl, '+' + fmt(sum / window_s) + '/s');
                const hasRp = L('research') > 0;
                rpBox.classList.toggle('on', hasRp);
                const hasGoo = L('goo') > 0;
                gooBox.classList.toggle('on', hasGoo);
                if (hasGoo) setText(gooNum, gooShow());
                const hasEvil = L('evil') > 0;
                if (!hasEvil && evilOn) setEvil(false);
                evilBox.classList.toggle('on', hasEvil);
                if (hasEvil) setText(evilNum, evilShow());
                evilBtn.classList.toggle('on', hasEvil);
                evilBtn.classList.toggle('active', evilOn);
                setText(evilBtn, evilOn ? 'EVIL ON' : 'EVIL');
                btnsEl.classList.toggle('three', hasEvil);
                if (hasRp) {
                    setText(rpNum, rpShow());
                    setText(rpRateEl, '+' + rpRate(L('research')).toFixed(1) + '/s');
                }
                setText(stBalls, `${fmt(ballLoad())}/${maxBalls()}`);
                setText(stPegs, String(state.pegs.length));
                setText(stReady, String(ready()));
                const hasAuto = L('auto') > 0;
                setText(launchBtn, hasAuto ? (autoOn ? 'AUTO: ON' : 'AUTO: OFF') : 'LAUNCH');
                launchBtn.classList.toggle('autoon', hasAuto && autoOn);
                launchBtn.classList.toggle('cant', hasAuto ? !autoOn : ballLoad() + 1 > maxBalls());

                let affordM = false, affordR = false, affordG = false, affordE = false;
                for (const c of cards) {
                    const u = c.u, unlocked = isUnlocked(u), maxed = isMaxed(u), l = L(u.id);
                    c.el.classList.toggle('locked', !unlocked);
                    c.el.classList.toggle('hid', curOf(u) !== curTab);
                    if (!unlocked) {
                        setText(c.n, '???'); setText(c.lvl, '');
                        setText(c.desc, `Earn $${fmt(u.unlock)} in total to unlock`);
                        setText(c.stat, '');
                        setText(c.bl, 'LOCKED'); setText(c.bc, '🔒');
                        c.btn.classList.add('cant'); c.btn.classList.remove('maxed');
                        continue;
                    }
                    setText(c.n, u.name);
                    setText(c.lvl, u.temp ? (u.status ? u.status() : '') : maxed ? `Lv ${l} · MAX` : `Lv ${l}`);
                    setText(c.desc, u.desc);
                    setText(c.stat, (maxed || u.temp) ? u.stat(l) : `${u.stat(l)}  →  ${u.stat(l + 1)}`);
                    const bdg = u.badge ? u.badge() : '';
                    const afford = !maxed && !bdg && wallet(u) >= cost(u);
                    if (afford) { if (isRp(u)) affordR = true; else if (curOf(u) === 'goo') affordG = true; else if (curOf(u) === 'evil') affordE = true; else affordM = true; }
                    setText(c.bl, maxed ? 'MAXED' : bdg || 'BUY');
                    setText(c.bc, maxed ? '✓' : priceText(u));
                    c.btn.classList.toggle('cant', !afford && !maxed);
                    c.btn.classList.toggle('maxed', maxed);
                }
                const open = overlay.classList.contains('open');
                upBtn.classList.toggle('alert', (affordM || affordR || affordG || affordE) && !open);
                setText(upBtn, open ? 'CLOSE' : 'UPGRADES');
                tabsEl.classList.toggle('on', hasRp);
                if (!hasRp) curTab = 'money';
                tabGoo.classList.toggle('on', hasGoo);
                tabMoney.classList.toggle('sel', curTab === 'money'); tabRp.classList.toggle('sel', curTab === 'rp'); tabGoo.classList.toggle('sel', curTab === 'goo');
                tabGoo.classList.toggle('alert', affordG && curTab !== 'goo');
                tabEvil.classList.toggle('on', hasEvil);
                tabEvil.classList.toggle('sel', curTab === 'evil');
                tabEvil.classList.toggle('alert', affordE && curTab !== 'evil');
                ovEvil.classList.toggle('on', hasEvil);
                if (hasEvil) setText(ovEvilNum, evilShow());
                tabMoney.classList.toggle('alert', affordM && curTab !== 'money'); tabRp.classList.toggle('alert', affordR && curTab !== 'rp');
                ovRp.classList.toggle('on', hasRp);
                if (hasRp) setText(ovRpNum, rpShow());
                ovGoo.classList.toggle('on', hasGoo);
                if (hasGoo) setText(ovGooNum, gooShow());

                let h = '', pulse = false;
                if (now < toastUntil) h = toastText;
                else if (ready() > 0) { h = `Tap the board to place a ${nextType() === 'research' ? 'research ' : nextType() === 'dual' ? 'dual ' : nextType() === 'splitter' ? 'splitter ' : ''}peg (${ready()} ready)`; pulse = true; }
                else if (state.pegs.length === 0) {
                    h = state.money >= cost(UPGRADES[0]) ? 'Open Upgrades and buy a peg!' : 'Press LAUNCH when the cannon lines up with the bucket';
                    pulse = true;
                }
                setText(hintEl, h);
                hintEl.classList.toggle('pulse', pulse);
            }

            function openOverlay() {
                app.classList.add('ov');
                app.style.setProperty('--barH', barEl.offsetHeight + 'px');   // overlay stops above the button bar
                overlay.classList.add('open'); overlay.setAttribute('aria-hidden', 'false');
                refreshUI();
            }
            function closeOverlay() {
                overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true');
                app.classList.remove('ov');
                refreshUI();
            }
            upBtn.addEventListener('click', () => overlay.classList.contains('open') ? closeOverlay() : openOverlay());
            $('closeBtn').addEventListener('click', closeOverlay);
            launchBtn.addEventListener('click', () => {
                if (L('auto') > 0) { autoOn = !autoOn; refreshUI(); save(); }   // with the Auto Dropper the button is the on/off switch
                else launch();
            });
            function setEvil(on) {
                evilOn = !!on && L('evil') > 0;
                app.classList.toggle('evil', evilOn);
                refreshUI();
            }
            evilBtn.addEventListener('click', () => setEvil(!evilOn));
            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeOverlay();
                else if ((e.key === 'e' || e.key === 'E') && !e.repeat) setEvil(!evilOn);
                else if (e.code === 'Space' && !e.repeat) { e.preventDefault(); launch(); }
            });

            /* =====================================================================
               SAVE / LOAD
               ===================================================================== */
            function save() {
                if (resetting) return;
                try {
                    localStorage.setItem(SAVE_KEY, JSON.stringify({
                        v: 2, money: state.money, total: state.total, rp: state.rp, goo: state.goo, evil: state.evil, autoOn, dualReady: state.dualReady, levels: state.levels,
                        pegs: state.pegs.map(p => [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10, p.type === 'research' ? 'r' : p.type === 'dual' ? 'd' : p.type === 'splitter' ? 's' : 'b', p.left || 0, Math.round(p.dmg * 100) / 100]),
                    }));
                } catch (e) { }
            }
            function load() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return;
                    const d = JSON.parse(raw);
                    const pd = v => Number.isFinite(v) ? Math.min(0.99, Math.max(0, v)) : 0;   // saved peg damage
                    if (Number.isFinite(d.money)) state.money = d.money;
                    if (Number.isFinite(d.total)) state.total = d.total;
                    if (Number.isFinite(d.rp)) state.rp = d.rp;
                    if (Number.isFinite(d.goo)) state.goo = d.goo;
                    if (Number.isFinite(d.evil)) state.evil = d.evil;
                    if (typeof d.autoOn === 'boolean') autoOn = d.autoOn;
                    if (Array.isArray(d.dualReady)) state.dualReady = d.dualReady.filter(Number.isFinite).map(n => n | 0);
                    if (d.levels) for (const u of UPGRADES) if (Number.isFinite(d.levels[u.id])) state.levels[u.id] = d.levels[u.id] | 0;
                    worldH = worldHeight(L('depth'));
                    if (Array.isArray(d.pegs)) {
                        const lim = { basic: L('peg'), research: L('rpeg'), splitter: L('splitpeg') }, cnt = { basic: 0, research: 0, splitter: 0 };
                        for (const pt of d.pegs) {
                            if (!Array.isArray(pt) || !Number.isFinite(pt[0]) || !Number.isFinite(pt[1])) continue;
                            if (pt[2] === 'd') { if (Number.isFinite(pt[3]) && pt[3] > 0) addPeg(pt[0], pt[1], 'dual', pt[3] | 0, pd(pt[4])); continue; }
                            const type = pt[2] === 'r' ? 'research' : pt[2] === 's' ? 'splitter' : 'basic';
                            if (cnt[type] >= lim[type]) continue;
                            cnt[type]++;
                            addPeg(pt[0], pt[1], type, 0, pd(pt[4]));
                        }
                    }
                } catch (e) { }
            }
            setInterval(save, 5000);
            document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
            window.addEventListener('pagehide', save);

            /* =====================================================================
               MAIN LOOP
               ===================================================================== */
            load();
            resize();
            camY = camRange()[0];          // start looking at the top, where the launcher is
            refreshUI();

            let last = performance.now(), acc = 0, uiT = 0;
            function frame(t) {
                const dt = Math.min(100, t - last); last = t;

                // fixed-timestep physics, identical behaviour on 60 Hz and 120 Hz screens
                acc += dt;
                let n = 0;
                while (acc >= STEP && n < 6) { stepGame(STEP); acc -= STEP; n++; }
                if (n === 6) acc = 0;

                // momentum scrolling
                measurePads();
                if (!drag && Math.abs(camVel) > 4) {
                    camY += camVel * dt / 1000;
                    camVel *= Math.pow(0.04, dt / 1000);
                    const [lo, hi] = camRange();
                    if (camY < lo || camY > hi) camVel = 0;
                } else if (!drag) camVel = 0;
                clampCam();

                render(dt);

                uiT += dt;
                if (uiT > 100) { uiT = 0; refreshUI(); }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
