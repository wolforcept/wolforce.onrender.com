<!doctype html>
<html lang="en">

<head>
    <base href="./">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07051a">
    <title>Neon Pegs</title>
    <style>
        :root {
            --bg: #07051a;
            --cyan: #19f5ff;
            --mag: #ff2bd6;
            --lime: #b6ff2e;
            --orange: #ff9d1a;
            --violet: #8a5bff;
            --goo: #6bff1f;
            --gold: #ffd23a;
            --evil: #ff2a3d;
            --text: #e8e6ff;
            --dim: #8b86b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #03020c;
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            background: radial-gradient(120% 80% at 50% 0%, #1a1252 0%, var(--bg) 62%);
            box-shadow: 0 0 60px rgba(138, 91, 255, .25);
        }

        canvas#game {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none
        }

        /* ---------- evil mode: the whole screen turns red ---------- */
        #evilBg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .7s ease;
            background: radial-gradient(120% 80% at 50% 0%, #9c0f22 0%, #3d0510 62%)
        }

        #evilVig {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity .7s ease;
            box-shadow: inset 0 0 140px 20px rgba(255, 20, 50, .55);
            background: rgba(255, 20, 40, .07)
        }

        #app.evil #evilBg,
        #app.evil #evilVig {
            opacity: 1
        }

        #app.evil #hud {
            background: linear-gradient(#2a0409f2 55%, #2a040900)
        }

        #app.evil #bar {
            background: linear-gradient(#2a040900, #2a0409f0 38%)
        }

        #app.evil.ov #bar {
            background: rgba(30, 3, 8, .96)
        }

        /* ---------- HUD ---------- */
        /* The HUD stays visible on top of the shop (z-index above the overlay); the shop starts right below it. */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 22;
            pointer-events: none;
            padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: linear-gradient(#07051af2 70%, #07051a00);
        }

        /* row 1: every resource counter has the same size and the same width; the symbol sits right next to the number, centred with it */
        #resRow {
            display: flex;
            gap: 4px
        }

        .rc {
            flex: 1 1 0;
            min-width: 0;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 23px;
            font-weight: 800;
            line-height: 1.1;
            white-space: nowrap
        }

        .rc.on {
            display: flex
        }

        .rc svg {
            width: 21px;
            height: 21px;
            flex: none
        }

        #moneyBox {
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold), 0 0 20px rgba(255, 210, 58, .5)
        }

        #rpBox {
            color: var(--violet);
            text-shadow: 0 0 8px var(--violet), 0 0 20px rgba(138, 91, 255, .5)
        }

        #rpBox svg {
            filter: drop-shadow(0 0 4px var(--violet))
        }

        #gooBox {
            color: var(--goo);
            text-shadow: 0 0 8px var(--goo), 0 0 20px rgba(107, 255, 31, .45)
        }

        #gooBox svg {
            filter: drop-shadow(0 0 4px var(--goo))
        }

        #evilBox {
            color: var(--evil);
            text-shadow: 0 0 8px var(--evil), 0 0 20px rgba(255, 42, 61, .5)
        }

        #evilBox svg {
            filter: drop-shadow(0 0 4px var(--evil))
        }

        /* row 2: balls and pegs */
        #statRow {
            display: flex;
            gap: 10px
        }

        .st {
            flex: 1 1 0;
            text-align: center;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--dim);
            font-weight: 600
        }

        .st b {
            color: var(--mag);
            text-shadow: 0 0 8px rgba(255, 43, 214, .7);
            font-size: 13px
        }

        /* ---------- round buttons ---------- */
        .round {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid var(--violet);
            color: #fff;
            font-size: 15px;
            background: rgba(138, 91, 255, .16);
            box-shadow: 0 0 10px rgba(138, 91, 255, .55);
            cursor: pointer;
        }

        .round:active {
            transform: scale(.92)
        }

        /* ---------- bottom bar ---------- */
        #bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 25;
            pointer-events: none;
            padding: 26px 14px calc(env(safe-area-inset-bottom) + 12px);
            background: linear-gradient(#07051a00, #07051af0 38%);
        }

        #app.ov #bar {
            padding-top: 10px;
            background: rgba(5, 3, 20, .96);
            border-top: 1px solid rgba(138, 91, 255, .35)
        }

        #app.ov #hint {
            display: none
        }

        #hint {
            min-height: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            color: var(--lime);
            text-shadow: 0 0 8px rgba(182, 255, 46, .7);
            margin-bottom: 8px;
        }

        #hint.pulse {
            animation: pulse 1.4s ease-in-out infinite
        }

        @keyframes pulse {
            50% {
                opacity: .45
            }
        }

        #btns {
            display: flex;
            gap: 10px
        }

        .big {
            --k: var(--mag);
            flex: 1 1 0;
            min-width: 0;
            /* every bottom button gets the same width */
            pointer-events: auto;
            position: relative;
            height: 56px;
            border-radius: 16px;
            cursor: pointer;
            color: #fff;
            font: 800 15px/1 system-ui, sans-serif;
            letter-spacing: 3px;
            border: 2px solid var(--k);
            background: color-mix(in srgb, var(--k) 12%, transparent);
            text-shadow: 0 0 8px var(--k);
            box-shadow: 0 0 14px color-mix(in srgb, var(--k) 55%, transparent), inset 0 0 16px color-mix(in srgb, var(--k) 22%, transparent);
        }

        .big:active {
            transform: scale(.97)
        }

        .big.cant {
            opacity: .4;
            box-shadow: none
        }

        #launchBtn {
            --k: var(--cyan)
        }

        #launchBtn.autoon {
            background: color-mix(in srgb, var(--k) 42%, transparent);
            box-shadow: 0 0 24px var(--k), inset 0 0 20px color-mix(in srgb, var(--k) 45%, transparent)
        }

        #upBtn {
            --k: var(--mag)
        }

        #evilBtn {
            --k: var(--evil);
            display: none
        }

        #evilBtn.on {
            display: block
        }

        #evilBtn.active {
            background: color-mix(in srgb, var(--k) 42%, transparent);
            box-shadow: 0 0 24px var(--k), inset 0 0 20px color-mix(in srgb, var(--k) 45%, transparent)
        }

        #btns.three .big {
            letter-spacing: 1.5px;
            font-size: 13px
        }

        #upBtn.alert::after {
            content: "";
            position: absolute;
            top: 8px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 10px var(--lime);
            animation: pulse 1s ease-in-out infinite;
        }

        /* ---------- upgrades overlay (sits above the button bar so you can keep launching) ---------- */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--barH, 0px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            padding-top: var(--hudH, 0px);
            /* the HUD sits on top of the shop, so the shop starts below it */
            background: rgba(5, 3, 20, .86);
            /* no backdrop-filter: blurring the live canvas behind it is re-done every frame and is slow on phones */
            transform: translateY(100%);
            visibility: hidden;
            transition: transform .26s ease, visibility 0s .26s;
        }

        #overlay.open {
            transform: none;
            visibility: visible;
            transition: transform .26s ease, visibility 0s 0s
        }

        /* while the shop is open only the SHOP/CLOSE button stays in the bottom bar */
        #app.ov #launchBtn,
        #app.ov #evilBtn {
            display: none !important
        }

        #tabs {
            display: none;
            gap: 8px;
            padding: 10px 12px 0
        }

        #tabs.on {
            display: flex
        }

        .tab {
            flex: 1;
            position: relative;
            height: 38px;
            border-radius: 10px;
            border: 1.5px solid #4a4670;
            background: rgba(255, 255, 255, .04);
            color: var(--dim);
            font: 800 11px/1 system-ui, sans-serif;
            letter-spacing: 1px;
            cursor: pointer
        }

        .tab.sel {
            color: #fff;
            border-color: var(--k);
            background: color-mix(in srgb, var(--k) 16%, transparent);
            box-shadow: 0 0 10px color-mix(in srgb, var(--k) 55%, transparent)
        }

        #tabMoney {
            --k: var(--cyan)
        }

        #tabRp {
            --k: var(--violet)
        }

        #tabGoo {
            --k: var(--goo);
            display: none
        }

        #tabGoo.on {
            display: block
        }

        #tabEvil {
            --k: var(--evil);
            display: none
        }

        #tabEvil.on {
            display: block
        }

        .tab.alert::after {
            content: "";
            position: absolute;
            top: 6px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 8px var(--lime)
        }

        .card.hid {
            display: none
        }

        #list {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 28px;
        }

        .card {
            --c: var(--cyan);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 12px 12px 14px;
            border-radius: 14px;
            background: rgba(16, 12, 46, .72);
            border: 1px solid rgba(255, 255, 255, .08);
            border-left: 3px solid var(--c);
            box-shadow: 0 0 14px color-mix(in srgb, var(--c) 18%, transparent);
        }

        .card .name {
            font-weight: 800;
            font-size: 15px;
            color: var(--c);
            text-shadow: 0 0 8px color-mix(in srgb, var(--c) 70%, transparent)
        }

        .card .lvl {
            color: var(--dim);
            font-weight: 600;
            font-size: 12px;
            margin-left: 6px;
            text-shadow: none
        }

        .card .desc {
            font-size: 12px;
            color: #b9b5e0;
            margin-top: 3px;
            line-height: 1.35
        }

        .card .stat {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px
        }

        .card.locked {
            --c: #5d5a82;
            opacity: .65
        }

        .card.locked .name {
            text-shadow: none
        }

        .buy {
            min-width: 100px;
            min-height: 54px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid var(--c);
            background: color-mix(in srgb, var(--c) 14%, transparent);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-family: inherit;
            box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-y;
        }

        .buy .bl {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px
        }

        .buy .bc {
            font-size: 15px;
            font-weight: 800
        }

        .buy:active {
            transform: scale(.95)
        }

        .buy.cant {
            opacity: .38;
            box-shadow: none;
            border-color: #6b678f;
            background: rgba(255, 255, 255, .04)
        }

        .buy.maxed,
        .card.locked .buy {
            opacity: .4;
            box-shadow: none;
            cursor: default
        }

        /* a temporary upgrade that is running: bright green, glowing and twinkling */
        .buy.active {
            border-color: #6bff1f;
            background: rgba(107, 255, 31, .28);
            cursor: default;
            box-shadow: 0 0 10px #6bff1f, inset 0 0 8px rgba(107, 255, 31, .35);
            position: relative;
        }

        /* the twinkle only animates the opacity of an extra glow layer, which the GPU handles without repainting */
        .buy.active::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            pointer-events: none;
            box-shadow: 0 0 26px #6bff1f, 0 0 40px rgba(107, 255, 31, .6), inset 0 0 20px rgba(107, 255, 31, .8);
            animation: twinkle .9s ease-in-out infinite;
            will-change: opacity;
        }

        .buy.active .bc {
            font-size: 19px;
            color: #eaffd9;
            text-shadow: 0 0 8px #6bff1f, 0 0 16px #6bff1f
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0
            }

            35% {
                opacity: 1
            }

            60% {
                opacity: .25
            }

            80% {
                opacity: .75
            }
        }

        #resetBtn {
            display: block;
            margin: 22px auto 0;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #4a4670;
            background: none;
            color: var(--dim);
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="evilBg"></div>
        <canvas id="game"></canvas>
        <div id="evilVig"></div>

        <div id="hud">
            <div id="resRow">
                <div class="rc on" id="moneyBox"><span id="money">$0</span></div>
                <div class="rc" id="rpBox"><svg viewBox="0 0 24 24">
                        <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" fill="rgba(138,91,255,.25)" stroke="#8a5bff" stroke-width="2.2" stroke-linejoin="round" />
                    </svg><span id="rpNum">0</span></div>
                <div class="rc" id="gooBox"><svg viewBox="0 0 24 24">
                        <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z" fill="rgba(107,255,31,.3)" stroke="#6bff1f" stroke-width="2.2" stroke-linejoin="round" />
                    </svg><span id="gooNum">0</span></div>
                <div class="rc" id="evilBox"><svg viewBox="0 0 24 24">
                        <polygon points="12,2.5 14.4,9.3 21.5,9.4 15.8,13.7 17.9,20.6 12,16.5 6.1,20.6 8.2,13.7 2.5,9.4 9.6,9.3" fill="rgba(255,42,61,.3)" stroke="#ff2a3d" stroke-width="2" stroke-linejoin="round" />
                    </svg><span id="evilNum">0</span></div>
            </div>
            <div id="statRow">
                <div class="st">BALLS <b id="stBalls">0/1</b></div>
                <div class="st">PEGS <b id="stPegs">0</b></div>
            </div>
        </div>

        <div id="bar">
            <div id="hint"></div>
            <div id="btns">
                <button id="launchBtn" class="big" type="button">LAUNCH</button>
                <button id="evilBtn" class="big" type="button">EVIL</button>
                <button id="upBtn" class="big" type="button">SHOP</button>
            </div>
        </div>

        <div id="overlay" aria-hidden="true">
            <div id="tabs">
                <button class="tab sel" id="tabMoney" type="button">MONEY</button>
                <button class="tab" id="tabRp" type="button">RESEARCH</button>
                <button class="tab" id="tabGoo" type="button">GOO</button>
                <button class="tab" id="tabEvil" type="button">EVIL</button>
            </div>
            <div id="list"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        (() => {
            'use strict';

            /* =====================================================================
               CONFIG
               ===================================================================== */
            const W = 360;                              // logical world width (height grows with upgrades)
            const STEP = 1000 / 90;                     // fixed physics step (ms)
            const PEG_R = 9;
            // pegs get slightly smaller the lower they are placed: negligible near the top, up to 15% smaller at a depth of 1500 (about 8 Taller World levels)
            const PEG_SHRINK = 0.15, SHRINK_DEPTH = 1500;
            const pegRadius = y => PEG_R * (1 - PEG_SHRINK * Math.min(1, Math.pow(Math.max(0, y) / SHRINK_DEPTH, 2)));
            const LAUNCH_Y = 38;                        // ball leaves the cannon just below the ceiling
            const BUCKET_X = W / 2;
            const LAUNCH_SPEED = 3;                     // initial downward speed (px per physics step)
            const SWEEP_MS = 3600;                      // time for one full left-right-left sweep
            const SWEEP_MARGIN = 26;                    // how close the cannon gets to the walls
            const MAX_SPEED = 22;
            const GRAVITY_SCALE = 0.0004;
            const G_STEP = GRAVITY_SCALE * (1000 / 60) * (1000 / 60);   // gravity in Matter's px/step^2
            const PALETTE = ['#19f5ff', '#ff2bd6', '#b6ff2e', '#ff9d1a', '#8a5bff'];
            const GOLD = '#ffd23a';
            const BALL_GLOWS = ['#3d8bff', '#4da3ff', '#19a8ff', '#5b7bff', '#7a4dff', '#8a5bff', '#a56bff', '#b78cff'];   // each ball gets a random bluish or purplish glow
            const randGlow = () => BALL_GLOWS[(Math.random() * BALL_GLOWS.length) | 0];
            const PEG_TYPES = { basic: { color: '#ffffff' }, research: { color: '#8a5bff' }, dual: { color: '#ffd23a' }, splitter: { color: '#4da3ff' }, gravity: { color: '#2effb0' } };   // more peg types (other colours, other effects) go here
            const GRAVPEG_R = 90;                       // how far a gravity peg reaches (px)
            const GRAVPEG_PULL = 0.06;                  // strongest pull, right next to the peg (px per physics step^2); normal gravity is about 0.11, so this is only a nudge
            const SAVE_KEY = 'neonpegs.save.v2';

            /* =====================================================================
               UPGRADES  (data driven: add an object here and it shows up in the list)
               ===================================================================== */
            // Each level adds less height than the one before, but the sum never stops growing (a power below 1 has no asymptote).
            // Level 8 still gives the same 1479 as the old linear formula.
            const worldHeight = l => Math.round(360 + 191 * Math.pow(l, 0.85));
            // Soft limits: asymptote(l) = LIMIT - (LIMIT - START) * RATE^l. Always increasing, never reaching LIMIT, so these can be bought without end.
            const soft = (start, limit, rate, l) => limit - (limit - start) * Math.pow(rate, l);
            const spreadDeg = l => soft(1, 60, 0.95, l);                 // total random launch range, in degrees (soft limit 60)
            const bucketW = l => soft(160, 280, 0.89, l);                // soft limit 280 (keeps 7 buckets plus gaps inside the board)
            const bucketValue = l => 1 + l;
            const restitution = l => soft(0.5, 0.9, 0.96, l);            // bounce: very slow growth, never reaches 90%
            const ballRadius = l => soft(6, 14, 0.93, l);                // soft limit 14
            const rpRate = l => 0.1 * l;                                 // research points per second
            const RP_PEG = 0.5;                                          // research points per research-peg hit
            const autoInterval = l => 2000 * Math.pow(0.85, l - 1);      // ms between automatic drops
            const bucketCount = l => l >= 20 ? 7 : l >= 15 ? 6 : l >= 10 ? 5 : l >= 7 ? 4 : l >= 4 ? 3 : l >= 1 ? 2 : 1;
            const BUCKET_GAP = 12;                                       // empty space between neighbouring buckets (a ball falling in the gap is lost)
            const midMult = l => 1 + 0.5 * l;                            // value multiplier of the middle bucket
            const MONEY_MAX = 5;                                         // base max level of the normal money upgrades
            const GOO_COL = '#6bff1f';                                   // acid green
            const GOO_MAX = 10;                                          // research levels of Phlegm Goo
            const gooChance = l => l <= 0 ? 0 : 0.01 + 0.04 * (1 - Math.pow(0.75, l - 1)) / (1 - Math.pow(0.75, GOO_MAX - 1));   // 1% at level 1, 5% at max level, diminishing steps
            const GOLD_CHANCE = 0.05;                                     // chance that a launched ball is a gold ball (once researched)
            const goldMult = l => l <= 0 ? 1 : 2 + 0.25 * (l - 1);       // money multiplier of gold balls: x2 at level 1, slowly rising
            const GOOBALL_PEGS = 10;                                     // a gooball vanishes after touching this many pegs
            const GOO_PEG_MS = 12000;                                    // how long a pegs stays goo-coated
            const GOO_PER_HIT = 1;                                       // Phlegm Goo per (non-goo) ball hit on a goo peg
            const DUAL_HITS = 5, DUAL_MULT = 100;                        // dual peg: hits before it vanishes, reward multiplier
            const BURST_MS = 8000, BURST_CD = 30000;                     // ball burst: duration, cooldown after it ends
            const GHOST_MS = 10000;                                      // ghost balls duration
            const GRAV_MS = 10000, GRAV_MULT = 5;                        // heavy gravity: duration, gravity multiplier
            const DEAD_MS = 10000, DEAD_REST = 0.02;                     // dead balls: duration, bounciness while active (pegs and walls too, since Matter uses the higher of the two)
            const CHAOS_MS = 10000, CHAOS_CD = 30000;                    // chaos balls: duration, cooldown
            const GHOST_CD = 30000, GRAV_CD = 30000, DEAD_CD = 30000;   // cooldowns of the temporary goo upgrades, counted after they end (ball burst: BURST_CD)
            // button state of a temporary upgrade: running, cooling down, or ready (null)
            const tmr = (t, cd) => t > 0 ? { active: true, s: Math.ceil(t / 1000) } : cd > 0 ? { active: false, s: Math.ceil(cd / 1000) } : null;
            const GOO_BASE_CAP = 100, GOO_CAP_STEP = 50;                 // the most Phlegm Goo you can hold: starts at 100, +50 per Goo Tank level
            const gooCap = (l = L('goocap')) => GOO_BASE_CAP + GOO_CAP_STEP * l;
            const edgeMult = l => 1 / (1 + 0.1 * l);                     // value multiplier of the outermost buckets

            // upgrade card colour = the colour of the resource it is paid with
            const RES_COL = { money: '#ffffff', rp: '#8a5bff', goo: '#6bff1f', evil: '#ff2a3d' };

            /* ---- evil: a 4th resource (red star). While the Evil toggle is on, every peg hit damages the peg and yields evil ---- */

            const EVIL_COST = 1000;                                      // research points needed to unlock evil
            const EVIL_BASE = 0.01;                                      // evil per hit on an undamaged peg; grows towards 1 as the peg gets damaged

            const evilRegen = l => 0.02 * (1 + 0.6 * l);                 // damage healed per second while evil is off
            const evilYield = l => 1 + 0.25 * l;                         // multiplier on all evil gained

            const UPGRADES = [
                {
                    id: 'peg', name: 'New Peg', color: '#19f5ff', base: 5, growth: 1.13, max: 0, unlock: 0,

                },
                {
                    id: 'balls', name: 'Extra Ball', color: '#ff9d1a', base: 50, growth: 2.4, max: MONEY_MAX, unlock: 30,

                    id: 'power', name: 'Peg Power', color: '#ff2bd6', base: 120, growth: 1.8, max: MONEY_MAX, unlock: 60,

                },
                {
                    id: 'research', name: 'Research Lab', color: '#8a5bff', base: 1000, growth: 1.7, max: MONEY_MAX, unlock: 120,

                },
                {
                    id: 'wide', name: 'Wide Bucket', color: '#b6ff2e', base: 120, growth: 1.9, max: MONEY_MAX, unlock: 200,

                },
                {
                    id: 'spread', name: 'Wild Launch', color: '#ff9d1a', base: 200, growth: 2.0, max: MONEY_MAX, unlock: 250,
                    desc: 'The launch angle gets more random: balls spread out and reach more pegs.',

                },
                {
                    id: 'combo', name: 'Combo Chain', color: '#19f5ff', base: 400, growth: 1.7, max: MONEY_MAX, unlock: 400,

                },
                {
                    id: 'gold', name: 'Golden Pegs', color: '#ffd23a', base: 900, growth: 2.0, max: MONEY_MAX, unlock: 800,

                },

                },

                },

                /* ---- research tab: these cost research points (cur: 'rp') ---- */
                {

                },

                    desc: 'Splits the bottom into several separate buckets: 2 at level 1, then 3, 4, 5, 6 and 7 (at levels 4, 7, 10, 15 and 20). The middle ones pay more and the outer ones less, and every level widens the gap. Balls that fall between buckets are lost.',

                    stat: l => `${(gooChance(l) * 100).toFixed(1)}% gooball chance`
                },

                {
                    id: 'evil', cur: 'rp', fixed: true, name: 'Evil', color: '#ff2a3d', base: EVIL_COST, growth: 1, max: 1, unlock: 0,
                    desc: 'Unlocks the Evil toggle, the Evil resource (red star) and a new Evil tab. While Evil is on, every peg that is hit takes damage, turns redder and yields Evil. Destroyed pegs must be placed again. Pegs heal while Evil is off.',
